<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐴🕺 Dancing Horse Revolution - 仁王立ちダンシングホース音ゲー</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="980" height="620"></canvas>
    </div>
    <div id="instructions">
        <span>【選曲】 <kbd>↑</kbd> <kbd>↓</kbd> / クリック : 曲選択 | <kbd>←</kbd> <kbd>→</kbd> : 難易度切替 | <kbd>Space</kbd> /
            <kbd>Enter</kbd> : 開始</span>
        <br>
        <span style="font-size: 11.5px; opacity: 0.85;">【プレイ】 <kbd>←</kbd> <kbd>↑</kbd> <kbd>↓</kbd> <kbd>→</kbd> /
            <kbd>A</kbd> <kbd>W</kbd> <kbd>S</kbd> <kbd>D</kbd> : ステップ | <kbd>Tab</kbd> : 仁王立ち/四足切替 |
            <kbd>Space</kbd> : フィーバー | <kbd>Esc</kbd> / <kbd>P</kbd> / 右上MENUボタン : ポーズ・曲選択（ホーム）へ戻る</span>
    </div>
    <script src="game.js"></script>
</body>

</html>
