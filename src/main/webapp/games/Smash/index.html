</div>

<div class="panel-row hidden" id="map-step-row">

</div>

<div class="panel-row hidden" id="char-step-row">

</div>

<div id="stage-chat-layout">

    </div>
  </aside>
</div>

<div id="controls-guide">

// ハンマー状態同期用（会心突入時刻・5秒経過後の被弾カウント）
function ensureHammerCritState(entity, nowMs = performance.now()) {
  if (!entity || entity.charKey !== "hammer") return;
  if (typeof entity.critLightHitsAfterExpiry !== "number") {
    entity.critLightHitsAfterExpiry = 0;
  }
  if ((entity.hammerCharge || 0) >= HAMMER_CRIT_THRESHOLD) {
    if (!entity.critReady) {
      entity.critReady = true;
      entity.critStartedAt = nowMs;
      entity.critLightHitsAfterExpiry = 0;
    } else if (!entity.critStartedAt) {
      entity.critStartedAt = nowMs;
    }
  }
}

function isHammerCritState(entity, nowMs = performance.now()) {
  if (!entity || entity.charKey !== "hammer") return false;
  ensureHammerCritState(entity, nowMs);
  return !!(entity.critActive || entity.critReady || (entity.hammerCharge || 0) >= HAMMER_CRIT_THRESHOLD);
}

function isHammerAbsoluteCritMode(entity, nowMs = performance.now()) {
  if (!isHammerCritState(entity, nowMs)) return false;
  const elapsed = nowMs - (entity.critStartedAt || nowMs);
  return elapsed < HAMMER_CRIT_ABS_DURATION_MS;
}

function getHammerRemainingAbsSec(entity, nowMs = performance.now()) {
  if (!isHammerCritState(entity, nowMs)) return 0;
  const rem = HAMMER_CRIT_ABS_DURATION_MS - (nowMs - (entity.critStartedAt || nowMs));
  return Math.max(0, rem / 1000);
}

function resetHammerCritAndCharge(entity) {
  if (!entity) return;
  entity.hammerCharge = 0;
  entity.critReady = false;
  entity.critActive = false;
  entity.critStartedAt = 0;
  entity.critLightHitsAfterExpiry = 0;
}

function handleHammerHitProgress(entity, wasCrit) {
  if (!entity || entity.charKey !== "hammer") return;
  const nowMs = performance.now();
  if (wasCrit) {
    // 会心攻撃が当たったら消費し、蓄積0へリセット
    resetHammerCritAndCharge(entity);
  } else {
    // 通常攻撃ヒット時のみ +20 蓄積し、120以上で会心状態（5秒絶対会心スタート）
    entity.hammerCharge = (entity.hammerCharge || 0) + HAMMER_HIT_GAIN;
    if (entity.hammerCharge >= HAMMER_CRIT_THRESHOLD && !entity.critReady) {
      entity.critReady = true;
      entity.critStartedAt = nowMs;
      entity.critLightHitsAfterExpiry = 0;
    }
  }
}

function handleHammerIncomingHit(entity, wasSmash, wasLight, nowMs = performance.now()) {
  if (!entity || entity.charKey !== "hammer") return { changed: false, resetOccurred: false };

  const inCrit = isHammerCritState(entity, nowMs);
  const absMode = isHammerAbsoluteCritMode(entity, nowMs);

  // 5秒間の絶対会心モード中は被弾しても会心維持＆蓄積変動なし
  if (inCrit && absMode) {
    return { changed: false, resetOccurred: false };
  }

  // 会心状態だが5秒を超えている場合：相手スマッシュ1回 or L攻撃2回で会心解除＆蓄積0リセット
  if (inCrit && !absMode) {
    if (wasSmash) {
      resetHammerCritAndCharge(entity);
      return { changed: true, resetOccurred: true };
    }
    if (wasLight) {
      entity.critLightHitsAfterExpiry = (entity.critLightHitsAfterExpiry || 0) + 1;
      if (entity.critLightHitsAfterExpiry >= HAMMER_EXPIRED_LIGHT_RESET_COUNT) {
        resetHammerCritAndCharge(entity);
        return { changed: true, resetOccurred: true };
      }
      return { changed: true, resetOccurred: false };
    }
    return { changed: false, resetOccurred: false };
  }

  // 会心状態ではない場合：相手からスマッシュ+10 / L攻撃+5 蓄積（120到達で会心5秒開始）
  let gain = 0;
  if (wasSmash) gain = HAMMER_HIT_SMASH_GAIN;
  else if (wasLight) gain = HAMMER_HIT_LIGHT_GAIN;

  if (gain > 0) {
    entity.hammerCharge = (entity.hammerCharge || 0) + gain;
    if (entity.hammerCharge >= HAMMER_CRIT_THRESHOLD && !entity.critReady) {
      entity.critReady = true;
      entity.critStartedAt = nowMs;
      entity.critLightHitsAfterExpiry = 0;
    }
    return { changed: true, resetOccurred: false };
  }

  return { changed: false, resetOccurred: false };
}

function rectsOverlap(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

function segmentIntersectsRect(x1, y1, x2, y2, rx, ry, rw, rh) {
  let t0 = 0;
  let t1 = 1;
  const dx = x2 - x1;
  const dy = y2 - y1;

  const checks = [
    [-dx, x1 - rx],
    [dx, rx + rw - x1],
    [-dy, y1 - ry],
    [dy, ry + rh - y1]
  ];

  for (let i = 0; i < checks.length; i++) {
    const p = checks[i][0];
    const q = checks[i][1];
    if (Math.abs(p) < 1e-9) {
      if (q < 0) return false;
    } else {
      const r = q / p;
      if (p < 0) {
        if (r > t1) return false;
        if (r > t0) t0 = r;
      } else {
        if (r < t0) return false;
        if (r < t1) t1 = r;
      }
    }
  }
  return t0 <= t1;
}

function getAllStageObstacles() {
  const st = getCurrentStage();
  return [...(st.solids || []), ...(st.platforms || [])];
}

function isBlockedByStageSegment(x1, y1, x2, y2) {
  const obstacles = getAllStageObstacles();
  for (let i = 0; i < obstacles.length; i++) {
    const ob = obstacles[i];
    if (segmentIntersectsRect(x1, y1, x2, y2, ob.x, ob.y, ob.w, ob.h)) {
      return true;
    }
  }
  return false;
}

function doesMeleeHitEntity(hb, originX, originY, target) {
  if (!rectsOverlap(hb, target)) return false;
  const tx = target.x + target.w * 0.5;
  const ty = target.y + target.h * 0.5;
  return !isBlockedByStageSegment(originX, originY, tx, ty);
}

function getClippedBeamRect(bm) {
  const obstacles = getAllStageObstacles();
  const bx = bm.x;
  const by = bm.y;
  const bw = bm.w;
  const bh = bm.h;
  const midY = by + bh * 0.5;

  if (bm.dir === 1) {
    let endX = bx + bw;
    const startX = bx;
    for (let i = 0; i < obstacles.length; i++) {
      const ob = obstacles[i];
      if (midY >= ob.y && midY <= ob.y + ob.h && ob.x + ob.w > startX && ob.x < endX) {
        endX = Math.max(startX, ob.x);
      }
    }
    return { x: startX, y: by, w: Math.max(0, endX - startX), h: bh };
  } else {
    let startX = bx;
    const endX = bx + bw;
    for (let i = 0; i < obstacles.length; i++) {
      const ob = obstacles[i];
      if (midY >= ob.y && midY <= ob.y + ob.h && ob.x < endX && ob.x + ob.w > startX) {
        startX = Math.min(endX, ob.x + ob.w);
      }
    }
    return { x: startX, y: by, w: Math.max(0, endX - startX), h: bh };
  }
}

function pushChatMessage(msg) {
  if (phase === "playing") return;
  const text = String(msg.text || "").trim().slice(0, 80);
  if (!text) return;
  const roleNum = Number(msg.role) || 0;
  chatMessages.push({
    sender: sanitizePlayerName(msg.sender, roleNum),
    color: sanitizeColorHex(msg.color, roleNum || 1),
    text
  });
  if (chatMessages.length > CHAT_MAX_ITEMS) {
    chatMessages = chatMessages.slice(-CHAT_MAX_ITEMS);
  }
  renderChatLogDOM();
}

function sendChatMessage() {
  if (!canSendOrShowChat()) return;
  const text = (chatInputEl.value || "").trim().slice(0, 80);
  if (!text) return;

  const payload = {
    type: "chat",
    sender: sanitizePlayerName(myName, myRole),
    role: myRole,
    color: sanitizeColorHex(myColor, myRole || 1),
    text
  };
  pushChatMessage(payload);
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(payload));
  }
  chatInputEl.value = "";
}

function isRoleSpectating(r) {
  if (r === myRole && isSpectator) return true;
  if (spectatorRoles.has(r)) return true;
  return !!(players[r] && players[r].spectator);
}

function getParticipantRoles() {
  return activeRoles.filter(r => !isRoleSpectating(r));
}

function getDisplayNameOfRole(roleNum) {
  if (roleNum === myRole && myName) return myName;
  const p = players[roleNum];
  if (p && p.name) return p.name;
  return `Player${roleNum}`;
}

function getColorOfRole(roleNum) {
  if (roleNum === myRole) return sanitizeColorHex(myColor, roleNum);
  const p = players[roleNum];
  if (p && p.color) return sanitizeColorHex(p.color, roleNum);
  return sanitizeColorHex(PLAYER_COLORS[roleNum], roleNum);
}

function getTakenColorsByOthers() {
  const taken = new Set();
  for (const r of activeRoles) {
    if (r === myRole) continue;
    const p = players[r];
    if (p && p.color) {
      taken.add(sanitizeColorHex(p.color, r));
    }
  }
  return taken;
}

function ensureNonConflictingColor() {
  if (isPublicLobbyRoom()) {
    myColor = myPreferredColor;
    if (myRole !== 0 && players[myRole]) {
      players[myRole].color = myColor;
    }
    return;
  }
  const taken = getTakenColorsByOthers();
  const desired = sanitizeColorHex(myPreferredColor, myRole || 1);
  if (!taken.has(desired)) {
    myColor = desired;
  } else {
    const freeColor = ALLOWED_COLORS.find(c => !taken.has(c));
    myColor = freeColor || desired;
  }
  if (myRole !== 0 && players[myRole]) {
    players[myRole].color = myColor;
  }
}

function sendProfileSync() {
  if (isPublicLobbyRoom()) return;
  if (ws && ws.readyState === WebSocket.OPEN && !entryBlockedByHost && !isRoomFullBlocked && myRole !== 0) {
    ws.send(JSON.stringify({
      type: "profile",
      role: myRole,
      name: sanitizePlayerName(myName, myRole),
      color: sanitizeColorHex(myColor, myRole),
      spectator: isSpectator
    }));
  }
}

function renderColorPalette() {
  const taken = getTakenColorsByOthers();
  const canPickColor = !isPublicLobbyRoom() && !entryBlockedByHost && !isRoomFullBlocked && myRole !== 0 && (phase === "map_select" || phase === "char_select");
  const buttons = Array.from(colorPaletteEl.querySelectorAll(".color-swatch-btn"));

  buttons.forEach(btn => {
    const hex = btn.dataset.color;
    const isMine = sanitizeColorHex(myColor, myRole || 1) === hex;
    const isTakenByOther = !isPublicLobbyRoom() && taken.has(hex);

    btn.classList.toggle("active", isMine);
    btn.disabled = !canPickColor || (!isMine && isTakenByOther);
    const labelEl = btn.querySelector(".swatch-text");
    const baseLabel = btn.dataset.label;
    if (labelEl) {
      labelEl.textContent = isTakenByOther && !isMine ? `${baseLabel}(使用中)` : baseLabel;
    }
  });
}

function initColorPaletteDOM() {
  colorPaletteEl.innerHTML = "";

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "color-swatch-btn";
    btn.dataset.color = item.hex.toLowerCase();
    btn.dataset.label = item.label;

    const dot = document.createElement("span");
    dot.className = "color-dot";
    dot.style.backgroundColor = item.hex;

    const text = document.createElement("span");
    text.className = "swatch-text";
    text.textContent = item.label;

    btn.appendChild(dot);
    btn.appendChild(text);

    btn.addEventListener("click", () => {
      if (isPublicLobbyRoom() || entryBlockedByHost || isRoomFullBlocked || myRole === 0 || (phase !== "map_select" && phase !== "char_select")) return;
      const chosen = item.hex.toLowerCase();
      if (getTakenColorsByOthers().has(chosen)) return;
      myPreferredColor = chosen;
      myColor = chosen;
      localStorage.setItem("smash_player_color", myPreferredColor);
      if (players[myRole]) players[myRole].color = myColor;
      renderColorPalette();
      sendProfileSync();
    });

    colorPaletteEl.appendChild(btn);
  });
  renderColorPalette();
}

    ? `合言葉「${currentPassphrase}」（最大4人）`
    : `公開待機部屋（最大${MAX_LOBBY_PLAYERS}人）`;
  const isLobby = isPublicLobbyRoom();
  colorRow.classList.toggle("hidden", isLobby);
  mapStepRow.classList.toggle("hidden", isLobby);
  charStepRow.classList.toggle("hidden", isLobby);
  renderColorPalette();
  updateChatVisibility();
}

function normalizeRolesList(list) {
  if (!Array.isArray(list)) return [];
  const cap = getRoomCapacity();
  return [...new Set(list)]
    .map(n => Number(n))
    .filter(n => Number.isInteger(n) && n >= 1 && n <= cap)
    .sort((a, b) => a - b);
}

function pruneGhostRoles(list) {
  const base = normalizeRolesList(list);
  if (!ghostFilterActive) return base;
  return base.filter(r => r === myRole || seenPeerRoles.has(r));
}

function isHostPresentInList(list) {
  if (isPublicLobbyRoom()) return true;
  const roles = pruneGhostRoles(list);
  if (roles.length === 0) return false;
  if (fixedHostThisPc && myRole !== 0 && roles.includes(myRole)) return true;
  return roles.includes(1);
}

function getCurrentStage() {
  return STAGES[currentStageKey] || STAGES.battlefield;
}

function getSpawnPoint(roleNum) {
  const st = getCurrentStage();
  return (st.spawns && st.spawns[roleNum]) || st.spawns[1];
}

function findSolidBeneath(cx, footY) {
  const st = getCurrentStage();
  for (const s of st.solids) {
    if (cx >= s.x - 10 && cx <= s.x + s.w + 10 && footY <= s.y + 40) return s;
  }
  return st.solids[0];
}

function getTeamOfRole(role) {
  if (gameMode !== "team2v2") return null;
  return (role === 1 || role === 2) ? "A" : "B";
}

function isSameTeam(roleA, roleB) {
  if (gameMode !== "team2v2") return false;
  return getTeamOfRole(roleA) === getTeamOfRole(roleB);
}

function getMaxJumpsForPlayer(p) {
  const spec = CHAR_SPECS[p.charKey] || CHAR_SPECS.fighter;
  return spec.maxJumps || 2;
}

function getEffectiveMoveAcc(p, spec) {
  if (p.charKey === "enhancer") {
    return spec.moveAcc * (1 + (p.enhanceLevel || 0) * 0.14);
  }
  return spec.moveAcc;
}

function getEffectiveLightStats(p, spec) {
  if (p.charKey === "enhancer") {
    const lv = p.enhanceLevel || 0;
    return {
      dmg: Math.round(spec.lightDmg + lv * 2.5),
      basePower: 6.5 * (1 + lv * 0.24)
    };
  }
  return { dmg: spec.lightDmg, basePower: 6.5 };
}

function calcMagicPowerFromMp(spentMp) {
  const clamped = Math.max(10, Math.min(MAX_MP, spentMp));
  const ratio = (clamped - 10) / (MAX_MP - 10);
  return {
    dmg: Math.round(3 + ratio * 77),
    basePower: 2.5 + ratio * 11.0,
    maxRadius: 125 + ratio * 125
  };
}

function clearTimers() {
  if (countdownTimerId) {
    clearInterval(countdownTimerId);
    countdownTimerId = null;
  }
}

function resetSinglePlayer(p, roleNum) {
  if (!p) return;
  const sp = getSpawnPoint(roleNum);
  const spec = CHAR_SPECS[p.charKey] || CHAR_SPECS.fighter;
  p.x = sp.x; p.y = sp.y;
  p.vx = 0; p.vy = 0;
  p.percent = 0; p.stocks = MAX_STOCK; p.stun = 0;
  p.jumps = spec.maxJumps || 2; p.facing = sp.facing;
  p.dropThroughTimer = 0;
  p.atkType = null; p.atkTimer = 0; p.cooldown = 0; p.hasHit = false;
  p.smashCharging = false; p.smashChargeStart = 0; p.smashChargeRatio = 0;
  p.enhanceLevel = 0; p.enhanceCooldownUntil = 0;
  resetHammerCritAndCharge(p);
  p.guardianHits = 0; p.invincibleTimer = 0;
  p.summonCooldownUntil = 0; p.hasClone = false;
  p.mp = MAX_MP; p.magicMode = "fire"; p.frozen = false;
  p.shielding = false; p.shieldHp = MAX_SHIELD; p.burnedOut = false;
}

function promoteSpectatorsToParticipants() {
  isSpectator = false;
  spectatorRoles.clear();
  for (let r = 1; r <= MAX_BATTLE_PLAYERS; r++) {
    if (players[r]) players[r].spectator = false;
  }
}

function syncActivePlayersFromRoles() {
  if (isPublicLobbyRoom()) {
    for (let r = 1; r <= MAX_BATTLE_PLAYERS; r++) players[r].active = false;
    return;
  }
  for (let r = 1; r <= MAX_BATTLE_PLAYERS; r++) {
    const inRoom = !entryBlockedByHost && !isRoomFullBlocked && activeRoles.includes(r);
    players[r].spectator = spectatorRoles.has(r) || (r === myRole && isSpectator);
    players[r].active = inRoom && !(phase === "playing" && players[r].spectator);
  }
}

function resetPlayersForNewMatch() {
  for (let r = 1; r <= MAX_BATTLE_PLAYERS; r++) resetSinglePlayer(players[r], r);
  projectiles = [];
  beams = [];
  ringEffects = [];
  burnDebuffs = [];
  clones = {};
  winnerInfo = null;
  gameOverSent = false;
}

function isHost() {
  if (isPublicLobbyRoom()) return false;
  if (entryBlockedByHost || isRoomFullBlocked || isSpectator || myRole === 0 || activeRoles.length === 0) return false;
  if (fixedHostThisPc) return true;
  return myRole === 1;
}

function isRoleHost(r) {
  if (isPublicLobbyRoom()) return false;
  if (isRoleSpectating(r)) return false;
  if (fixedHostThisPc && r === myRole && !entryBlockedByHost && !isRoomFullBlocked) return true;
  return r === 1 && activeRoles.includes(1);
}

function areAllPlayersReady() {
  if (isPublicLobbyRoom() || entryBlockedByHost || isRoomFullBlocked) return false;
  const participants = getParticipantRoles();
  if (participants.length < 1) return false;
  return participants.every(r => readyRoles.has(r));
}

function syncReadyRolesToActive() {
  const participantSet = new Set(getParticipantRoles());
  readyRoles = new Set([...readyRoles].filter(r => participantSet.has(r)));
}

function updateLoopUI() {
  hostLockBtn.classList.toggle("active", fixedHostThisPc);
  hostLockBtn.textContent = fixedHostThisPc ? "🔒 固定ホスト：ON" : "🔓 固定ホスト：OFF";

  if (isPublicLobbyRoom()) {
    mapStepRow.classList.add("hidden");
    charStepRow.classList.add("hidden");
    colorRow.classList.add("hidden");
    roomProfileRow.classList.remove("disabled-area");
    updateChatVisibility();
    return;
  }

  colorRow.classList.remove("hidden");
  mapStepRow.classList.remove("hidden");
  charStepRow.classList.remove("hidden");

  const inBattleOrResult = (phase === "playing" || phase === "gameover");
  const lockedOut = entryBlockedByHost || isRoomFullBlocked;
  roomProfileRow.classList.toggle("disabled-area", inBattleOrResult || lockedOut);
  inlineNameInput.disabled = inBattleOrResult || lockedOut;
  saveInlineNameBtn.disabled = inBattleOrResult || lockedOut;

  const host = isHost();
  const canEditMap = !lockedOut && !inBattleOrResult && host;
  stageSelectEl.value = currentStageKey;
  modeSelectEl.value = gameMode;
  stageSelectEl.disabled = !canEditMap;
  modeSelectEl.disabled = !canEditMap;
  confirmMapBtn.disabled = !canEditMap || phase !== "map_select";
  confirmMapBtn.textContent = phase === "map_select" ? "このマップでキャラ選択へ" : "マップ確定済";
  hostLockBtn.disabled = lockedOut || isSpectator || inBattleOrResult;
  resetGhostBtn.disabled = !canEditMap;

  const inCharPhase = (phase === "char_select" || phase === "countdown");
  const myReady = readyRoles.has(myRole);
  const canEditChar = !lockedOut && !isSpectator && inCharPhase && myRole !== 0 && !myReady;

  charStepRow.classList.toggle("disabled-area", !inCharPhase || lockedOut || isSpectator);
  charSelectDropdown.value = selectedChar;
  charSelectDropdown.disabled = !canEditChar;
  charDescInline.textContent = `(${CHAR_SPECS[selectedChar].desc})`;

  readyToggleBtn.disabled = lockedOut || isSpectator || !inCharPhase || myRole === 0;
  readyToggleBtn.classList.toggle("ready-active", myReady);
  readyToggleBtn.textContent = myReady ? "✋ 完了を取り消す" : "✅ 完了にする";

  backToMapBtn.disabled = !canEditMap || !inCharPhase;

  const participants = getParticipantRoles();
  const validReadyCount = participants.filter(r => readyRoles.has(r)).length;
  readySummaryEl.textContent = phase === "countdown"
    ? `全員完了！ 開始まで ${countdownLeft} 秒`
    : `完了：${validReadyCount}/${participants.length}人`;

  renderColorPalette();
  updateChatVisibility();
}

function updateRoomStatusBox() {
  const cap = getRoomCapacity();
  if (isPublicLobbyRoom()) {
    const shown = activeRoles.slice(0, 12).map(r => `${getDisplayNameOfRole(r)}(待機${r}P)`).join(" / ");
    const extra = activeRoles.length > 12 ? ` 外${activeRoles.length - 12}人` : "";
    roomStatusEl.textContent = `【公開待機部屋】待機中：${activeRoles.length}/${cap}人（${activeRoles.length ? shown + extra : "なし"}） ｜ 合言葉を入力して4人部屋へ`;
    return;
  }

  if (isRoomFullBlocked) {
    roomStatusEl.textContent = `【合言葉「${currentPassphrase}」】満員（${MAX_BATTLE_PLAYERS}/${MAX_BATTLE_PLAYERS}人）のため入室できません`;
    return;
  }

  const phaseLabelMap = {
    map_select: "①マップ決定中",
    char_select: "②キャラ選択・完了待ち",
    countdown: `③開始カウント(${countdownLeft}秒)`,
    playing: "④バトル中",
    gameover: "結果表示中"
  };

  const memberList = activeRoles.length > 0
    ? activeRoles.map(r => {
        const pName = getDisplayNameOfRole(r);
        const specMark = isRoleSpectating(r) ? "[観戦]" : "";
        const hostMark = isRoleHost(r) ? "(ホスト)" : "";
        const readyMark = (!isRoleSpectating(r) && (phase === "char_select" || phase === "countdown"))
          ? (readyRoles.has(r) ? "[完了]" : "[選択中]")
          : "";
        return `${pName}${hostMark}${specMark}${readyMark}`;
      }).join(" / ")
    : "なし";

  roomStatusEl.textContent = `【合言葉「${currentPassphrase}」】${activeRoles.length}/${cap}人（${memberList}） ｜ マップ：${getCurrentStage().name} ｜ 段階：${phaseLabelMap[phase] || phase}`;
}

function updateStatusByPhase() {
  const cap = getRoomCapacity();
  const displayMyName = myName || "未設定";
  if (isPublicLobbyRoom()) {
    statusEl.textContent = `[公開待機部屋] ${displayMyName}（待機${myRole || "-"}P） ｜ 待機中: ${activeRoles.length}/${cap}人`;
    return;
  }

  if (isRoomFullBlocked) {
    statusEl.textContent = `🚫 [合言葉:${currentPassphrase}] 満員（${MAX_BATTLE_PLAYERS}/${MAX_BATTLE_PLAYERS}人）のため入れません`;
    return;
  }

  const roomLabel = `[合言葉:${currentPassphrase}]`;
  const hostLabel = isHost() ? "★ホスト" : "";
  const specPrefix = isSpectator ? "👀【観戦中】" : "";

  if (entryBlockedByHost) {
    statusEl.textContent = `🔒 ホスト入室待ち ${roomLabel}`;
  } else if (phase === "map_select") {
    statusEl.textContent = isHost()
      ? `${roomLabel} ${displayMyName} ${hostLabel}｜ マップを選んで「このマップでキャラ選択へ」を押してください`
      : `${roomLabel} ${displayMyName} ${hostLabel}｜ ホストがマップを選んでいます...`;
  } else if (phase === "char_select") {
    statusEl.textContent = `${roomLabel} ${displayMyName} ${hostLabel}｜ キャラを選んで「✅ 完了にする」を押してください（全員完了で10秒カウント）`;
  } else if (phase === "countdown") {
    statusEl.textContent = `${roomLabel} 全員完了！ 試合開始まであと ${countdownLeft} 秒（マップ：${getCurrentStage().name}）`;
  } else if (phase === "playing") {
    statusEl.textContent = `${specPrefix}${roomLabel} バトル中（${getCurrentStage().name}）！ ${displayMyName}（${CHAR_SPECS[selectedChar].shortName}）`;
  }
}

function sendLoopStateSync(extra = {}) {
  if (isPublicLobbyRoom() || !ws || ws.readyState !== WebSocket.OPEN || entryBlockedByHost || isRoomFullBlocked || myRole === 0) return;
  ws.send(JSON.stringify({
    type: "loop_sync",
    phase,
    mode: gameMode,
    stageKey: currentStageKey,
    readyRoles: [...readyRoles],
    spectatorRoles: [...spectatorRoles],
    countdownLeft,
    ...extra
  }));
}

function enterMapSelectPhase(broadcast = false) {
  if (isPublicLobbyRoom() || entryBlockedByHost || isRoomFullBlocked) return;
  clearTimers();
  promoteSpectatorsToParticipants();
  phase = "map_select";
  readyRoles.clear();
  winnerInfo = null;
  gameOverSent = false;
  resetPlayersForNewMatch();
  syncActivePlayersFromRoles();
  sendProfileSync();
  updateLoopUI();
  updateRoomStatusBox();
  updateStatusByPhase();
  if (broadcast && isHost()) {
    sendLoopStateSync();
  }
}

function enterCharSelectPhase(broadcast = false) {
  if (isPublicLobbyRoom() || entryBlockedByHost || isRoomFullBlocked) return;
  clearTimers();
  promoteSpectatorsToParticipants();
  phase = "char_select";
  readyRoles.clear();
  winnerInfo = null;
  gameOverSent = false;
  resetPlayersForNewMatch();
  syncActivePlayersFromRoles();
  if (myRole !== 0 && players[myRole]) {
    players[myRole].charKey = selectedChar;
    players[myRole].jumps = getMaxJumpsForPlayer(players[myRole]);
    players[myRole].mp = MAX_MP;
    sendCharChange();
    sendProfileSync();
  }
  updateLoopUI();
  updateRoomStatusBox();
  updateStatusByPhase();
  if (broadcast && isHost()) {
    sendLoopStateSync();
  }
}

function startTenSecondCountdown() {
  if (isPublicLobbyRoom() || entryBlockedByHost || isRoomFullBlocked) return;
  if (phase === "countdown" || phase === "playing" || phase === "gameover") return;
  clearTimers();
  promoteSpectatorsToParticipants();
  phase = "countdown";
  countdownLeft = COUNTDOWN_SECONDS;
  syncActivePlayersFromRoles();
  updateLoopUI();
  updateRoomStatusBox();
  updateStatusByPhase();

  countdownTimerId = setInterval(() => {
    countdownLeft--;
    if (countdownLeft > 0) {
      updateLoopUI();
      updateRoomStatusBox();
      updateStatusByPhase();
    } else {
      clearTimers();
      startBattlePhase();
    }
  }, 1000);
}

function checkAllReadyAndStartCountdown() {
  if (isPublicLobbyRoom() || entryBlockedByHost || isRoomFullBlocked) return;
  syncReadyRolesToActive();
  updateLoopUI();
  updateRoomStatusBox();

  if (phase === "char_select" && areAllPlayersReady()) {
    startTenSecondCountdown();
  } else if (phase === "countdown" && !areAllPlayersReady()) {
    clearTimers();
    phase = "char_select";
    updateLoopUI();
    updateRoomStatusBox();
    updateStatusByPhase();
  }
}

function startBattlePhase() {
  if (isPublicLobbyRoom() || entryBlockedByHost || isRoomFullBlocked) return;
  clearTimers();
  phase = "playing";
  clearChatMessages();
  matchStartedAt = performance.now();
  winnerInfo = null;
  gameOverSent = false;

  resetPlayersForNewMatch();
  syncActivePlayersFromRoles();
  if (myRole !== 0 && !isSpectator && players[myRole]) {
    players[myRole].charKey = selectedChar;
    players[myRole].jumps = getMaxJumpsForPlayer(players[myRole]);
    players[myRole].mp = MAX_MP;
    players[myRole].name = sanitizePlayerName(myName, myRole);
    players[myRole].color = sanitizeColorHex(myColor, myRole);
    sendCharChange();
    sendProfileSync();
    sendMyState(players[myRole], true);
  } else if (myRole !== 0 && isSpectator) {
    sendProfileSync();
  }
  updateLoopUI();
  updateRoomStatusBox();
  updateStatusByPhase();
}

function setMode(newMode, broadcastChange = true) {
  if (isPublicLobbyRoom() || entryBlockedByHost || isRoomFullBlocked) return;
  if (phase === "playing" || phase === "gameover") return;
  if (broadcastChange && !isHost()) return;
  gameMode = newMode;
  modeSelectEl.value = gameMode;
  updateRoomStatusBox();
  updateStatusByPhase();
  if (broadcastChange && ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "mode", mode: gameMode }));
  }
}

function setStage(newStageKey, broadcastChange = true) {
  if (isPublicLobbyRoom() || entryBlockedByHost || isRoomFullBlocked || !STAGES[newStageKey]) return;
  if (phase === "playing" || phase === "gameover") return;
  if (broadcastChange && !isHost()) return;
  currentStageKey = newStageKey;
  stageSelectEl.value = currentStageKey;
  for (let r = 1; r <= MAX_BATTLE_PLAYERS; r++) {
    const sp = getSpawnPoint(r);
    players[r].x = sp.x;
    players[r].y = sp.y;
    players[r].facing = sp.facing;
  }
  updateRoomStatusBox();
  updateStatusByPhase();
  if (broadcastChange && ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "stage", stageKey: currentStageKey }));
  }
}

stageSelectEl.addEventListener("change", () => setStage(stageSelectEl.value, true));
modeSelectEl.addEventListener("change", () => setMode(modeSelectEl.value, true));

confirmMapBtn.addEventListener("click", () => {
  if (!isHost() || phase !== "map_select") return;
  setStage(stageSelectEl.value, false);
  setMode(modeSelectEl.value, false);
  enterCharSelectPhase(true);
});

backToMapBtn.addEventListener("click", () => {
  if (!isHost() || (phase !== "char_select" && phase !== "countdown")) return;
  enterMapSelectPhase(true);
});

readyToggleBtn.addEventListener("click", () => {
  if (isPublicLobbyRoom() || entryBlockedByHost || isRoomFullBlocked || isSpectator || myRole === 0) return;
  if (phase !== "char_select" && phase !== "countdown") return;

  if (readyRoles.has(myRole)) {
    readyRoles.delete(myRole);
  } else {
    readyRoles.add(myRole);
  }

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      type: "ready_state",
      role: myRole,
      ready: readyRoles.has(myRole)
    }));
  }
  checkAllReadyAndStartCountdown();
});

function cleanupGhostRoles() {
  if (isPublicLobbyRoom() || !isHost() || phase === "playing" || phase === "gameover") return;
  ghostFilterActive = true;
  activeRoles = pruneGhostRoles(activeRoles);
  spectatorRoles = new Set([...spectatorRoles].filter(r => activeRoles.includes(r)));
  syncReadyRolesToActive();
  for (let r = 1; r <= MAX_BATTLE_PLAYERS; r++) {
    if (!activeRoles.includes(r)) {
      players[r].active = false;
      players[r].spectator = false;
      delete clones[r];
    }
  }
  syncActivePlayersFromRoles();
  updateLoopUI();
  updateRoomStatusBox();
  updateStatusByPhase();
  if (ws && ws.readyState === WebSocket.OPEN && myRole !== 0) {
    ws.send(JSON.stringify({ type: "room", roles: activeRoles }));
    sendProfileSync();
    sendLoopStateSync();
  }
}

resetGhostBtn.addEventListener("click", cleanupGhostRoles);

hostLockBtn.addEventListener("click", () => {
  if (isSpectator || isRoomFullBlocked) return;
  fixedHostThisPc = !fixedHostThisPc;
  localStorage.setItem("smash_host_locked", fixedHostThisPc ? "1" : "0");
  if (!isPublicLobbyRoom() && fixedHostThisPc && myRole !== 0) {
    entryBlockedByHost = false;
    syncActivePlayersFromRoles();
  }
  updateLoopUI();
  updateRoomStatusBox();
  updateStatusByPhase();
  if (isHost()) {
    sendLoopStateSync();
  }
});

function setSelectedCharByIndex(idx) {
  if (entryBlockedByHost || isRoomFullBlocked || isSpectator || myRole === 0) return;
  if (phase !== "char_select" && phase !== "map_select") return;
  if (readyRoles.has(myRole)) return;

  selectedIdx = (idx + CHAR_ORDER.length) % CHAR_ORDER.length;
  selectedChar = CHAR_ORDER[selectedIdx];
  charSelectDropdown.value = selectedChar;
  charDescInline.textContent = `(${CHAR_SPECS[selectedChar].desc})`;

  if (!isPublicLobbyRoom() && players[myRole]) {
    players[myRole].charKey = selectedChar;
    players[myRole].jumps = getMaxJumpsForPlayer(players[myRole]);
    players[myRole].mp = MAX_MP;
    sendCharChange();
  }
}

charSelectDropdown.addEventListener("change", () => {
  const idx = CHAR_ORDER.indexOf(charSelectDropdown.value);
  if (idx >= 0) setSelectedCharByIndex(idx);
});

function sendCharChange() {
  if (!isPublicLobbyRoom() && !isSpectator && ws && ws.readyState === WebSocket.OPEN && !entryBlockedByHost && !isRoomFullBlocked && myRole !== 0) {
    ws.send(JSON.stringify({ type: "char", role: myRole, charKey: selectedChar }));
  }
}

function finishGame(info) {
  if (phase === "gameover") return;
  clearTimers();
  phase = "gameover";
  winnerInfo = info;
  resultSecLeft = RESULT_SECONDS;
  updateLoopUI();

  let headline = "";
  let subline = "";
  if (info.type === "team") {
    const teamName = info.winnerTeam === "A" ? "Aチーム（1P・2P）" : "Bチーム（3P・4P）";
    const myTeam = getTeamOfRole(myRole);
    headline = `${teamName} WIN!`;
    subline = isSpectator
      ? "観戦終了！次の試合から参加できます"
      : ((myTeam && myTeam === info.winnerTeam) ? "あなたのチームの勝利！🎉" : "あなたのチームは敗北...");
  } else {
    const winRole = info.winnerRole;
    const winName = getDisplayNameOfRole(winRole);
    headline = `${winName} WIN!`;
    subline = isSpectator
      ? "観戦終了！次の試合から参加できます"
      : ((winRole === myRole) ? "あなたの勝利！🎉" : "ストックが0になりました（負け）");
  }

  statusEl.textContent = `${headline}（${subline}） ${resultSecLeft}秒後にマップ選択へ戻ります...`;

  countdownTimerId = setInterval(() => {
    resultSecLeft--;
    if (resultSecLeft > 0) {
      statusEl.textContent = `${headline}（${subline}） ${resultSecLeft}秒後にマップ選択へ戻ります...`;
    } else {
      clearTimers();
      enterMapSelectPhase(isHost());
    }
  }, 1000);
}

function broadcastGameOver(info) {
  if (gameOverSent) return;
  gameOverSent = true;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "gameover", info }));
  }
  finishGame(info);
}

function triggerBurnout(me) {
  if ((me.invincibleTimer || 0) > 0) return;
  me.shielding = false;
  me.shieldHp = 0;
  me.burnedOut = true;
  me.frozen = false;
  me.stun = 180;
  me.vy = -7.5;
  me.vx = 0;
}

function checkMatchEndCondition() {
  if (isPublicLobbyRoom() || phase !== "playing" || entryBlockedByHost || isRoomFullBlocked) return;
  const participants = getParticipantRoles();
  const alivePlayers = participants.map(r => players[r]).filter(p => p && !isRoleSpectating(p.role) && p.stocks > 0);

  if (gameMode === "team2v2") {
    const teamAAlive = alivePlayers.some(p => getTeamOfRole(p.role) === "A");
    const teamBAlive = alivePlayers.some(p => getTeamOfRole(p.role) === "B");
    if (!teamAAlive && teamBAlive) {
      broadcastGameOver({ type: "team", winnerTeam: "B" });
    } else if (!teamBAlive && teamAAlive) {
      broadcastGameOver({ type: "team", winnerTeam: "A" });
    }
  } else {
    if (alivePlayers.length === 1) {
      broadcastGameOver({ type: "player", winnerRole: alivePlayers[0].role });
    } else if (alivePlayers.length === 0 && myRole !== 0 && !isSpectator) {
      broadcastGameOver({ type: "player", winnerRole: myRole });
    }
  }
}

function applyDamageToMe(me, spec, dmg, basePower, dir, upAngleMult = 0.62, pierceGuard = false, hitMeta = {}) {
  if (isSpectator) return;

  const nowMs = performance.now();
  let hammerChanged = false;
  if (me.charKey === "hammer") {
    const res = handleHammerIncomingHit(me, !!hitMeta.wasSmash, !!hitMeta.wasLight, nowMs);
    hammerChanged = res.changed;
  }

  if ((me.invincibleTimer || 0) > 0) {
    if (hammerChanged) sendMyState(me, true);
    return;
  }

  if (me.shielding && !me.burnedOut && !pierceGuard) {
    me.shieldHp -= dmg * 2.2;
    me.percent += Math.floor(dmg * 0.15);
    me.vx = dir * 2.5;
    if (me.shieldHp <= 0) triggerBurnout(me);
    sendMyState(me, true);
    return;
  }

  if (pierceGuard && me.shielding) {
    me.shielding = false;
  }

  me.percent += dmg;
  if (basePower > 0) {
    const kbScale = (1 + me.percent * 0.0165) / spec.weight;
    me.vx = dir * basePower * kbScale;
    me.vy = -basePower * upAngleMult * kbScale;
    me.stun = Math.max(me.stun, Math.min(45, Math.floor(10 + basePower * 0.75)));
  }
  sendMyState(me, true);
}

function sendCloneSync(cloneObj) {
  if (!isPublicLobbyRoom() && !isSpectator && ws && ws.readyState === WebSocket.OPEN && !entryBlockedByHost && !isRoomFullBlocked && myRole !== 0) {
    ws.send(JSON.stringify({ type: "clone", ownerRole: myRole, clone: cloneObj }));
  }
}

function applyHitToMyClone(dmg, basePower, dir, effect = null, upAngleMult = 0.62, hitMeta = {}) {
  if (entryBlockedByHost || isRoomFullBlocked || isSpectator || myRole === 0) return;
  const cl = clones[myRole];
  const me = players[myRole];
  if (!cl || !cl.active) return;

  let cloneHammerChanged = false;
  if (cl.charKey === "hammer") {
    const res = handleHammerIncomingHit(cl, !!hitMeta.wasSmash, !!hitMeta.wasLight, performance.now());
    cloneHammerChanged = res.changed;
  }

  if (effect === "freeze") {
    cl.stun = Math.max(cl.stun || 0, 45);
    cl.percent += 4;
  } else if (effect === "burn") {
    cl.percent += 15;
  } else {
    cl.percent += dmg;
    if (basePower > 0) {
      const spec = CHAR_SPECS[cl.charKey] || CHAR_SPECS.fighter;
      const kbScale = (1 + cl.percent * 0.0165) / spec.weight;
      cl.vx = dir * basePower * kbScale;
      cl.vy = -basePower * upAngleMult * kbScale;
      cl.stun = Math.max(cl.stun || 0, Math.min(40, Math.floor(8 + basePower * 0.7)));
    }
  }

  if (cl.percent >= SUMMON_CLONE_MAX_PERCENT) {
    delete clones[myRole];
    if (me) {
      me.hasClone = false;
      sendMyState(me, true);
    }
    sendCloneSync(null);
  } else if (cloneHammerChanged || dmg > 0 || effect) {
    sendCloneSync(cl);
  }
}

function markPeerActive(peerRole) {
  const cap = getRoomCapacity();
  const r = Number(peerRole);
  if (!Number.isInteger(r) || r < 1 || r > cap || r === myRole) return;
  seenPeerRoles.add(r);
  if (!entryBlockedByHost && !isRoomFullBlocked && !activeRoles.includes(r)) {
    activeRoles = [...activeRoles, r].sort((a, b) => a - b);
    syncActivePlayersFromRoles();
    ensureNonConflictingColor();
    updateLoopUI();
    updateRoomStatusBox();
    updateStatusByPhase();
  }
}

function handleRoomFullRejection(cap = MAX_BATTLE_PLAYERS) {
  clearTimers();
  isRoomFullBlocked = true;
  myRole = 0;
  isSpectator = false;
  activeRoles = [];
  readyRoles.clear();
  spectatorRoles.clear();
  for (let r = 1; r <= MAX_BATTLE_PLAYERS; r++) {
    players[r].active = false;
    players[r].spectator = false;
  }
  updateLoopUI();
  updateRoomStatusBox();
  updateStatusByPhase();
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
    try { ws.close(); } catch (ignored) {}
  }
  statusEl.textContent = `🚫 合言葉「${currentPassphrase}」は満員（${cap}/${cap}人）のため入れません`;
}

function applyRoomSnapshot(rawRoles) {
  if (isRoomFullBlocked) return;
  const nextRoles = pruneGhostRoles(rawRoles);
  const hostPresent = isHostPresentInList(nextRoles);

  if (!hostPresent && !fixedHostThisPc) {
    entryBlockedByHost = true;
    activeRoles = [];
    readyRoles.clear();
    for (let r = 1; r <= MAX_BATTLE_PLAYERS; r++) {
      players[r].active = false;
      players[r].spectator = false;
    }
    updateLoopUI();
    updateRoomStatusBox();
    updateStatusByPhase();
    return;
  }

  entryBlockedByHost = false;
  activeRoles = nextRoles;
  spectatorRoles = new Set([...spectatorRoles].filter(r => activeRoles.includes(r)));
  syncReadyRolesToActive();
  syncActivePlayersFromRoles();
  ensureNonConflictingColor();
  updateLoopUI();
  updateRoomStatusBox();
  updateStatusByPhase();

  if (!isPublicLobbyRoom() && myRole !== 0 && activeRoles.includes(myRole)) {
    sendCharChange();
    sendProfileSync();
    if (isHost()) sendLoopStateSync();
  }
}

function attachSocketHandlers(socket) {
  socket.onmessage = (e) => {
    if (socket !== ws) return;
    const data = JSON.parse(e.data);
    if (data.type === "chat") {
      pushChatMessage(data);
      return;
    }
    if (data.type === "role") {
      if (data.full) {
        handleRoomFullRejection(Number(data.maxPlayers) || getRoomCapacity());
        return;
      }
      const assignedRole = Number(data.role) || 0;
      const baseList = Array.isArray(data.roles)
        ? data.roles
        : (assignedRole > 0 ? [...activeRoles, assignedRole] : activeRoles);
      const normalized = pruneGhostRoles(baseList);

      if (!isPublicLobbyRoom() && (assignedRole <= 0 || assignedRole > MAX_BATTLE_PLAYERS || normalized.length > MAX_BATTLE_PLAYERS)) {
        handleRoomFullRejection(MAX_BATTLE_PLAYERS);
        return;
      }

      isRoomFullBlocked = false;
      myRole = assignedRole;

      if (!isPublicLobbyRoom() && !fixedHostThisPc && !isHostPresentInList(normalized)) {
        entryBlockedByHost = true;
        activeRoles = [];
        clearTimers();
        phase = "map_select";
        syncActivePlayersFromRoles();
        updateLoopUI();
        updateRoomStatusBox();
        updateStatusByPhase();
        return;
      }

      entryBlockedByHost = false;
      activeRoles = normalized;
      clearTimers();
      readyRoles.clear();

      const joiningMidMatch = (!isPublicLobbyRoom() && (data.phase === "playing" || phase === "playing"));
      if (joiningMidMatch) {
        phase = "playing";
        clearChatMessages();
        isSpectator = true;
        spectatorRoles.add(myRole);
      } else {
        phase = "map_select";
        isSpectator = false;
        spectatorRoles.clear();
      }

      syncActivePlayersFromRoles();
      ensureNonConflictingColor();
      if (!isPublicLobbyRoom() && players[myRole]) {
        players[myRole].spectator = isSpectator;
        players[myRole].active = !isSpectator;
        players[myRole].name = sanitizePlayerName(myName, myRole);
        players[myRole].color = sanitizeColorHex(myColor, myRole);
        players[myRole].charKey = selectedChar;
        players[myRole].jumps = getMaxJumpsForPlayer(players[myRole]);
        players[myRole].mp = MAX_MP;
        if (!isSpectator) sendCharChange();
        sendProfileSync();
        if (isHost() && !isSpectator) sendLoopStateSync();
      }
      updateLoopUI();
      updateRoomStatusBox();
      updateStatusByPhase();
    } else if (data.type === "room") {
      applyRoomSnapshot(data.roles);
    } else if (data.type === "profile") {
      const pRole = Number(data.role) || 0;
      if (!pRole || pRole === myRole) return;
      markPeerActive(pRole);
      if (players[pRole]) {
        if (typeof data.name === "string" && data.name.trim()) {
          players[pRole].name = sanitizePlayerName(data.name, pRole);
        }
        if (typeof data.color === "string" && data.color.trim()) {
          players[pRole].color = sanitizeColorHex(data.color, pRole);
        }
        if (typeof data.spectator === "boolean") {
          players[pRole].spectator = data.spectator;
          if (data.spectator) spectatorRoles.add(pRole);
          else spectatorRoles.delete(pRole);
        }
      }
      syncActivePlayersFromRoles();
      ensureNonConflictingColor();
      updateLoopUI();
      updateRoomStatusBox();
      if (players[myRole] && players[myRole].color !== myColor) sendProfileSync();
    } else if (data.type === "mode") {
      if (data.mode === "ffa" || data.mode === "team2v2") setMode(data.mode, false);
    } else if (data.type === "stage") {
      if (data.stageKey && STAGES[data.stageKey]) setStage(data.stageKey, false);
    } else if (data.type === "loop_sync") {
      if (isPublicLobbyRoom() || entryBlockedByHost || isRoomFullBlocked) return;
      if (data.mode === "ffa" || data.mode === "team2v2") {
        gameMode = data.mode;
        modeSelectEl.value = gameMode;
      }
      if (data.stageKey && STAGES[data.stageKey]) {
        currentStageKey = data.stageKey;
        stageSelectEl.value = currentStageKey;
      }
      if (Array.isArray(data.spectatorRoles)) {
        spectatorRoles = new Set(data.spectatorRoles.map(Number).filter(r => activeRoles.includes(r)));
      }
      if (Array.isArray(data.readyRoles)) {
        readyRoles = new Set(data.readyRoles.map(Number));
        syncReadyRolesToActive();
      }
      if (data.phase === "map_select") {
        clearTimers();
        promoteSpectatorsToParticipants();
        phase = "map_select";
        resetPlayersForNewMatch();
        syncActivePlayersFromRoles();
      } else if (data.phase === "char_select") {
        clearTimers();
        promoteSpectatorsToParticipants();
        phase = "char_select";
        resetPlayersForNewMatch();
        syncActivePlayersFromRoles();
      } else if (data.phase === "countdown") {
        startTenSecondCountdown();
      } else if (data.phase === "playing") {
        clearTimers();
        phase = "playing";
        clearChatMessages();
        if (myRole !== 0 && spectatorRoles.has(myRole)) isSpectator = true;
        syncActivePlayersFromRoles();
      }
      updateLoopUI();
      updateRoomStatusBox();
      updateStatusByPhase();
    } else if (data.type === "ready_state") {
      if (isPublicLobbyRoom() || entryBlockedByHost || isRoomFullBlocked) return;
      const r = Number(data.role) || 0;
      if (!r || r === myRole || isRoleSpectating(r)) return;
      markPeerActive(r);
      if (data.ready) readyRoles.add(r);
      else readyRoles.delete(r);
      checkAllReadyAndStartCountdown();
    } else if (data.type === "full") {
      handleRoomFullRejection(Number(data.maxPlayers) || getRoomCapacity());
    } else if (data.type === "leave") {
      const leftRole = Number(data.role) || 0;
      if (leftRole) {
        seenPeerRoles.delete(leftRole);
        readyRoles.delete(leftRole);
        spectatorRoles.delete(leftRole);
        const remaining = activeRoles.filter(r => r !== leftRole);
        delete clones[leftRole];
        if (players[leftRole]) {
          players[leftRole].active = false;
          players[leftRole].spectator = false;
          players[leftRole].stocks = 0;
        }
        if (!isPublicLobbyRoom() && !fixedHostThisPc && !isHostPresentInList(remaining)) {
          entryBlockedByHost = true;
          activeRoles = [];
          clearTimers();
          phase = "map_select";
          updateLoopUI();
          updateRoomStatusBox();
          updateStatusByPhase();
          return;
        }
        activeRoles = remaining;
      }
      if (phase === "countdown") {
        checkAllReadyAndStartCountdown();
      } else {
        updateLoopUI();
        updateRoomStatusBox();
        if (phase === "playing") checkMatchEndCondition();
        else updateStatusByPhase();
      }
    } else if (data.type === "char") {
      if (data.role === myRole) return;
      markPeerActive(data.role);
      if (players[data.role]) players[data.role].charKey = data.charKey;
    } else if (data.type === "state") {
      if (isPublicLobbyRoom() || isRoomFullBlocked || phase === "gameover") return;
      if (!data.player || data.player.role === myRole) return;
      const targetRole = Number(data.player.role);
      if (!Number.isInteger(targetRole) || targetRole < 1 || targetRole > MAX_BATTLE_PLAYERS) return;
      markPeerActive(targetRole);
      const target = players[targetRole];
      if (target) {
        const justStarted = (phase === "playing" && (performance.now() - matchStartedAt) < 600);
        const prevStocks = target.stocks;
        const prevName = target.name;
        const prevColor = target.color;
        const prevCritStartedAt = target.critStartedAt;
        const prevCritReady = target.critReady;
        Object.assign(target, data.player);
        target.role = targetRole;
        target.name = data.player.name ? sanitizePlayerName(data.player.name, targetRole) : prevName;
        target.color = data.player.color ? sanitizeColorHex(data.player.color, targetRole) : prevColor;
        if (target.critReady && !prevCritReady) {
          target.critStartedAt = performance.now();
        } else if (target.critReady && !target.critStartedAt && prevCritStartedAt) {
          target.critStartedAt = prevCritStartedAt;
        } else if (!target.critReady) {
          target.critStartedAt = 0;
        }
        const targetSpec = !!data.player.spectator || spectatorRoles.has(targetRole);
        target.spectator = targetSpec;
        target.active = !entryBlockedByHost && !(phase === "playing" && targetSpec);
        if (!target.hasClone) delete clones[target.role];
        if (justStarted) {
          target.stocks = Math.max(prevStocks, MAX_STOCK);
          target.percent = 0;
        }
        if (!entryBlockedByHost && !activeRoles.includes(target.role)) {
          activeRoles = [...activeRoles, target.role].sort((a, b) => a - b);
          updateLoopUI();
          updateRoomStatusBox();
        }
        if (phase === "playing" && !justStarted) checkMatchEndCondition();
      }
    } else if (data.type === "clone") {
      if (isPublicLobbyRoom() || phase === "gameover") return;
      if (data.ownerRole === myRole) return;
      if (data.clone && data.clone.active) {
        const prevCl = clones[data.ownerRole];
        if (data.clone.critReady && !(prevCl && prevCl.critReady)) {
          data.clone.critStartedAt = performance.now();
        } else if (data.clone.critReady && !data.clone.critStartedAt && prevCl && prevCl.critStartedAt) {
          data.clone.critStartedAt = prevCl.critStartedAt;
        }
        clones[data.ownerRole] = data.clone;
      } else {
        delete clones[data.ownerRole];
      }
    } else if (data.type === "clone_hit") {
      if (isPublicLobbyRoom() || phase !== "playing" || entryBlockedByHost || isRoomFullBlocked || isSpectator || myRole === 0) return;
      if (data.ownerRole !== myRole) return;
      if (data.attackerRole === myRole || isSameTeam(data.attackerRole, myRole)) return;
      applyHitToMyClone(
        data.dmg || 0,
        data.basePower || 0,
        data.dir || 1,
        data.effect || null,
        data.upAngleMult || 0.62,
        { wasSmash: !!data.wasSmash, wasLight: !!data.wasLight }
      );
    } else if (data.type === "gameover") {
      if (isPublicLobbyRoom() || entryBlockedByHost || isRoomFullBlocked) return;
      if (data.info) {
        gameOverSent = true;
        finishGame(data.info);
      }
    } else if (data.type === "projectile") {
      if (isPublicLobbyRoom() || phase === "gameover") return;
      if (data.proj && data.proj.ownerRole !== myRole) projectiles.push(data.proj);
    } else if (data.type === "beam") {
      if (isPublicLobbyRoom() || phase === "gameover") return;
      if (data.beam && data.beam.ownerRole !== myRole) beams.push(data.beam);
    } else if (data.type === "ring") {
      if (isPublicLobbyRoom() || phase === "gameover") return;
      if (data.ring && data.ring.ownerRole !== myRole) ringEffects.push(data.ring);
    } else if (data.type === "hit_confirm") {
      if (isPublicLobbyRoom() || phase !== "playing" || entryBlockedByHost || isRoomFullBlocked || isSpectator || myRole === 0) return;
      if (data.attackerRole !== myRole) return;
      const me = players[myRole];
      if (!me) return;
      let changed = false;
      if (me.charKey === "elementalist") {
        me.mp = Math.min(MAX_MP, (me.mp || 0) + 5);
        changed = true;
      }
      if (me.charKey === "guardian" && data.wasLight && (me.invincibleTimer || 0) <= 0) {
        me.guardianHits = (me.guardianHits || 0) + 1;
        if (me.guardianHits >= GUARDIAN_INVINCIBLE_HITS) {
          me.guardianHits = 0;
          me.invincibleTimer = GUARDIAN_INVINCIBLE_FRAMES;
        }
        changed = true;
      }
      if (me.charKey === "hammer" && data.wasSmash) {
        handleHammerHitProgress(me, !!data.wasCrit);
        changed = true;
      }
      if (changed) sendMyState(me, true);
    } else if (data.type === "hit") {
      if (isPublicLobbyRoom() || phase !== "playing" || entryBlockedByHost || isRoomFullBlocked || isSpectator || myRole === 0) return;
      if (data.attackerRole === myRole) return;
      if (data.targetRole && data.targetRole !== myRole) return;
      if (isSameTeam(data.attackerRole, myRole)) return;

      const me = players[myRole];
      if (!me || me.stocks <= 0) return;
      const spec = CHAR_SPECS[me.charKey] || CHAR_SPECS.fighter;
      const pierceGuard = !!data.pierceGuard;
      const wasSmash = !!data.wasSmash;
      const wasLight = !!data.wasLight;

      if (socket.readyState === WebSocket.OPEN && !data.fromClone) {
        socket.send(JSON.stringify({
          type: "hit_confirm",
          attackerRole: data.attackerRole,
          targetRole: myRole,
          wasLight,
          wasSmash,
          wasCrit: !!data.wasCrit
        }));
      }

      if ((me.invincibleTimer || 0) > 0) {
        if (me.charKey === "hammer") {
          const hRes = handleHammerIncomingHit(me, wasSmash, wasLight, performance.now());
          if (hRes.changed) sendMyState(me, true);
        }
        return;
      }

      if (data.effect === "burn") {
        if (me.charKey === "hammer") {
          const hRes = handleHammerIncomingHit(me, wasSmash, wasLight, performance.now());
          if (hRes.changed) sendMyState(me, true);
        }
        if (me.shielding && !me.burnedOut && !pierceGuard) {
          me.shieldHp -= (data.dmg || 5) * 2.0;
          if (me.shieldHp <= 0) triggerBurnout(me);
          sendMyState(me, true);
          return;
        }
        if (pierceGuard) me.shielding = false;
        burnDebuffs.push({ targetRole: myRole, attackerRole: data.attackerRole, ticksLeft: 5, tickTimer: 0, dmgPerTick: 5, dir: data.dir || 1 });
        return;
      }

      if (data.effect === "freeze") {
        if (me.charKey === "hammer") {
          const hRes = handleHammerIncomingHit(me, wasSmash, wasLight, performance.now());
          if (hRes.changed) sendMyState(me, true);
        }
        if (me.shielding && !me.burnedOut && !pierceGuard) {
          me.shieldHp -= 15;
          me.vx = (data.dir || 1) * 2.5;
          if (me.shieldHp <= 0) triggerBurnout(me);
          sendMyState(me, true);
          return;
        }
        if (pierceGuard) me.shielding = false;
        me.frozen = true; me.stun = Math.max(me.stun, 60); me.vx = 0; me.shielding = false; me.smashCharging = false;
        sendMyState(me, true);
        return;
      }

      applyDamageToMe(me, spec, data.dmg, data.basePower, data.dir, data.upAngleMult || 0.62, pierceGuard, { wasSmash, wasLight });
    }
  };
}

function connectToPassphrase(nextPassphrase, updateUrl = true) {
  if (!hasEnteredLobby) return;
  currentPassphrase = sanitizePassphrase(nextPassphrase);
  passphraseInputEl.value = currentPassphrase;
  updatePassphraseUI();

  if (updateUrl) {
    const url = new URL(location.href);
    if (currentPassphrase) url.searchParams.set("room", currentPassphrase);
    else url.searchParams.delete("room");
    history.replaceState(null, "", url.toString());
  }

  clearTimers();
  phase = "map_select";
  myRole = 0;
  isSpectator = false;
  isRoomFullBlocked = false;
  activeRoles = [];
  spectatorRoles.clear();
  seenPeerRoles = new Set();
  readyRoles.clear();
  ghostFilterActive = false;
  entryBlockedByHost = false;
  winnerInfo = null;
  gameOverSent = false;
  projectiles = []; beams = []; ringEffects = []; burnDebuffs = []; clones = {};
  for (let r = 1; r <= MAX_BATTLE_PLAYERS; r++) {
    resetSinglePlayer(players[r], r);
    players[r].active = false;
    players[r].spectator = false;
    players[r].name = `Player${r}`;
    players[r].color = sanitizeColorHex(PLAYER_COLORS[r], r);
  }

  statusEl.textContent = currentPassphrase
    ? `合言葉「${currentPassphrase}」の部屋に接続中...`
    : `公開待機部屋（最大${MAX_LOBBY_PLAYERS}人）に接続中...`;
  updateLoopUI();
  updateRoomStatusBox();

  const oldWs = ws;
  const query = currentPassphrase ? `?room=${encodeURIComponent(currentPassphrase)}` : "";
  const newWs = new WebSocket(wsProto + location.host + ctxPath + "/smash-ws" + query);
  ws = newWs;
  attachSocketHandlers(newWs);

  if (oldWs && (oldWs.readyState === WebSocket.OPEN || oldWs.readyState === WebSocket.CONNECTING)) {
    try { oldWs.close(); } catch (ignored) {}
  }
}

joinPassphraseBtn.addEventListener("click", () => connectToPassphrase(passphraseInputEl.value, true));
passphraseInputEl.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); connectToPassphrase(passphraseInputEl.value, true); }
});
publicRoomBtn.addEventListener("click", () => connectToPassphrase("", true));

function trySummonClone(me) {
  if (!me || me.charKey !== "summoner") return;
  const now = performance.now();
  if (clones[myRole] && clones[myRole].active) return;
  if (now < (me.summonCooldownUntil || 0)) return;

  const pickedChar = SUMMON_CANDIDATES[Math.floor(Math.random() * SUMMON_CANDIDATES.length)];
  const spec = CHAR_SPECS[pickedChar] || CHAR_SPECS.fighter;
  const ground = findSolidBeneath(me.x + me.w / 2, me.y + me.h);
  const spawnX = Math.max(ground.x + 8, Math.min(ground.x + ground.w - 40, me.x + me.facing * 42));

  const newClone = {
    ownerRole: myRole, active: true, charKey: pickedChar,
    x: spawnX, y: me.y - 6, w: 32, h: 42, vx: 0, vy: -3,
    facing: me.facing, jumps: spec.maxJumps || 2, percent: 0, stun: 0, atkTimer: 0, cooldown: 35, hasHit: false,
    hammerCharge: 0, critReady: false, critActive: false, critStartedAt: 0, critLightHitsAfterExpiry: 0
  };
  clones[myRole] = newClone;
  me.hasClone = true;
  me.summonCooldownUntil = now + SUMMON_COOLDOWN_MS;
  sendCloneSync(newClone);
  sendMyState(me, true);
}

function tryEnhanceSelf(me) {
  if (!me || me.charKey !== "enhancer") return;
  const now = performance.now();
  if (me.enhanceLevel >= ENHANCE_MAX_LEVEL || now < me.enhanceCooldownUntil) return;
  me.enhanceLevel += 1;
  me.enhanceCooldownUntil = now + ENHANCE_COOLDOWN_MS;
  sendMyState(me, true);
}

function cycleElementMagic(me) {
  if (!me || me.charKey !== "elementalist") return;
  const curIdx = MAGIC_MODES.indexOf(me.magicMode);
  me.magicMode = MAGIC_MODES[(curIdx + 1) % MAGIC_MODES.length];
  sendMyState(me, true);
}

function createBeamObject(me, mode) {
  const beamW = 260, beamH = 26;
  return {
    ownerRole: me.role,
    mode,
    x: me.facing === 1 ? me.x + me.w + 4 : me.x - beamW - 4,
    y: me.y + 9,
    w: beamW,
    h: beamH,
    dir: me.facing,
    life: 16,
    maxLife: 16,
    hasHitRoles: []
  };
}

function castSelectedElementMagic(me) {
  if (!me || me.charKey !== "elementalist" || me.cooldown > 0 || me.stun > 0 || me.shielding) return;
  const mode = me.magicMode || "fire";
  const info = MAGIC_INFO[mode];
  const curMp = me.mp || 0;

  if (mode === "magic") {
    if (curMp < info.minCost) return;
    const spentMp = curMp;
    const power = calcMagicPowerFromMp(spentMp);
    me.mp = 0; me.cooldown = 28; me.hasHit = false;
    const ring = {
      ownerRole: me.role, cx: me.x + me.w / 2, cy: me.y + me.h / 2,
      maxRadius: power.maxRadius, life: 24, maxLife: 24,
      spentMp: Math.floor(spentMp), dmg: power.dmg, basePower: power.basePower, hasHitRoles: []
    };
    ringEffects.push(ring);
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "ring", ring }));
    sendMyState(me, true);
    return;
  }

  if (curMp < info.cost) return;
  me.mp -= info.cost; me.cooldown = 20; me.hasHit = false;
  if (mode === "heal") {
    me.percent = Math.max(0, me.percent - 10);
    beams.push({ ownerRole: me.role, mode: "heal", x: me.x - 16, y: me.y - 12, w: me.w + 32, h: me.h + 24, dir: me.facing, life: 18, maxLife: 18, hasHitRoles: [] });
  } else {
    const beam = createBeamObject(me, mode);
    beams.push(beam);
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "beam", beam }));
  }
  sendMyState(me, true);
}

function triggerAttack(useSmash, chargeRatio = 0) {
  if (isPublicLobbyRoom() || phase !== "playing" || entryBlockedByHost || isRoomFullBlocked || isSpectator || myRole === 0) return;
  const me = players[myRole];
  if (!me || me.stocks <= 0 || me.cooldown > 0 || me.stun > 0 || me.shielding) return;
  const spec = CHAR_SPECS[me.charKey];
  me.hasHit = false;

  if (useSmash) {
    me.atkType = "smash";
    me.atkTimer = 16;
    me.cooldown = spec.smashCooldown;
    me.smashChargeRatio = chargeRatio;
    if (me.charKey === "hammer") {
      ensureHammerCritState(me, performance.now());
    }
    me.critActive = (me.charKey === "hammer") && isHammerCritState(me, performance.now());
  } else {
    me.atkType = "light";
    me.atkTimer = me.charKey === "fighter" ? 7 : 10;
    me.cooldown = spec.lightCooldown;
    me.critActive = false;

    if (me.charKey === "mage") {
      const laserLen = 460, laserH = 12;
      const laserBeam = {
        ownerRole: myRole, mode: "mage_laser",
        x: me.facing === 1 ? me.x + me.w + 4 : me.x - laserLen - 4,
        y: me.y + 16, w: laserLen, h: laserH, dir: me.facing,
        life: 10, maxLife: 10, dmg: spec.lightDmg, basePower: 5.0, hasHitRoles: []
      };
      beams.push(laserBeam);
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "beam", beam: laserBeam }));
    }
  }
  sendMyState(me, true);
}

const down = {};
window.addEventListener("keydown", e => {
  if (!hasEnteredLobby) return;
  if (["INPUT", "SELECT"].includes(document.activeElement.tagName)) return;
  if (entryBlockedByHost || isRoomFullBlocked || myRole === 0) return;

  if (!isSpectator && (phase === "char_select" || phase === "map_select") && !down[e.code] && !readyRoles.has(myRole)) {
    if (e.code === "KeyA") setSelectedCharByIndex(selectedIdx - 1);
    if (e.code === "KeyD") setSelectedCharByIndex(selectedIdx + 1);
  }

  if (!isPublicLobbyRoom() && !isSpectator && phase === "playing" && !down[e.code]) {
    const me = players[myRole];
    if (!me || me.stocks <= 0) return;
    const spec = CHAR_SPECS[me.charKey];
    if (!me.shielding && me.stun <= 0) {
      if (e.code === "KeyW" && me.jumps > 0) { me.vy = spec.jumpPower; me.jumps--; }
      if (e.code === "KeyS") me.dropThroughTimer = 12;
      if (e.code === "KeyL") triggerAttack(false);
      if (e.code === "KeyI" && me.charKey === "elementalist") cycleElementMagic(me);
      if (e.code === "KeyK") {
        if (me.charKey === "enhancer") tryEnhanceSelf(me);
        else if (me.charKey === "elementalist") castSelectedElementMagic(me);
        else if (me.charKey === "summoner") trySummonClone(me);
        else if (me.cooldown <= 0 && !me.smashCharging && me.atkTimer <= 0) {
          me.smashCharging = true;
          me.smashChargeStart = Date.now();
        }
      }
    }
  }
  down[e.code] = true;
});

window.addEventListener("keyup", e => {
  down[e.code] = false;
  if (e.code === "KeyK" && hasEnteredLobby && !["INPUT", "SELECT"].includes(document.activeElement.tagName)) {
    if (isPublicLobbyRoom() || entryBlockedByHost || isRoomFullBlocked || isSpectator || myRole === 0 || phase !== "playing") return;
    const me = players[myRole];
    if (!me || me.charKey === "enhancer" || me.charKey === "elementalist" || me.charKey === "summoner" || !me.smashCharging) return;
    me.smashCharging = false;
    triggerAttack(true, Math.min((Date.now() - me.smashChargeStart) / 1500, 1.0));
  }
});

function getMeleeHitbox(p, nowMs = performance.now()) {
  if (p.atkTimer <= 0 || !p.atkType || (p.charKey === "mage" && p.atkType === "light")) return null;
  const isSmash = p.atkType === "smash";
  const isHammerCrit = p.charKey === "hammer" && isSmash && isHammerCritState(p, nowMs);
  let w = isSmash ? 56 : 40;
  let h = isSmash ? 40 : 26;
  if (p.charKey === "hammer" && isSmash) {
    w = isHammerCrit ? 84 : 70;
    h = isHammerCrit ? 48 : 40;
  }
  return {
    x: p.facing === 1 ? p.x + p.w - 2 : p.x - w + 2,
    y: p.y + (isHammerCrit ? -2 : (isSmash ? 2 : 9)),
    w, h, isSmash
  };
}

function sendHitToTarget(targetRole, dmg, basePower, dir, effect = null, upAngleMult = 0.62, extra = {}) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "hit", attackerRole: myRole, targetRole, dmg, basePower, dir, effect, upAngleMult, ...extra }));
  }
}

function sendHitToEnemyClone(ownerRole, dmg, basePower, dir, effect = null, upAngleMult = 0.62, extra = {}) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: "clone_hit", attackerRole: myRole, ownerRole, dmg, basePower, dir, effect, upAngleMult, ...extra }));
  }
}

function checkHitEnemyClonesByBox(box, dmg, basePower, dir, effect = null, upAngleMult = 0.62, hitOwnerList = null, originX = null, originY = null, ignoreStageBlock = false, hitMeta = {}) {
  for (const ownerStr of Object.keys(clones)) {
    const ownerRole = Number(ownerStr);
    if (ownerRole === myRole || isSameTeam(myRole, ownerRole) || isRoleSpectating(ownerRole)) continue;
    if (hitOwnerList && hitOwnerList.includes(ownerRole)) continue;
    const cl = clones[ownerRole];
    if (!cl || !cl.active) continue;
    if (!rectsOverlap(box, cl)) continue;
    if (!ignoreStageBlock && originX !== null && originY !== null) {
      if (isBlockedByStageSegment(originX, originY, cl.x + cl.w * 0.5, cl.y + cl.h * 0.5)) continue;
    }
    if (hitOwnerList) hitOwnerList.push(ownerRole);
    sendHitToEnemyClone(ownerRole, dmg, basePower, dir, effect, upAngleMult, hitMeta);
    return true;
  }
  return false;
}

function sendMyState(me, force = false) {
  if (isPublicLobbyRoom() || isSpectator || !ws || ws.readyState !== WebSocket.OPEN || entryBlockedByHost || isRoomFullBlocked || !me) return;
  const now = performance.now();
  if (!force && now - lastStateSentAt < STATE_SEND_INTERVAL_MS) return;
  lastStateSentAt = now;
  ws.send(JSON.stringify({
    type: "state",
    player: {
      role: me.role,
      name: sanitizePlayerName(myName, me.role),
      color: sanitizeColorHex(myColor, me.role),
      active: me.active,
      spectator: isSpectator,
      x: me.x, y: me.y, facing: me.facing,
      percent: me.percent, stocks: me.stocks,
      atkType: me.atkType, atkTimer: me.atkTimer,
      enhanceLevel: me.enhanceLevel, hammerCharge: me.hammerCharge,
      critReady: me.critReady, critActive: me.critActive,
      critStartedAt: me.critStartedAt, critLightHitsAfterExpiry: me.critLightHitsAfterExpiry,
      guardianHits: me.guardianHits, invincibleTimer: me.invincibleTimer,
      hasClone: me.hasClone, mp: me.mp, magicMode: me.magicMode,
      frozen: me.frozen, stun: me.stun, charKey: me.charKey,
      shielding: me.shielding, shieldHp: me.shieldHp, burnedOut: me.burnedOut
    }
  }));
}

function resolveStageCollisions(entity, prevX, prevY, maxJumps, canDropPlatforms) {
  const st = getCurrentStage();
  const prevBottom = prevY + entity.h;
  const prevTop = prevY;
  const nextBottom = entity.y + entity.h;

  if (!canDropPlatforms && entity.vy >= 0) {
    for (const plat of st.platforms) {
      if (prevBottom <= plat.y + 8 && nextBottom >= plat.y && entity.x + entity.w > plat.x && entity.x < plat.x + plat.w) {
        entity.y = plat.y - entity.h; entity.vy = 0; entity.jumps = maxJumps;
        break;
      }
    }
  }
  for (const solid of st.solids) {
    if (entity.x + entity.w > solid.x && entity.x < solid.x + solid.w && entity.y + entity.h > solid.y && entity.y < solid.y + solid.h) {
      if (entity.vy >= 0 && prevBottom <= solid.y + 10) {
        entity.y = solid.y - entity.h; entity.vy = 0; entity.jumps = maxJumps;
      } else if (entity.vy < 0 && prevTop >= solid.y + solid.h - 10) {
        entity.y = solid.y + solid.h; entity.vy = 0;
      } else if (prevX + entity.w <= solid.x + 10) {
        entity.x = solid.x - entity.w; entity.vx = 0;
      } else if (prevX >= solid.x + solid.w - 10) {
        entity.x = solid.x + solid.w; entity.vx = 0;
      }
    }
  }
}

function updateMyClone(dtScale, nowMs = performance.now()) {
  if (isPublicLobbyRoom() || phase !== "playing" || entryBlockedByHost || isRoomFullBlocked || isSpectator || myRole === 0) return;
  const cl = clones[myRole];
  const me = players[myRole];
  if (!cl || !cl.active) return;
  if (!me || me.stocks <= 0 || me.charKey !== "summoner") {
    delete clones[myRole];
    if (me) me.hasClone = false;
    sendCloneSync(null);
    return;
  }

  if (cl.charKey === "hammer") {
    ensureHammerCritState(cl, nowMs);
  }

  const spec = CHAR_SPECS[cl.charKey] || CHAR_SPECS.fighter;
  const ground = findSolidBeneath(cl.x + cl.w / 2, cl.y + cl.h);
  let nearestTarget = null, nearestDist = Infinity;
  for (const r of getParticipantRoles()) {
    if (r === myRole || isSameTeam(myRole, r)) continue;
    const t = players[r];
    if (!t || !t.active || t.stocks <= 0) continue;
    const d = Math.hypot((t.x + t.w / 2) - (cl.x + cl.w / 2), (t.y + t.h / 2) - (cl.y + cl.h / 2));
    if (d < nearestDist) { nearestDist = d; nearestTarget = t; }
  }

  if (cl.stun > 0) {
    cl.stun = Math.max(0, cl.stun - dtScale);
  } else if (nearestTarget) {
    const dx = (nearestTarget.x + nearestTarget.w / 2) - (cl.x + cl.w / 2);
    const dy = (nearestTarget.y + nearestTarget.h / 2) - (cl.y + cl.h / 2);
    cl.facing = dx >= 0 ? 1 : -1;
    if (Math.abs(dx) > (cl.charKey === "mage" ? 260 : 46)) cl.vx += cl.facing * spec.moveAcc * 0.55 * dtScale;
    if (((cl.x < ground.x + 28 && cl.vx < 0) || (cl.x + cl.w > ground.x + ground.w - 28 && cl.vx > 0) || (dy < -75 && Math.abs(dx) < 120 && Math.random() < 0.04)) && cl.jumps > 0 && cl.vy >= -1) {
      cl.vy = spec.jumpPower; cl.jumps--;
    }
    const inAttackRange = cl.charKey === "mage" ? (Math.abs(dx) <= 360 && Math.abs(dy) <= 36) : (Math.abs(dx) <= 46 && Math.abs(dy) <= 36);
    if (inAttackRange && cl.cooldown <= 0 && cl.atkTimer <= 0 && Math.random() < 0.14) {
      cl.atkTimer = cl.charKey === "fighter" ? 7 : 10;
      cl.cooldown = spec.lightCooldown + 28;
      cl.hasHit = false;
      if (cl.charKey === "mage") {
        const laserLen = 360, laserH = 10;
        const laserBeam = {
          ownerRole: myRole, fromClone: true, mode: "mage_laser",
          x: cl.facing === 1 ? cl.x + cl.w + 4 : cl.x - laserLen - 4,
          y: cl.y + 15, w: laserLen, h: laserH, dir: cl.facing,
          life: 9, maxLife: 9, dmg: Math.max(4, spec.lightDmg - 2), basePower: 3.5, hasHitRoles: []
        };
        beams.push(laserBeam);
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "beam", beam: laserBeam }));
      }
    }
  }

  cl.vx *= cl.stun > 0 ? Math.pow(0.94, dtScale) : Math.pow(spec.friction, dtScale);
  cl.vy += 0.56 * dtScale;
  const prevX = cl.x, prevY = cl.y;
  cl.x += cl.vx * dtScale; cl.y += cl.vy * dtScale;
  resolveStageCollisions(cl, prevX, prevY, spec.maxJumps || 2, false);

  if (cl.atkTimer > 0) { cl.atkTimer = Math.max(0, cl.atkTimer - dtScale); if (cl.atkTimer === 0) cl.hasHit = false; }
  if (cl.cooldown > 0) cl.cooldown = Math.max(0, cl.cooldown - dtScale);

  if (cl.charKey !== "mage" && cl.atkTimer > 0 && !cl.hasHit) {
    const hb = { x: cl.facing === 1 ? cl.x + cl.w - 2 : cl.x - 36, y: cl.y + 9, w: 38, h: 24 };
    const cx = cl.x + cl.w * 0.5;
    const cy = cl.y + cl.h * 0.5;
    for (const r of getParticipantRoles()) {
      if (r === myRole || isSameTeam(myRole, r)) continue;
      const target = players[r];
      if (!target || !target.active || target.stocks <= 0) continue;
      if (doesMeleeHitEntity(hb, cx, cy, target)) {
        cl.hasHit = true;
        sendHitToTarget(target.role, Math.max(4, spec.lightDmg - 2), 4.5, cl.facing, null, 0.55, { fromClone: true, wasLight: true, wasSmash: false });
        break;
      }
    }
    if (!cl.hasHit && checkHitEnemyClonesByBox(hb, Math.max(4, spec.lightDmg - 2), 4.5, cl.facing, null, 0.55, null, cx, cy, false, { wasLight: true, wasSmash: false })) cl.hasHit = true;
  }

  if (cl.percent >= SUMMON_CLONE_MAX_PERCENT || cl.x < -160 || cl.x > canvas.width + 160 || cl.y > canvas.height + 160) {
    delete clones[myRole]; me.hasClone = false;
    sendCloneSync(null); sendMyState(me, true);
    return;
  }
  sendCloneSync(cl);
}

function updateBurnDebuffs(dtScale) {
  if (isPublicLobbyRoom() || phase !== "playing" || entryBlockedByHost || isRoomFullBlocked || isSpectator || myRole === 0) return;
  const me = players[myRole];
  if (!me || me.stocks <= 0) return;
  for (let i = burnDebuffs.length - 1; i >= 0; i--) {
    const b = burnDebuffs[i];
    if (b.targetRole !== myRole) continue;
    b.tickTimer += dtScale;
    if (b.tickTimer >= 60) {
      b.tickTimer -= 60;
      if ((me.invincibleTimer || 0) <= 0) { me.percent += b.dmgPerTick; sendMyState(me, true); }
      if (--b.ticksLeft <= 0) burnDebuffs.splice(i, 1);
    }
  }
}

function updateBeams(dtScale) {
  for (let i = beams.length - 1; i >= 0; i--) {
    const bm = beams[i];
    bm.life -= dtScale;
    if (!isPublicLobbyRoom() && phase === "playing" && !entryBlockedByHost && !isRoomFullBlocked && !isSpectator && myRole !== 0 && bm.ownerRole === myRole && bm.mode !== "heal") {
      const hitBox = getClippedBeamRect(bm);
      const originX = bm.dir === 1 ? hitBox.x : hitBox.x + hitBox.w;
      const originY = hitBox.y + hitBox.h * 0.5;

      for (const r of getParticipantRoles()) {
        if (r === myRole || isSameTeam(myRole, r) || bm.hasHitRoles.includes(r)) continue;
        const target = players[r];
        if (!target || !target.active || target.stocks <= 0) continue;
        if (!rectsOverlap(hitBox, target)) continue;
        if (isBlockedByStageSegment(originX, originY, target.x + target.w * 0.5, target.y + target.h * 0.5)) continue;

        bm.hasHitRoles.push(r);
        if (bm.mode === "fire") sendHitToTarget(target.role, 0, 2.5, bm.dir, "burn", 0.62, { wasSmash: true });
        else if (bm.mode === "ice") sendHitToTarget(target.role, 4, 0, bm.dir, "freeze", 0.62, { wasLight: true });
        else if (bm.mode === "mage_laser") sendHitToTarget(target.role, bm.dmg || 8, bm.basePower || 5.0, bm.dir, null, 0.55, { wasLight: true, fromClone: !!bm.fromClone });
      }
      if (!bm.hasHitCloneOwners) bm.hasHitCloneOwners = [];
      checkHitEnemyClonesByBox(
        hitBox,
        bm.mode === "fire" ? 15 : (bm.mode === "ice" ? 4 : (bm.dmg || 8)),
        bm.mode === "fire" ? 2.5 : (bm.mode === "ice" ? 0 : (bm.basePower || 5.0)),
        bm.dir,
        bm.mode === "ice" ? "freeze" : null,
        0.55,
        bm.hasHitCloneOwners,
        originX,
        originY,
        false,
        { wasSmash: bm.mode === "fire", wasLight: bm.mode !== "fire" }
      );
    }
    if (bm.life <= 0) beams.splice(i, 1);
  }
}

function updateRings(dtScale) {
  for (let i = ringEffects.length - 1; i >= 0; i--) {
    const rg = ringEffects[i];
    rg.life -= dtScale;
    const curRadius = rg.maxRadius * Math.min(1, (1 - Math.max(0, rg.life / rg.maxLife)) * 1.35);
    if (!isPublicLobbyRoom() && phase === "playing" && !entryBlockedByHost && !isRoomFullBlocked && !isSpectator && myRole !== 0 && rg.ownerRole === myRole) {
      for (const r of getParticipantRoles()) {
        if (r === myRole || isSameTeam(myRole, r) || rg.hasHitRoles.includes(r)) continue;
        const target = players[r];
        if (!target || !target.active || target.stocks <= 0) continue;
        const closestX = Math.max(target.x, Math.min(rg.cx, target.x + target.w));
        const closestY = Math.max(target.y, Math.min(rg.cy, target.y + target.h));
        const dx = closestX - rg.cx;
        const dy = closestY - rg.cy;
        if (Math.hypot(dx, dy) <= curRadius) {
          rg.hasHitRoles.push(r);
          const dirX = ((target.x + target.w * 0.5) - rg.cx) >= 0 ? 1 : -1;
          sendHitToTarget(target.role, rg.dmg, rg.basePower, dirX, null, 0.65, { wasSmash: true });
        }
      }
      if (!rg.hasHitCloneOwners) rg.hasHitCloneOwners = [];
      for (const ownerStr of Object.keys(clones)) {
        const ownerRole = Number(ownerStr);
        if (ownerRole === myRole || isSameTeam(myRole, ownerRole) || rg.hasHitCloneOwners.includes(ownerRole)) continue;
        const cl = clones[ownerRole];
        if (!cl || !cl.active) continue;
        const closestX = Math.max(cl.x, Math.min(rg.cx, cl.x + cl.w));
        const closestY = Math.max(cl.y, Math.min(rg.cy, cl.y + cl.h));
        const dx = closestX - rg.cx;
        const dy = closestY - rg.cy;
        if (Math.hypot(dx, dy) <= curRadius) {
          rg.hasHitCloneOwners.push(ownerRole);
          const dirX = ((cl.x + cl.w * 0.5) - rg.cx) >= 0 ? 1 : -1;
          sendHitToEnemyClone(ownerRole, rg.dmg, rg.basePower, dirX, null, 0.65, { wasSmash: true });
        }
      }
    }
    if (rg.life <= 0) ringEffects.splice(i, 1);
  }
}

function updateMyPlayer(dtScale, nowMs = performance.now()) {
  if (isPublicLobbyRoom() || phase !== "playing" || entryBlockedByHost || isRoomFullBlocked || isSpectator || myRole === 0) return;
  const me = players[myRole];
  if (!me || me.stocks <= 0) return;
  const spec = CHAR_SPECS[me.charKey];
  const maxJumps = getMaxJumpsForPlayer(me);

  if ((me.invincibleTimer || 0) > 0) me.invincibleTimer = Math.max(0, me.invincibleTimer - dtScale);
  if (me.charKey === "elementalist") me.mp = Math.min(MAX_MP, (me.mp ?? MAX_MP) + (1 / 60) * dtScale);

  // ハンマー：蓄積120以上で会心状態（5秒間は絶対会心モード）
  if (me.charKey === "hammer") {
    ensureHammerCritState(me, nowMs);
  }

  if (down["KeyJ"] && !me.burnedOut && me.stun <= 0 && me.atkTimer <= 0 && !me.smashCharging) {
    me.shielding = true;
    me.shieldHp -= spec.shieldDrain * dtScale;
    if (me.shieldHp <= 0) triggerBurnout(me);
  } else {
    me.shielding = false;
    if (me.shieldHp < MAX_SHIELD && !me.burnedOut) me.shieldHp = Math.min(MAX_SHIELD, me.shieldHp + 0.35 * dtScale);
  }

  const canMove = me.stun <= 0 && !me.shielding && !me.smashCharging;
  const acc = canMove ? getEffectiveMoveAcc(me, spec) : 0;
  if (canMove && down["KeyA"]) { me.vx -= acc * dtScale; me.facing = -1; }
  if (canMove && down["KeyD"]) { me.vx += acc * dtScale; me.facing = 1; }
  if (canMove && down["KeyS"] && me.dropThroughTimer <= 0) me.dropThroughTimer = 8;

  me.vx *= me.stun > 0 ? Math.pow(0.94, dtScale) : Math.pow(spec.friction, dtScale);
  me.vy += 0.56 * dtScale;

  const prevX = me.x, prevY = me.y;
  me.x += me.vx * dtScale; me.y += me.vy * dtScale;
  if (me.dropThroughTimer > 0) me.dropThroughTimer = Math.max(0, me.dropThroughTimer - dtScale);
  resolveStageCollisions(me, prevX, prevY, maxJumps, (canMove && down["KeyS"]) || me.dropThroughTimer > 0);

  if (me.atkTimer > 0) {
    me.atkTimer = Math.max(0, me.atkTimer - dtScale);
    if (me.atkTimer === 0) {
      me.atkType = null;
      me.hasHit = false;
      me.critActive = false;
    }
  }
  if (me.cooldown > 0) me.cooldown = Math.max(0, me.cooldown - dtScale);
  if (me.stun > 0) {
    me.stun = Math.max(0, me.stun - dtScale);
    if (me.stun === 0) {
      me.frozen = false;
      if (me.burnedOut) { me.burnedOut = false; me.shieldHp = 60; }
    }
  }

  const hb = getMeleeHitbox(me, nowMs);
  const inActiveFrames = hb && (
    (hb.isSmash && me.atkTimer >= 6.5 && me.atkTimer <= 11.5) ||
    (!hb.isSmash && me.atkTimer >= (me.charKey === "fighter" ? 2.5 : 5.5) && me.atkTimer <= (me.charKey === "fighter" ? 6.5 : 8.5))
  );

  if (inActiveFrames && !me.hasHit) {
    const originX = me.x + me.w * 0.5;
    const originY = me.y + me.h * 0.5;

    for (const r of getParticipantRoles()) {
      if (r === myRole || isSameTeam(myRole, r)) continue;
      const target = players[r];
      if (!target || !target.active || target.stocks <= 0) continue;
      if (doesMeleeHitEntity(hb, originX, originY, target)) {
        me.hasHit = true;
        if (!hb.isSmash && me.charKey === "elementalist") me.mp = Math.min(MAX_MP, (me.mp || 0) + 5);
        if (hb.isSmash) {
          const ratio = me.smashChargeRatio || 0;
          let finalDmg = Math.floor(spec.smashDmg * (1 + ratio * 0.50));
          let finalKb = 14.5 * (1 + ratio * 0.45);
          let pierceGuard = false;
          let wasCrit = false;

          if (me.charKey === "hammer") {
            wasCrit = isHammerCritState(me, nowMs);
            if (wasCrit) {
              finalDmg += HAMMER_CRIT_BONUS_DMG; // 最大ダメージ +40
              finalKb *= 1.45;
              pierceGuard = true; // 会心攻撃はガード貫通
            }
            handleHammerHitProgress(me, wasCrit);
          }
          sendHitToTarget(target.role, finalDmg, finalKb, me.facing, null, 0.62, {
            wasSmash: true,
            wasLight: false,
            wasCrit,
            pierceGuard
          });
          me.smashChargeRatio = 0;
          sendMyState(me, true);
        } else {
          const lightStats = getEffectiveLightStats(me, spec);
          if (me.charKey === "guardian" && (me.invincibleTimer || 0) <= 0) {
            me.guardianHits = (me.guardianHits || 0) + 1;
            if (me.guardianHits >= GUARDIAN_INVINCIBLE_HITS) {
              me.guardianHits = 0; me.invincibleTimer = GUARDIAN_INVINCIBLE_FRAMES;
            }
            sendMyState(me, true);
          }
          sendHitToTarget(target.role, lightStats.dmg, lightStats.basePower, me.facing, null, 0.62, { wasLight: true, wasSmash: false });
        }
        break;
      }
    }
    if (!me.hasHit) {
      if (hb.isSmash) {
        const ratio = me.smashChargeRatio || 0;
        let finalDmg = Math.floor(spec.smashDmg * (1 + ratio * 0.50));
        let finalKb = 14.5 * (1 + ratio * 0.45);
        let wasCrit = false;
        if (me.charKey === "hammer") {
          wasCrit = isHammerCritState(me, nowMs);
          if (wasCrit) {
            finalDmg += HAMMER_CRIT_BONUS_DMG;
            finalKb *= 1.45;
          }
        }
        if (checkHitEnemyClonesByBox(hb, finalDmg, finalKb, me.facing, null, 0.62, null, originX, originY, false, { wasSmash: true, wasLight: false })) {
          if (me.charKey === "hammer") handleHammerHitProgress(me, wasCrit);
          me.hasHit = true; me.smashChargeRatio = 0; sendMyState(me, true);
        }
      } else {
        const lightStats = getEffectiveLightStats(me, spec);
        if (checkHitEnemyClonesByBox(hb, lightStats.dmg, lightStats.basePower, me.facing, null, 0.62, null, originX, originY, false, { wasLight: true, wasSmash: false })) me.hasHit = true;
      }
    }
  }

  if (me.x < -160 || me.x > canvas.width + 160 || me.y > canvas.height + 160) {
    me.stocks = Math.max(0, me.stocks - 1);
    me.percent = 0; me.vx = 0; me.vy = 0; me.stun = 0; me.frozen = false;
    me.jumps = maxJumps; me.shielding = false; me.burnedOut = false; me.shieldHp = MAX_SHIELD;
