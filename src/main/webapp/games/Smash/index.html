</div>

<div class="panel-row hidden" id="practice-control-row">

</div>

<div class="panel-row hidden" id="practice-bot-row">

</div>

<div class="panel-row hidden" id="color-row">

  <div id="color-palette" style="display:flex;flex-wrap:wrap;gap:6px;"></div>
</div>

<div class="panel-row hidden" id="map-step-row">

  <select id="stage-select"></select>
  <select id="mode-select">
    <option value="ffa">⚔️ 個人戦</option>
    <option value="team2v2">🛡️ 2対2</option>
  </select>
  <button id="confirm-map-btn" class="btn success" type="button">このマップでキャラ選択へ</button>
  <button id="host-lock-btn" class="btn secondary" type="button">🔓 固定ホスト：OFF</button>
  <button id="reset-ghost-btn" class="btn warn" type="button">🧹 ゴースト整理</button>
</div>

<div class="panel-row hidden" id="char-step-row">

  <select id="char-select-dropdown"></select>
  <span id="char-desc-inline"></span>
  <button id="ready-toggle-btn" class="btn success" type="button">✅ 完了にする</button>

  <span id="ready-summary">完了：0/0人</span>
</div>

<div id="stage-chat-layout">

      <button id="chat-send-btn" class="btn secondary" type="button">送信</button>
    </div>
  </aside>
</div>

<div id="controls-guide">

function initStageGimmicks(stage, resetPhase = false) {
  if (!stage) return;
  if (Array.isArray(stage.movingPlatforms)) {
    stage.movingPlatforms.forEach(mp => {
      mp.baseX = typeof mp.baseX === "number" ? mp.baseX : mp.x;
      mp.baseY = typeof mp.baseY === "number" ? mp.baseY : mp.y;
      if (resetPhase || typeof mp.t !== "number") {
        mp.t = typeof mp.phase === "number" ? mp.phase : 0;
      }
      const wave = Math.sin(mp.t);
      mp.x = mp.baseX + (mp.moveX || 0) * wave;
      mp.y = mp.baseY + (mp.moveY || 0) * wave;
      mp.dx = 0;
      mp.dy = 0;
    });
  }
  if (Array.isArray(stage.disappearingPlatforms)) {
    stage.disappearingPlatforms.forEach(dp => {
      dp.visible = true;
    });
  }
}

function getVisibleDisappearingPlatforms(stage) {
  if (!stage || !Array.isArray(stage.disappearingPlatforms)) return [];
  return stage.disappearingPlatforms.filter(dp => dp.visible !== false);
}

function updateStageGimmicks(dtScale) {
  const st = getCurrentStage();
  if (!st) return;
  initStageGimmicks(st, false);
  gimmickFrameCounter += dtScale;

  if (Array.isArray(st.movingPlatforms)) {
    st.movingPlatforms.forEach(mp => {
      const prevX = mp.x;
      const prevY = mp.y;
      mp.t = (typeof mp.t === "number" ? mp.t : (mp.phase || 0)) + (mp.speed || 0.03) * dtScale;
      const wave = Math.sin(mp.t);
      const nextX = mp.baseX + (mp.moveX || 0) * wave;
      const nextY = mp.baseY + (mp.moveY || 0) * wave;
      mp.dx = nextX - prevX;
      mp.dy = nextY - prevY;
      mp.x = nextX;
      mp.y = nextY;
    });
  }

  if (Array.isArray(st.disappearingPlatforms)) {
    st.disappearingPlatforms.forEach(dp => {
      const vis = dp.visibleFrames || 180;
      const hid = dp.hiddenFrames || 120;
      const cycle = vis + hid;
      const pos = ((gimmickFrameCounter + (dp.phaseOffset || 0)) % cycle + cycle) % cycle;
      dp.visible = pos < vis;
    });
  }
}

function ensureHammerCritState(entity, nowMs = performance.now()) {
  if (!entity || entity.charKey !== "hammer") return;
  if (typeof entity.critLightHitsAfterExpiry !== "number") {
    entity.critLightHitsAfterExpiry = 0;
  }
  if ((entity.hammerCharge || 0) >= HAMMER_CRIT_THRESHOLD) {
    if (!entity.critReady) {
      entity.critReady = true;
      entity.critStartedAt = nowMs;
      entity.critLightHitsAfterExpiry = 0;
    } else if (!entity.critStartedAt) {
      entity.critStartedAt = nowMs;
    }
  }
}

function isHammerCritState(entity, nowMs = performance.now()) {
  if (!entity || entity.charKey !== "hammer") return false;
  ensureHammerCritState(entity, nowMs);
  return !!(entity.critActive || entity.critReady || (entity.hammerCharge || 0) >= HAMMER_CRIT_THRESHOLD);
}

function isHammerAbsoluteCritMode(entity, nowMs = performance.now()) {
  if (!isHammerCritState(entity, nowMs)) return false;
  const elapsed = nowMs - (entity.critStartedAt || nowMs);
  return elapsed < HAMMER_CRIT_ABS_DURATION_MS;
}

function getHammerRemainingAbsSec(entity, nowMs = performance.now()) {
  if (!isHammerCritState(entity, nowMs)) return 0;
  const rem = HAMMER_CRIT_ABS_DURATION_MS - (nowMs - (entity.critStartedAt || nowMs));
  return Math.max(0, rem / 1000);
}

function resetHammerCritAndCharge(entity) {
  if (!entity) return;
  entity.hammerCharge = 0;
  entity.critReady = false;
  entity.critActive = false;
  entity.critStartedAt = 0;
  entity.critLightHitsAfterExpiry = 0;
}

function handleHammerHitProgress(entity, wasCrit) {
  if (!entity || entity.charKey !== "hammer") return;
  const nowMs = performance.now();
  if (wasCrit) {
    resetHammerCritAndCharge(entity);
  } else {
    entity.hammerCharge = (entity.hammerCharge || 0) + HAMMER_HIT_GAIN;
    if (entity.hammerCharge >= HAMMER_CRIT_THRESHOLD && !entity.critReady) {
      entity.critReady = true;
      entity.critStartedAt = nowMs;
      entity.critLightHitsAfterExpiry = 0;
    }
  }
}

function handleHammerIncomingHit(entity, wasSmash, wasLight, nowMs = performance.now()) {
  if (!entity || entity.charKey !== "hammer") return { changed: false, resetOccurred: false };

  const inCrit = isHammerCritState(entity, nowMs);
  const absMode = isHammerAbsoluteCritMode(entity, nowMs);

  if (inCrit && absMode) {
    return { changed: false, resetOccurred: false };
  }

  if (inCrit && !absMode) {
    if (wasSmash) {
      resetHammerCritAndCharge(entity);
      return { changed: true, resetOccurred: true };
    }
    if (wasLight) {
      entity.critLightHitsAfterExpiry = (entity.critLightHitsAfterExpiry || 0) + 1;
      if (entity.critLightHitsAfterExpiry >= HAMMER_EXPIRED_LIGHT_RESET_COUNT) {
        resetHammerCritAndCharge(entity);
        return { changed: true, resetOccurred: true };
      }
      return { changed: true, resetOccurred: false };
    }
    return { changed: false, resetOccurred: false };
  }

  let gain = 0;
  if (wasSmash) gain = HAMMER_HIT_SMASH_GAIN;
  else if (wasLight) gain = HAMMER_HIT_LIGHT_GAIN;

  if (gain > 0) {
    entity.hammerCharge = (entity.hammerCharge || 0) + gain;
    if (entity.hammerCharge >= HAMMER_CRIT_THRESHOLD && !entity.critReady) {
      entity.critReady = true;
      entity.critStartedAt = nowMs;
      entity.critLightHitsAfterExpiry = 0;
    }
    return { changed: true, resetOccurred: false };
  }

  return { changed: false, resetOccurred: false };
}

function rectsOverlap(a, b) {
  return (
    a.x < b.x + b.w &&
    a.x + a.w > b.x &&
    a.y < b.y + b.h &&
    a.y + a.h > b.y
  );
}

function segmentIntersectsRect(x1, y1, x2, y2, rx, ry, rw, rh) {
  let t0 = 0;
  let t1 = 1;
  const dx = x2 - x1;
  const dy = y2 - y1;

  const checks = [
    [-dx, x1 - rx],
    [dx, rx + rw - x1],
    [-dy, y1 - ry],
    [dy, ry + rh - y1]
  ];

  for (let i = 0; i < checks.length; i++) {
    const p = checks[i][0];
    const q = checks[i][1];
    if (Math.abs(p) < 1e-9) {
      if (q < 0) return false;
    } else {
      const r = q / p;
      if (p < 0) {
        if (r > t1) return false;
        if (r > t0) t0 = r;
      } else {
        if (r < t0) return false;
        if (r < t1) t1 = r;
      }
    }
  }
  return t0 <= t1;
}

function getAllStageObstacles() {
  const st = getCurrentStage();
  return [
    ...(st.solids || []),
    ...(st.platforms || []),
    ...(st.movingPlatforms || []),
    ...getVisibleDisappearingPlatforms(st)
  ];
}

function isBlockedByStageSegment(x1, y1, x2, y2) {
  const obstacles = getAllStageObstacles();
  for (let i = 0; i < obstacles.length; i++) {
    const ob = obstacles[i];
    if (segmentIntersectsRect(x1, y1, x2, y2, ob.x, ob.y, ob.w, ob.h)) {
      return true;
    }
  }
  return false;
}

function doesMeleeHitEntity(hb, originX, originY, target) {
  if (!rectsOverlap(hb, target)) return false;
  const tx = target.x + target.w * 0.5;
  const ty = target.y + target.h * 0.5;
  return !isBlockedByStageSegment(originX, originY, tx, ty);
}

function getClippedBeamRect(bm) {
  const obstacles = getAllStageObstacles();
  const bx = bm.x;
  const by = bm.y;
  const bw = bm.w;
  const bh = bm.h;
  const midY = by + bh * 0.5;

  if (bm.dir === 1) {
    let endX = bx + bw;
    const startX = bx;
    for (let i = 0; i < obstacles.length; i++) {
      const ob = obstacles[i];
      if (midY >= ob.y && midY <= ob.y + ob.h && ob.x + ob.w > startX && ob.x < endX) {
        endX = Math.max(startX, ob.x);
      }
    }
    return { x: startX, y: by, w: Math.max(0, endX - startX), h: bh };
  } else {
    let startX = bx;
    const endX = bx + bw;
    for (let i = 0; i < obstacles.length; i++) {
      const ob = obstacles[i];
      if (midY >= ob.y && midY <= ob.y + ob.h && ob.x < endX && ob.x + ob.w > startX) {
        startX = Math.min(endX, ob.x + ob.w);
      }
    }
    return { x: startX, y: by, w: Math.max(0, endX - startX), h: bh };
  }
}

function canSendOrShowChat() {
  return hasEnteredLobby && !isPracticeMode && phase !== "playing" && !isRoomFullBlocked && !entryBlockedByHost;
}

function renderChatLogDOM() {
  chatLogEl.innerHTML = "";
  if (chatMessages.length === 0) {
    const empty = document.createElement("div");
    empty.className = "chat-empty";
    empty.textContent = "まだコメントはありません";
    chatLogEl.appendChild(empty);
    return;
  }

  chatMessages.forEach(m => {
    const item = document.createElement("div");
    item.className = "chat-item";

    const senderSpan = document.createElement("span");
    senderSpan.className = "chat-sender";
    senderSpan.style.color = m.color || "#38bdf8";
    senderSpan.textContent = `${m.sender}:`;

    const textSpan = document.createElement("span");
    textSpan.textContent = ` ${m.text}`;

    item.appendChild(senderSpan);
    item.appendChild(textSpan);
    chatLogEl.appendChild(item);
  });
  chatLogEl.scrollTop = chatLogEl.scrollHeight;
}

function clearChatMessages() {
  chatMessages = [];
  renderChatLogDOM();
}

function updateChatVisibility() {
  const allowed = canSendOrShowChat();
  chatSidebarEl.classList.toggle("hidden", !allowed);
  chatInputEl.disabled = !allowed;
  chatSendBtn.disabled = !allowed;
  if (!allowed && document.activeElement === chatInputEl) {
    chatInputEl.blur();
  }
  if (phase === "playing") {
    clearChatMessages();
  }
}

function pushChatMessage(msg) {
  if (phase === "playing" || isPracticeMode) return;
  const text = String(msg.text || "").trim().slice(0, 80);
  if (!text) return;
  const roleNum = Number(msg.role) || 0;
  chatMessages.push({
    sender: sanitizePlayerName(msg.sender, roleNum),
    color: sanitizeColorHex(msg.color, roleNum || 1),
    text
  });
  if (chatMessages.length > CHAT_MAX_ITEMS) {
    chatMessages = chatMessages.slice(-CHAT_MAX_ITEMS);
  }
  renderChatLogDOM();
}

function sendChatMessage() {
  if (!canSendOrShowChat()) return;
  const text = (chatInputEl.value || "").trim().slice(0, 80);
  if (!text) return;

  const payload = {
    type: "chat",
    sender: sanitizePlayerName(myName, myRole),
    role: myRole,
    color: sanitizeColorHex(myColor, myRole || 1),
    text
  };
  pushChatMessage(payload);
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(payload));
  }
  chatInputEl.value = "";
}

chatSendBtn.addEventListener("click", sendChatMessage);

const players = {};
for (let r = 1; r <= MAX_BATTLE_PLAYERS; r++) {
  players[r] = makePlayer(r, "fighter");
}

function isRoleSpectating(r) {
  if (isPracticeMode) return false;
  if (r === myRole && isSpectator) return true;
  if (spectatorRoles.has(r)) return true;
  return !!(players[r] && players[r].spectator);
}

function getParticipantRoles() {
  if (isPracticeMode) return [1, 2];
  return activeRoles.filter(r => !isRoleSpectating(r));
}

function getDisplayNameOfRole(roleNum) {
  if (isPracticeMode) {
    if (roleNum === 1) return myName || "Player1";
    if (roleNum === 2) return `CPU (Lv.${practiceBotLevel})`;
  }
  if (roleNum === myRole && myName) return myName;
  const p = players[roleNum];
  if (p && p.name) return p.name;
  return `Player${roleNum}`;
}

function getColorOfRole(roleNum) {
  if (isPracticeMode) {
    if (roleNum === 1) return sanitizeColorHex(myColor, 1);
    return "#38bdf8";
  }
  if (roleNum === myRole) return sanitizeColorHex(myColor, roleNum);
  const p = players[roleNum];
  if (p && p.color) return sanitizeColorHex(p.color, roleNum);
  return sanitizeColorHex(PLAYER_COLORS[roleNum], roleNum);
}

function getTakenColorsByOthers() {
  const taken = new Set();
  for (const r of activeRoles) {
    if (r === myRole) continue;
    const p = players[r];
    if (p && p.color) {
      taken.add(sanitizeColorHex(p.color, r));
    }
  }
  return taken;
}

function ensureNonConflictingColor() {
  if (isPublicLobbyRoom() || isPracticeMode) {
    myColor = myPreferredColor;
    if (myRole !== 0 && players[myRole]) {
      players[myRole].color = myColor;
    }
    return;
  }
  const taken = getTakenColorsByOthers();
  const desired = sanitizeColorHex(myPreferredColor, myRole || 1);
  if (!taken.has(desired)) {
    myColor = desired;
  } else {
    const freeColor = ALLOWED_COLORS.find(c => !taken.has(c));
    myColor = freeColor || desired;
  }
  if (myRole !== 0 && players[myRole]) {
    players[myRole].color = myColor;
  }
}

function sendProfileSync() {
  if (isPublicLobbyRoom() || isPracticeMode) return;
  if (ws && ws.readyState === WebSocket.OPEN && !entryBlockedByHost && !isRoomFullBlocked && myRole !== 0) {
    ws.send(JSON.stringify({
      type: "profile",
      role: myRole,
      name: sanitizePlayerName(myName, myRole),
      color: sanitizeColorHex(myColor, myRole),
      spectator: isSpectator
    }));
  }
}

function renderColorPalette() {
  const taken = getTakenColorsByOthers();
  const canPickColor = !isPracticeMode && !isPublicLobbyRoom() && !entryBlockedByHost && !isRoomFullBlocked && myRole !== 0 && (phase === "map_select" || phase === "char_select");
  const buttons = Array.from(colorPaletteEl.querySelectorAll(".color-swatch-btn"));

  buttons.forEach(btn => {
    const hex = btn.dataset.color;
    const isMine = sanitizeColorHex(myColor, myRole || 1) === hex;
    const isTakenByOther = !isPublicLobbyRoom() && taken.has(hex);

    btn.classList.toggle("active", isMine);
    btn.disabled = !canPickColor || (!isMine && isTakenByOther);
    const labelEl = btn.querySelector(".swatch-text");
    const baseLabel = btn.dataset.label;
    if (labelEl) {
      labelEl.textContent = isTakenByOther && !isMine ? `${baseLabel}(使用中)` : baseLabel;
    }
  });
}

function initColorPaletteDOM() {
  colorPaletteEl.innerHTML = "";
  COLOR_PALETTE.forEach(item => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "color-swatch-btn";
    btn.dataset.color = item.hex.toLowerCase();
    btn.dataset.label = item.label;

    const dot = document.createElement("span");
    dot.className = "color-dot";
    dot.style.backgroundColor = item.hex;

    const text = document.createElement("span");
    text.className = "swatch-text";
    text.textContent = item.label;

    btn.appendChild(dot);
    btn.appendChild(text);

    btn.addEventListener("click", () => {
      if (isPracticeMode || isPublicLobbyRoom() || entryBlockedByHost || isRoomFullBlocked || myRole === 0 || (phase !== "map_select" && phase !== "char_select")) return;
      const chosen = item.hex.toLowerCase();
      if (getTakenColorsByOthers().has(chosen)) return;
      myPreferredColor = chosen;
      myColor = chosen;
      localStorage.setItem("smash_player_color", myPreferredColor);
      if (players[myRole]) players[myRole].color = myColor;
      renderColorPalette();
      sendProfileSync();
    });

    colorPaletteEl.appendChild(btn);
  });
  renderColorPalette();
}

function applyPlayerName(rawName, reconnectIfNeeded = false) {
  myName = sanitizePlayerName(rawName, myRole);
  localStorage.setItem("smash_player_name", myName);
  gateNameInput.value = myName;
  inlineNameInput.value = myName;

    } else if (ws && ws.readyState === WebSocket.OPEN) {

    } else if (hasEnteredLobby) {

function syncUrlWithPassphrase(passphrase) {
  try {
    const url = new URL(location.href);
    if (passphrase) {
      url.searchParams.set("room", passphrase);
    } else {
      url.searchParams.delete("room");
    }
    history.replaceState(null, "", url.toString());
  } catch (_) {}
}

function updatePassphraseBadge() {
  if (isPracticeMode) {
    currentPassphraseBadgeEl.textContent = `練習場モード（1P vs CPU Lv.${practiceBotLevel}）`;
  } else if (currentPassphrase) {
    currentPassphraseBadgeEl.textContent = `合言葉部屋：「${currentPassphrase}」（最大${MAX_BATTLE_PLAYERS}人）`;
  } else {
    currentPassphraseBadgeEl.textContent = `公開待機部屋（ロビー・最大${MAX_LOBBY_PLAYERS}人）`;
  }
}

function switchRoomByPassphrase(nextRawPassphrase, forceReconnect = true) {
  const nextPass = sanitizePassphrase(nextRawPassphrase);
  const changed = nextPass !== currentPassphrase;
  currentPassphrase = nextPass;
  passphraseInputEl.value = currentPassphrase;
  syncUrlWithPassphrase(currentPassphrase);
  updatePassphraseBadge();
  renderColorPalette();
  clearChatMessages();
  updateChatVisibility();

  if (isPracticeMode) {
    isPracticeMode = false;
    isPracticeStopped = false;
    practiceControlRow.classList.add("hidden");
    practiceBotRow.classList.add("hidden");
    updateStatusByPhase();
    connectWs();
    return;
  }

  if (changed || forceReconnect || !ws || ws.readyState !== WebSocket.OPEN) {
    connectWs();
  } else {
    updateRoomStatusBox();
    updateStatusByPhase();
  }
}

joinPassphraseBtn.addEventListener("click", () => {
  const entered = sanitizePassphrase(passphraseInputEl.value);
  if (!entered) {
    switchRoomByPassphrase("", true);
    return;
  }
  switchRoomByPassphrase(entered, true);
});

});

function getHostRole() {
  if (activeRoles.length === 0) return 0;
  if (fixedHostThisPc && myRole !== 0 && activeRoles.includes(myRole)) {
    return myRole;
  }
  return Math.min(...activeRoles);
}

function amIHost() {
  if (isPracticeMode) return true;
  if (isPublicLobbyRoom()) return false;
  if (isSpectator || entryBlockedByHost || isRoomFullBlocked) return false;
  return myRole !== 0 && activeRoles.includes(myRole) && getHostRole() === myRole;
}

function getCurrentStage() {
  const st = STAGES[currentStageKey] || STAGES.battlefield;
  initStageGimmicks(st, false);
  return st;
}

function getSpawnPoint(roleNum) {
  const st = getCurrentStage();
  if (st && st.spawns && st.spawns[roleNum]) {
    return st.spawns[roleNum];
  }
  const fallback = {
    1: { x: 240, y: 150, facing: 1 },
    2: { x: 800, y: 150, facing: -1 },
    3: { x: 420, y: 120, facing: 1 },
    4: { x: 620, y: 120, facing: -1 }
  };
  return fallback[roleNum] || fallback[1];
}

function getTeamOfRole(roleNum) {
  if (isPracticeMode) {
    return roleNum === 1 ? "A" : "B";
  }
  if (gameMode !== "team2v2") return String(roleNum);
  return (roleNum === 1 || roleNum === 3) ? "A" : "B";
}

function getTeamLabel(roleNum) {
  if (gameMode !== "team2v2") return "";
  return getTeamOfRole(roleNum) === "A" ? "[Aチーム]" : "[Bチーム]";
}

function isSameTeam(roleA, roleB) {
  if (gameMode !== "team2v2") return false;
  return getTeamOfRole(roleA) === getTeamOfRole(roleB);
}

function getStageBounds() {
  const st = getCurrentStage();
  const minX = Math.min(...st.solids.map(s => s.x));
  const maxX = Math.max(...st.solids.map(s => s.x + s.w));
  const groundY = Math.max(...st.solids.map(s => s.y));
  return { minX, maxX, groundY };
}

function getRecoveryTargetX(bot) {
  const { minX, maxX } = getStageBounds();
  const centerX = (minX + maxX) * 0.5;
  if (bot.x < minX - 20) return minX + 95;
  if (bot.x > maxX + 20) return maxX - 95;
  return centerX;
}

function getBotRecoveryJumpInterval(level) {
  if (level <= 2) return 11;
  if (level <= 4) return 14;
  if (level <= 6) return 17;
  if (level <= 8) return 20;
  return 23;
}

function updateRoomStatusBox() {
  if (!hasEnteredLobby) {
    roomStatusEl.textContent = "プレイヤー名を入力してロビーへ入ってください";
    return;
  }
  if (isPracticeMode) {
    roomStatusEl.textContent = `練習場モード ｜ ${myName || "Player1"} vs CPU (Lv.${practiceBotLevel}・${CHAR_SPECS[practiceBotChar].shortName}) ｜ ${isPracticeStopped ? "停止中" : "稼働中"}`;
    return;
  }
  if (isPublicLobbyRoom()) {
    const count = activeRoles.length;
    roomStatusEl.textContent = `公開待機部屋（ロビー）：現在 ${count}/${MAX_LOBBY_PLAYERS} 人入室中 ｜ 合言葉を入力すると対戦部屋（最大${MAX_BATTLE_PLAYERS}人）へ移動できます`;
    return;
  }
  if (isRoomFullBlocked) {
    roomStatusEl.textContent = `合言葉「${currentPassphrase}」は満員（${MAX_BATTLE_PLAYERS}/${MAX_BATTLE_PLAYERS}人）のため入室できません`;
    return;
  }
  if (entryBlockedByHost) {
    roomStatusEl.textContent = `合言葉「${currentPassphrase}」は対戦中またはホスト制限中のため入室できません`;
    return;
  }
  const count = activeRoles.length;
  const specCount = activeRoles.filter(r => isRoleSpectating(r)).length;
  const battleCount = count - specCount;
  const modeText = gameMode === "team2v2" ? "2対2" : "個人戦";
  const specText = specCount > 0 ? `（観戦${specCount}人）` : "";
  const names = activeRoles.map(r => {
    const tag = isRoleSpectating(r) ? "[観戦]" : getTeamLabel(r);
    return `${getDisplayNameOfRole(r)}${tag}`;
  }).join("、");
  roomStatusEl.textContent = `合言葉「${currentPassphrase}」[${modeText}]：現在 ${count}/${MAX_BATTLE_PLAYERS} 人（対戦${battleCount}人${specText}）${names ? "（" + names + "）" : ""}`;
}

    charSelectDropdown.disabled = false;
    readyToggleBtn.disabled = false;
    readyToggleBtn.textContent = "⚔️ この設定で練習スタート";
    readyToggleBtn.className = "btn success";
    backToMapBtn.disabled = false;
    readySummaryEl.textContent = `自機：${CHAR_SPECS[selectedChar].shortName} / CPU：${CHAR_SPECS[practiceBotChar].shortName}(Lv.${practiceBotLevel})`;
    return;
  }

  practiceControlRow.classList.add("hidden");
  practiceBotRow.classList.add("hidden");

  if (isPublicLobbyRoom()) {
    colorRow.classList.add("hidden");
    mapStepRow.classList.add("hidden");
    charStepRow.classList.add("hidden");
    return;
  }

  if (isRoomFullBlocked || entryBlockedByHost) {
    colorRow.classList.add("hidden");
    mapStepRow.classList.add("hidden");
    charStepRow.classList.add("hidden");
    return;
  }

  colorRow.classList.remove("hidden");

  if (phase === "map_select") {
    mapStepRow.classList.remove("hidden");
    charStepRow.classList.add("hidden");

    const host = amIHost();
    stageSelectEl.disabled = !host;
    modeSelectEl.disabled = !host;
    confirmMapBtn.disabled = !host;
    confirmMapBtn.textContent = host ? "このマップでキャラ選択へ" : "ホストがマップ選択中...";
    resetGhostBtn.disabled = !host;
  } else if (phase === "char_select") {
    mapStepRow.classList.add("hidden");
    if (isSpectator) {
      charStepRow.classList.add("hidden");
    } else {
      charStepRow.classList.remove("hidden");
      const iAmReady = myRole !== 0 && readyRoles.has(myRole);
      charSelectDropdown.disabled = iAmReady;
      backToMapBtn.disabled = iAmReady;
      readyToggleBtn.disabled = (myRole === 0);
      updateReadySummary();
    }
  } else {
    mapStepRow.classList.add("hidden");
    charStepRow.classList.add("hidden");
  }
}

function updateStatusByPhase() {
  if (!hasEnteredLobby) {
    statusEl.textContent = "名前を入力してロビーへ入ってください";
    return;
  }
  if (isPracticeMode) {
    const stName = getCurrentStage().name;
    if (isPracticeStopped) {
      statusEl.textContent = `⏸ 練習場ストップ中 ｜ マップ：${stName} ｜ 自機：${CHAR_SPECS[selectedChar].shortName} vs CPU Lv.${practiceBotLevel}`;
    } else {
      statusEl.textContent = `🤖 練習場プレイ中 ｜ マップ：${stName} ｜ 自機：${CHAR_SPECS[selectedChar].shortName} vs CPU Lv.${practiceBotLevel}`;
    }
    return;
  }
  if (isPublicLobbyRoom()) {
    statusEl.textContent = `🏛️ 公開待機部屋（ロビー）｜ 名前：${myName} ｜ 合言葉を入力して対戦部屋へ移動できます`;
    return;
  }
  if (isRoomFullBlocked) {
    statusEl.textContent = `🚫 合言葉「${currentPassphrase}」は満員（${MAX_BATTLE_PLAYERS}/${MAX_BATTLE_PLAYERS}人）です`;
    return;
  }
  if (entryBlockedByHost) {
    statusEl.textContent = `🚫 合言葉「${currentPassphrase}」は対戦中またはホスト制限中のため入室できません`;
    return;
  }
  if (isSpectator) {
    statusEl.textContent = `👀 観戦モード（${myName}）｜ 合言葉「${currentPassphrase}」の進行を見守っています`;
    return;
  }

  const roleLabel = myRole ? `${myName} [P${myRole}${getTeamLabel(myRole)}]` : `${myName} [接続中]`;
  const modeLabel = gameMode === "team2v2" ? "2対2" : "個人戦";
  if (phase === "map_select") {
    statusEl.textContent = `${roleLabel} ｜ 合言葉「${currentPassphrase}」[${modeLabel}] ｜ 1. マップと対戦形式を選択中`;
  } else if (phase === "char_select") {
    const participants = getParticipantRoles();
    const readyCount = participants.filter(r => readyRoles.has(r)).length;
    statusEl.textContent = `${roleLabel} ｜ 合言葉「${currentPassphrase}」[${modeLabel}] ｜ 2. キャラ選択（完了 ${readyCount}/${participants.length}人）`;
  } else if (phase === "countdown") {
    statusEl.textContent = `${roleLabel} ｜ 合言葉「${currentPassphrase}」[${modeLabel}] ｜ 試合開始まで ${countdownLeft} 秒！`;
  } else if (phase === "playing") {
    statusEl.textContent = `${roleLabel} ｜ 合言葉「${currentPassphrase}」[${modeLabel}] ｜ 対戦中！`;
  } else if (phase === "gameover") {
    statusEl.textContent = `${roleLabel} ｜ 合言葉「${currentPassphrase}」[${modeLabel}] ｜ 結果発表（${resultSecLeft}秒後にキャラ選択へ）`;
  }
}

function enterCharSelectPhase(nextStageKey, nextGameMode) {
  clearCountdownTimer();
  if (nextStageKey && STAGES[nextStageKey]) {
    currentStageKey = nextStageKey;
    stageSelectEl.value = currentStageKey;
  }
  if (nextGameMode === "team2v2" || nextGameMode === "ffa") {
    gameMode = nextGameMode;
    modeSelectEl.value = gameMode;
  }
  initStageGimmicks(getCurrentStage(), true);
  phase = "char_select";
  readyRoles = new Set();
  winnerInfo = null;
  updateControlsVisibility();
  updateStatusByPhase();
}

function startCountdownPhase() {
  clearCountdownTimer();
  phase = "countdown";
  countdownLeft = COUNTDOWN_SECONDS;
  winnerInfo = null;
  gameOverSent = false;
  resetMatchEntities();

  for (const r of activeRoles) {
    if (isRoleSpectating(r)) continue;
    const p = players[r] || makePlayer(r, selectedChar);
    players[r] = p;
    p.active = true;
    p.spectator = false;
    const cKey = (r === myRole) ? selectedChar : (p.charKey || selectedChar);
    resetPlayerForMatch(p, r, cKey);
  }

  updateControlsVisibility();
  updateStatusByPhase();

  countdownTimerId = setInterval(() => {
    if (phase !== "countdown") {
      clearCountdownTimer();
      return;
    }
    countdownLeft -= 1;
    updateStatusByPhase();
    if (countdownLeft <= 0) {
      clearCountdownTimer();
      phase = "playing";
      matchStartedAt = performance.now();
      updateControlsVisibility();
      updateStatusByPhase();
    }
  }, 1000);
}

function enterGameOverPhase(winInfo) {
  clearCountdownTimer();
  phase = "gameover";
  winnerInfo = winInfo || { text: "決着！" };
  resultSecLeft = RESULT_SECONDS;
  updateControlsVisibility();
  updateStatusByPhase();

  if (!isPracticeMode && amIHost() && !gameOverSent && ws && ws.readyState === WebSocket.OPEN) {
    gameOverSent = true;
    ws.send(JSON.stringify({
      type: "game_over",
      winner: winnerInfo.text,
      stage: currentStageKey,
      mode: gameMode
    }));
  }

  countdownTimerId = setInterval(() => {
    if (phase !== "gameover") {
      clearCountdownTimer();
      return;
    }
    resultSecLeft -= 1;
    updateStatusByPhase();
    if (resultSecLeft <= 0) {
      clearCountdownTimer();
      enterCharSelectPhase(currentStageKey, gameMode);
      if (!isPracticeMode && amIHost()) {
        sendRoomSync();
      }
    }
  }, 1000);
}

function resetPracticeMatchState() {
  clearCountdownTimer();
  phase = "playing";
  isPracticeStopped = false;
  countdownLeft = 0;
  resultSecLeft = RESULT_SECONDS;
  matchStartedAt = performance.now();
  resetMatchEntities();

  players[1] = makePlayer(1, selectedChar);
  players[1].active = true;
  players[1].spectator = false;
  players[1].isBot = false;
  resetPlayerForMatch(players[1], 1, selectedChar);

  players[2] = makePlayer(2, practiceBotChar);
  players[2].active = true;
  players[2].spectator = false;
  players[2].isBot = true;
  resetPlayerForMatch(players[2], 2, practiceBotChar);

  updateControlsVisibility();
  updateStatusByPhase();
}

openPracticeBtn.addEventListener("click", () => {
  if (!hasEnteredLobby) {
    myName = sanitizePlayerName(gateNameInput.value || myName, 0);
    localStorage.setItem("smash_player_name", myName);
    gateNameInput.value = myName;
    inlineNameInput.value = myName;
    hasEnteredLobby = true;
    nameGateOverlay.classList.add("hidden");
  }
  isPracticeMode = true;
  isRoomFullBlocked = false;
  entryBlockedByHost = false;
  isSpectator = false;
  clearChatMessages();
  if (ws) {
    try { ws.close(); } catch (_) {}
    ws = null;
  }
  resetPracticeMatchState();
});

practiceExitBtn.addEventListener("click", () => {
  clearCountdownTimer();
  isPracticeMode = false;
  isPracticeStopped = false;
  phase = "map_select";
  resetMatchEntities();
  updatePassphraseBadge();
  updateControlsVisibility();
  updateStatusByPhase();
  updateChatVisibility();
  connectWs();
});

practiceStopBtn.addEventListener("click", () => {
  if (!isPracticeMode) return;
  isPracticeStopped = true;
  Object.keys(keys).forEach(k => { keys[k] = false; });
  updateControlsVisibility();
  updateStatusByPhase();
});

practiceStartResumeBtn.addEventListener("click", () => {

    resetPracticeMatchState();
  } else {
    isPracticeStopped = false;
    updateControlsVisibility();

  }
});

practiceResetBtn.addEventListener("click", () => {

  resetPracticeMatchState();
});

practiceBotCharSelect.addEventListener("change", () => {

});

practiceBotLevelSelect.addEventListener("change", () => {
