    me.smashCharging = false; me.hasHit = false; me.enhanceLevel = 0; me.enhanceCooldownUntil = 0;
    resetHammerCritAndCharge(me);
    me.guardianHits = 0;
    if (clones[myRole]) { delete clones[myRole]; me.hasClone = false; sendCloneSync(null); }
    me.mp = MAX_MP;
    burnDebuffs = burnDebuffs.filter(b => b.targetRole !== myRole);
    if (me.stocks > 0) {
      const sp = getSpawnPoint(myRole);
      me.x = sp.x; me.y = sp.y; me.facing = sp.facing;
      me.invincibleTimer = RESPAWN_INVINCIBLE_FRAMES; // 復活時5秒無敵
    } else {
      me.invincibleTimer = 0;
    }
    sendMyState(me, true);
    checkMatchEndCondition();
    return;
  }

  sendMyState(me, false);
}

function updateProjectiles(dtScale) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const pr = projectiles[i];
    const prevX = pr.x;
    const prevY = pr.y;
    pr.x += pr.vx * dtScale;
    pr.y += pr.vy * dtScale;
    pr.life -= dtScale;

    const projBox = { x: pr.x, y: pr.y, w: 14, h: 14 };
    const hitObstacle = getAllStageObstacles().some(ob =>
      rectsOverlap(projBox, ob) ||
      segmentIntersectsRect(prevX + 7, prevY + 7, pr.x + 7, pr.y + 7, ob.x, ob.y, ob.w, ob.h)
    );
    if (hitObstacle) {
      projectiles.splice(i, 1);
      continue;
    }

    if (!isPublicLobbyRoom() && phase === "playing" && !entryBlockedByHost && !isRoomFullBlocked && !isSpectator && myRole !== 0 && pr.ownerRole === myRole) {
      for (const r of getParticipantRoles()) {
        if (r === myRole || isSameTeam(myRole, r)) continue;
        const target = players[r];
        if (!target || !target.active || target.stocks <= 0) continue;
        if (rectsOverlap(projBox, target) || segmentIntersectsRect(prevX + 7, prevY + 7, pr.x + 7, pr.y + 7, target.x, target.y, target.w, target.h)) {
          sendHitToTarget(target.role, pr.dmg, pr.basePower, pr.dir, null, 0.62, { wasLight: true });
          projectiles.splice(i, 1); break;
        }
      }
      if (!projectiles[i]) continue;
      if (checkHitEnemyClonesByBox(projBox, pr.dmg, pr.basePower, pr.dir, null, 0.62, null, null, null, false, { wasLight: true })) {
        projectiles.splice(i, 1); continue;
      }
    }
    if (pr.life <= 0 || pr.x < -60 || pr.x > canvas.width + 60) projectiles.splice(i, 1);
  }
}

function renderStocks(stocks, x, y, color) {
  for (let i = 0; i < MAX_STOCK; i++) {
    ctx.beginPath();
    ctx.arc(x + i * 18, y, 6.5, 0, Math.PI * 2);
    if (i < stocks) { ctx.fillStyle = color; ctx.fill(); }
    else { ctx.strokeStyle = "#64748b"; ctx.lineWidth = 2; ctx.stroke(); }
  }
}

function loop(now) {
  const dtScale = Math.min((now - lastFrameTime) / (1000 / 60), 2.5);
  lastFrameTime = now;

  const st = getCurrentStage();
  ctx.fillStyle = st.bgColor;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  updateMyPlayer(dtScale, now);
  updateMyClone(dtScale, now);
  updateBurnDebuffs(dtScale);
  updateBeams(dtScale);
  updateRings(dtScale);
  updateProjectiles(dtScale);

  for (const solid of st.solids) {
    ctx.fillStyle = st.groundColor;
    ctx.fillRect(solid.x, solid.y, solid.w, solid.h);
    ctx.strokeStyle = st.groundBorder;
    ctx.lineWidth = 2;
    ctx.strokeRect(solid.x, solid.y, solid.w, solid.h);
  }

  for (const plat of st.platforms) {
    ctx.fillStyle = st.platColor;
    ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = "#e2e8f0";
    ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
    ctx.setLineDash([]);
  }

  for (let r = 1; r <= MAX_BATTLE_PLAYERS; r++) {
    const p = players[r];
    if (!p.active || isRoleSpectating(r) || p.stocks <= 0) continue;
    const spec = CHAR_SPECS[p.charKey] || CHAR_SPECS.fighter;
    const pColor = getColorOfRole(r);
    const pName = getDisplayNameOfRole(r);
    const isInv = (p.invincibleTimer || 0) > 0;

    if (isInv) ctx.fillStyle = Math.floor(Date.now() / 60) % 2 === 0 ? "#fde047" : "#38bdf8";
    else if (p.frozen) ctx.fillStyle = "#7dd3fc";
    else if (p.burnedOut && Math.floor(Date.now() / 80) % 2 === 0) ctx.fillStyle = "#94a3b8";
    else ctx.fillStyle = pColor;
    ctx.fillRect(p.x, p.y, p.w, p.h);

    if (isInv) {
      ctx.strokeStyle = "#fef08a"; ctx.lineWidth = 3;
      ctx.strokeRect(p.x - 4, p.y - 4, p.w + 8, p.h + 8);
      ctx.font = "bold 11px sans-serif"; ctx.fillStyle = "#fef08a";
      ctx.fillText(`🛡️ 無敵 ${(p.invincibleTimer / 60).toFixed(1)}s`, p.x - 22, p.y - 24);
    } else if (p.charKey === "guardian") {
      ctx.font = "bold 11px sans-serif"; ctx.fillStyle = "#7dd3fc";
      ctx.fillText(`Lヒット ${p.guardianHits || 0}/${GUARDIAN_INVINCIBLE_HITS}`, p.x - 22, p.y - 24);
    }

    if (p.charKey === "summoner") {
      const remMs = Math.max(0, (p.summonCooldownUntil || 0) - now);
      const activeCl = clones[r];
      ctx.font = "bold 11px sans-serif";
      if (activeCl && activeCl.active) {
        const cName = (CHAR_SPECS[activeCl.charKey] || CHAR_SPECS.fighter).shortName;
        ctx.fillStyle = "#2dd4bf";
        ctx.fillText(`👥召喚中:${cName}(${Math.floor(activeCl.percent)}%)`, p.x - 32, p.y - 24);
      } else if (r === myRole && remMs > 0) {
        ctx.fillStyle = "#cbd5e1";
        ctx.fillText(`👥召喚CT ${(remMs / 1000).toFixed(1)}s`, p.x - 24, p.y - 24);
      } else {
        ctx.fillStyle = "#5eead4";
        ctx.fillText(`👥K召喚可`, p.x - 16, p.y - 24);
      }
    }

    if (p.frozen) {
      ctx.strokeStyle = "#bae6fd"; ctx.lineWidth = 2.5;
      ctx.strokeRect(p.x - 2, p.y - 2, p.w + 4, p.h + 4);
      ctx.font = "bold 11px sans-serif"; ctx.fillStyle = "#bae6fd";
      ctx.fillText("❄️ 凍結中", p.x - 14, p.y - 36);
    }

    if (p.charKey === "enhancer") {
      const lv = p.enhanceLevel || 0;
      if (lv > 0) {
        ctx.strokeStyle = "#34d399"; ctx.lineWidth = 1.5 + lv * 0.5;
        ctx.strokeRect(p.x - 3 - lv, p.y - 3 - lv, p.w + 6 + lv * 2, p.h + 6 + lv * 2);
      }
      const remMs = Math.max(0, (p.enhanceCooldownUntil || 0) - now);
      ctx.font = "bold 11px sans-serif";
      ctx.fillStyle = lv >= ENHANCE_MAX_LEVEL ? "#34d399" : (remMs > 0 ? "#cbd5e1" : "#fbbf24");
      ctx.fillText(lv >= ENHANCE_MAX_LEVEL ? `Lv.${lv} MAX` : (remMs > 0 ? `Lv.${lv} (CT ${(remMs / 1000).toFixed(1)}s)` : `Lv.${lv} (K強化可)`), p.x - 24, p.y - 24);
    }

    if (p.charKey === "elementalist") {
      const mInfo = MAGIC_INFO[p.magicMode] || MAGIC_INFO.fire;
      ctx.font = "bold 11px sans-serif"; ctx.fillStyle = mInfo.color;
      ctx.fillText(`[${mInfo.label}:${mInfo.cost}] MP:${Math.floor(p.mp ?? MAX_MP)}`, p.x - 26, p.y - 22);
    }

    if (p.charKey === "hammer") {
      const ch = p.hammerCharge || 0;
      const isCrit = isHammerCritState(p, now);
      const absMode = isHammerAbsoluteCritMode(p, now);
      const absRem = getHammerRemainingAbsSec(p, now);
      if (isCrit) {
        ctx.strokeStyle = absMode ? "#fef08a" : "#fb923c";
        ctx.lineWidth = absMode ? 3.5 : 2.5;
        ctx.strokeRect(p.x - 4, p.y - 4, p.w + 8, p.h + 8);
      }
      ctx.font = "bold 11px sans-serif";
      ctx.fillStyle = isCrit ? "#fde047" : "#fb923c";
      if (isCrit) {
        const label = absMode
          ? `⚡絶対会心 ${absRem.toFixed(1)}s (${ch})`
          : `🔥会心継続 L:${p.critLightHitsAfterExpiry || 0}/2 (${ch})`;
        ctx.fillText(label, p.x - 44, p.y - 22);
      } else {
        ctx.fillText(`🔨蓄積 ${ch}/${HAMMER_CRIT_THRESHOLD}`, p.x - 34, p.y - 22);
      }
    }

    if (p.smashCharging) {
      const charge = Math.min((Date.now() - p.smashChargeStart) / 1500, 1);
      const gaugeWidth = 60, gaugeHeight = 8;
      const gaugeX = p.x + p.w / 2 - gaugeWidth / 2, gaugeY = p.y - 34;
      ctx.fillStyle = "#222"; ctx.fillRect(gaugeX, gaugeY, gaugeWidth, gaugeHeight);
      ctx.fillStyle = charge >= 1 ? "#ff0000" : "#fbbf24"; ctx.fillRect(gaugeX, gaugeY, gaugeWidth * charge, gaugeHeight);
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1; ctx.strokeRect(gaugeX, gaugeY, gaugeWidth, gaugeHeight);
      if (charge >= 1) { ctx.font = "bold 12px sans-serif"; ctx.fillStyle = "#ff4444"; ctx.fillText("MAX!", gaugeX + 12, gaugeY - 5); }
    }

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(p.facing === 1 ? p.x + p.w - 10 : p.x + 4, p.y + 10, 6, 6);

    if (p.shielding && !p.burnedOut) {
      const ratio = Math.max(0.25, p.shieldHp / MAX_SHIELD);
      ctx.beginPath(); ctx.arc(p.x + p.w / 2, p.y + p.h / 2, 34 * ratio + 10, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(56, 189, 248, 0.35)"; ctx.fill();
      ctx.strokeStyle = "#7dd3fc"; ctx.lineWidth = 2.5; ctx.stroke();
      ctx.fillStyle = "#1e293b"; ctx.fillRect(p.x - 3, p.y + p.h + 5, 40, 5);
      ctx.fillStyle = ratio > 0.3 ? "#38bdf8" : "#f97316"; ctx.fillRect(p.x - 3, p.y + p.h + 5, 40 * (p.shieldHp / MAX_SHIELD), 5);
    }

    if (p.burnedOut) {
      ctx.font = "bold 12px sans-serif"; ctx.fillStyle = "#fbbf24";
      ctx.fillText("💫 BURNOUT!", p.x - 18, p.y - 22);
    }

    const teamTag = gameMode === "team2v2" ? `[${getTeamOfRole(r)}]` : "";
    ctx.font = "bold 12px sans-serif"; ctx.fillStyle = "#f8fafc";
    ctx.fillText(`${pName}${teamTag}(${spec.shortName})`, p.x - 20, p.y - 8);

    const hb = getMeleeHitbox(p, now);
    if (hb) {
      const isCritHit = p.charKey === "hammer" && hb.isSmash && isHammerCritState(p, now);
      ctx.fillStyle = isCritHit ? "rgba(253, 224, 71, 0.85)" : (hb.isSmash ? "rgba(251, 146, 60, 0.72)" : "rgba(254, 240, 138, 0.65)");
      ctx.fillRect(hb.x, hb.y, hb.w, hb.h);
      if (isCritHit) { ctx.strokeStyle = "#ef4444"; ctx.lineWidth = 3; ctx.strokeRect(hb.x, hb.y, hb.w, hb.h); }
    }
  }

  for (const ownerStr of Object.keys(clones)) {
    const ownerRole = Number(ownerStr);
    if (isRoleSpectating(ownerRole)) continue;
    const cl = clones[ownerRole];
    if (!cl || !cl.active) continue;
    const cSpec = CHAR_SPECS[cl.charKey] || CHAR_SPECS.fighter;
    const ownerName = getDisplayNameOfRole(ownerRole);
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = cSpec.color; ctx.fillRect(cl.x, cl.y, cl.w, cl.h);
    const clCrit = cl.charKey === "hammer" && isHammerCritState(cl, now);
    const clAbs = cl.charKey === "hammer" && isHammerAbsoluteCritMode(cl, now);
    ctx.strokeStyle = clCrit ? "#fde047" : "#2dd4bf"; ctx.lineWidth = clCrit ? 3 : 2; ctx.setLineDash([4, 3]);
    ctx.strokeRect(cl.x - 1, cl.y - 1, cl.w + 2, cl.h + 2); ctx.setLineDash([]);
    ctx.fillStyle = "#ffffff"; ctx.fillRect(cl.facing === 1 ? cl.x + cl.w - 9 : cl.x + 4, cl.y + 9, 5, 5);
    ctx.font = "bold 11px sans-serif"; ctx.fillStyle = clCrit ? "#fde047" : "#5eead4";
    const clExtra = cl.charKey === "hammer"
      ? (clCrit ? (clAbs ? ` 絶対会心${getHammerRemainingAbsSec(cl, now).toFixed(1)}s` : ` L:${cl.critLightHitsAfterExpiry || 0}/2`) : ` 蓄${cl.hammerCharge || 0}`)
      : "";
    ctx.fillText(`${ownerName}クローン(${cSpec.shortName}) ${Math.floor(cl.percent)}/100%${clExtra}`, cl.x - 40, cl.y - 8);
    if (cl.charKey !== "mage" && cl.atkTimer > 0) {
      ctx.fillStyle = "rgba(94, 234, 212, 0.65)";
      ctx.fillRect(cl.facing === 1 ? cl.x + cl.w - 2 : cl.x - 36, cl.y + 9, 38, 24);
    }
    ctx.restore();
  }

  for (const rg of ringEffects) {
    const alpha = Math.max(0.1, rg.life / rg.maxLife);
    const curRadius = rg.maxRadius * Math.min(1, (1 - Math.max(0, rg.life / rg.maxLife)) * 1.35);
    ctx.save();
    ctx.globalAlpha = alpha * 0.45;
    const grad = ctx.createRadialGradient(rg.cx, rg.cy, curRadius * 0.15, rg.cx, rg.cy, curRadius);
    grad.addColorStop(0, "rgba(254, 249, 195, 0.95)");
    grad.addColorStop(0.6, "rgba(251, 191, 36, 0.7)");
    grad.addColorStop(1, "rgba(249, 115, 22, 0.1)");
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(rg.cx, rg.cy, curRadius, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = "#fef08a"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(rg.cx, rg.cy, curRadius, 0, Math.PI * 2); ctx.stroke();
    ctx.font = "bold 14px sans-serif"; ctx.fillStyle = "#fef08a"; ctx.textAlign = "center";
    ctx.fillText(`💥 マダンテ (${rg.spentMp}MP / ${rg.dmg}%)`, rg.cx, rg.cy - curRadius - 8);
    ctx.restore();
  }

  for (const bm of beams) {
    const alpha = Math.max(0.15, bm.life / bm.maxLife);
    const info = MAGIC_INFO[bm.mode] || MAGIC_INFO.fire;
    const drawRect = bm.mode === "heal" ? bm : getClippedBeamRect(bm);
    if (drawRect.w <= 0 || drawRect.h <= 0) continue;

    ctx.save(); ctx.globalAlpha = alpha;
    if (bm.mode === "mage_laser") {
      ctx.fillStyle = "rgba(192, 132, 252, 0.78)"; ctx.fillRect(drawRect.x, drawRect.y, drawRect.w, drawRect.h);
      ctx.fillStyle = "rgba(240, 171, 252, 0.95)"; ctx.fillRect(drawRect.x, drawRect.y + 3, drawRect.w, drawRect.h - 6);
    } else if (bm.mode === "heal") {
      ctx.fillStyle = "rgba(74, 222, 128, 0.45)"; ctx.fillRect(drawRect.x, drawRect.y, drawRect.w, drawRect.h);
      ctx.strokeStyle = "#4ade80"; ctx.lineWidth = 2.5; ctx.strokeRect(drawRect.x, drawRect.y, drawRect.w, drawRect.h);
    } else {
      ctx.fillStyle = info.beamColor; ctx.fillRect(drawRect.x, drawRect.y, drawRect.w, drawRect.h);
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2; ctx.strokeRect(drawRect.x, drawRect.y, drawRect.w, drawRect.h);
    }
    ctx.restore();
  }

  projectiles.forEach(pr => {
    ctx.fillStyle = "#e879f9";
    ctx.beginPath(); ctx.arc(pr.x + 7, pr.y + 7, 8, 0, Math.PI * 2); ctx.fill();
  });

  if (isPublicLobbyRoom()) {
    ctx.fillStyle = "rgba(15, 23, 42, 0.74)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = "bold 32px sans-serif"; ctx.fillStyle = "#38bdf8"; ctx.textAlign = "center";
    ctx.fillText(`🏠 公開待機部屋（${activeRoles.length} / ${MAX_LOBBY_PLAYERS} 人入室中）`, canvas.width / 2, 175);
    ctx.font = "17px sans-serif"; ctx.fillStyle = "#cbd5e1";
    ctx.fillText("上の「🔑 合言葉」欄に同じ合言葉を入力して「合言葉入室」を押すと対戦部屋へ進めます", canvas.width / 2, 225);
    ctx.textAlign = "left";
  } else if (isRoomFullBlocked) {
    ctx.fillStyle = "rgba(15, 23, 42, 0.84)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = "bold 34px sans-serif"; ctx.fillStyle = "#f87171"; ctx.textAlign = "center";
    ctx.fillText(`🚫 満員（${MAX_BATTLE_PLAYERS}/${MAX_BATTLE_PLAYERS}人）のため入れません`, canvas.width / 2, 185);
    ctx.font = "17px sans-serif"; ctx.fillStyle = "#cbd5e1";
    ctx.fillText("別の合言葉を入力するか、「公開待機部屋」へ戻ってください", canvas.width / 2, 230);
    ctx.textAlign = "left";
  } else if (entryBlockedByHost) {
    ctx.fillStyle = "rgba(15, 23, 42, 0.78)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = "bold 30px sans-serif"; ctx.fillStyle = "#fbbf24"; ctx.textAlign = "center";
    ctx.fillText("🔒 ホストが入室するまで入れません", canvas.width / 2, 210);
    ctx.textAlign = "left";
  } else if (phase === "map_select") {
    ctx.fillStyle = "rgba(15, 23, 42, 0.68)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = "bold 32px sans-serif"; ctx.fillStyle = "#38bdf8"; ctx.textAlign = "center";
    ctx.fillText(`🗺️ ステップ1：ホストがマップを決定中（${st.name}）`, canvas.width / 2, 180);
    ctx.font = "17px sans-serif"; ctx.fillStyle = "#f8fafc";
    ctx.fillText(isHost() ? "マップを選んで「このマップでキャラ選択へ」を押してください" : "ホストがマップを決定するのを待っています...", canvas.width / 2, 225);
    ctx.textAlign = "left";
  } else if (phase === "char_select") {
    ctx.fillStyle = "rgba(15, 23, 42, 0.68)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = "bold 32px sans-serif"; ctx.fillStyle = "#4ade80"; ctx.textAlign = "center";
    const participants = getParticipantRoles();
    const doneCount = participants.filter(r => readyRoles.has(r)).length;
    ctx.fillText(`🎭 ステップ2：キャラ選択＆完了待ち（${doneCount} / ${participants.length} 人完了）`, canvas.width / 2, 165);
    ctx.font = "18px sans-serif"; ctx.fillStyle = "#f8fafc";
    const summary = participants.map(r => {
      const mark = readyRoles.has(r) ? "✅" : "⏳";
      return `${mark}${getDisplayNameOfRole(r)}:${CHAR_SPECS[players[r].charKey].shortName}`;
    }).join(" ／ ");
    ctx.fillText(summary || "参加待機中...", canvas.width / 2, 210);
    ctx.font = "16px sans-serif"; ctx.fillStyle = "#cbd5e1";
    ctx.fillText(`マップ：${st.name} ｜ 全員「✅ 完了にする」を押すと10秒カウントが始まります`, canvas.width / 2, 250);
    ctx.textAlign = "left";
  } else if (phase === "countdown") {
    ctx.fillStyle = "rgba(15, 23, 42, 0.68)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = "bold 40px sans-serif"; ctx.fillStyle = "#fbbf24"; ctx.textAlign = "center";
    ctx.fillText(`⏱️ 全員完了！ 開始まで ${countdownLeft} 秒`, canvas.width / 2, 185);
    ctx.font = "18px sans-serif"; ctx.fillStyle = "#f8fafc";
    ctx.fillText(`マップ：${st.name}`, canvas.width / 2, 230);
    ctx.textAlign = "left";
  } else if (phase === "gameover" && winnerInfo) {
    ctx.fillStyle = "rgba(15, 23, 42, 0.72)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = "bold 44px sans-serif"; ctx.textAlign = "center";
    if (winnerInfo.type === "team") {
      const isA = winnerInfo.winnerTeam === "A";
      ctx.fillStyle = isA ? "#38bdf8" : "#f97316";
      ctx.fillText(isA ? "Aチーム（1P・2P）WIN!" : "Bチーム（3P・4P）WIN!", canvas.width / 2, 190);
    } else {
      ctx.fillStyle = getColorOfRole(winnerInfo.winnerRole);
      ctx.fillText(`${getDisplayNameOfRole(winnerInfo.winnerRole)} WIN!`, canvas.width / 2, 190);
    }
    ctx.font = "17px sans-serif"; ctx.fillStyle = "#fbbf24";
    ctx.fillText(`${resultSecLeft} 秒後にマップ選択へ戻ります（観戦中の方も次から参加）...`, canvas.width / 2, 245);
    ctx.textAlign = "left";
  } else if (phase === "playing" && isSpectator) {
    ctx.font = "bold 16px sans-serif"; ctx.fillStyle = "#38bdf8"; ctx.textAlign = "center";
    ctx.fillText("👀 観戦中（試合終了後に自動で参加へ切り替わります）", canvas.width / 2, 85);
    ctx.textAlign = "left";
  }

  if (!isPublicLobbyRoom() && !isRoomFullBlocked) {
    const hudPositions = {
      1: { x: 35, y: 40 },
      2: { x: 295, y: 40 },
      3: { x: 565, y: 40 },
      4: { x: 825, y: 40 }
    };
    for (let r = 1; r <= MAX_BATTLE_PLAYERS; r++) {
      const p = players[r];
      if (!p.active || isRoleSpectating(r)) continue;
      const pos = hudPositions[r];
      const pColor = getColorOfRole(r);
      const pName = getDisplayNameOfRole(r);
      const teamLabel = gameMode === "team2v2" ? ` [${getTeamOfRole(r)}]` : "";
      ctx.font = "bold 18px sans-serif"; ctx.fillStyle = pColor;
      ctx.fillText(`${pName}${teamLabel}: ${p.percent}%`, pos.x, pos.y);
      renderStocks(p.stocks, pos.x + 6, pos.y + 20, pColor);
      if (p.charKey === "elementalist") {
        ctx.font = "bold 13px sans-serif"; ctx.fillStyle = "#f472b6";
        ctx.fillText(`MP: ${Math.floor(p.mp ?? MAX_MP)}/${MAX_MP}`, pos.x + 115, pos.y + 24);
      }
      if (p.charKey === "hammer") {
        const ch = p.hammerCharge || 0;
        const isCrit = isHammerCritState(p, now);
        const absMode = isHammerAbsoluteCritMode(p, now);
        ctx.font = "bold 13px sans-serif"; ctx.fillStyle = isCrit ? "#fde047" : "#fb923c";
        if (isCrit) {
          ctx.fillText(absMode ? `絶対会心 ${getHammerRemainingAbsSec(p, now).toFixed(1)}s` : `会心(L:${p.critLightHitsAfterExpiry || 0}/2)`, pos.x + 115, pos.y + 24);
        } else {
          ctx.fillText(`蓄積: ${ch}/${HAMMER_CRIT_THRESHOLD}`, pos.x + 115, pos.y + 24);
        }
      }
      if (p.charKey === "guardian") {
        ctx.font = "bold 13px sans-serif"; ctx.fillStyle = (p.invincibleTimer || 0) > 0 ? "#fde047" : "#7dd3fc";
        ctx.fillText((p.invincibleTimer || 0) > 0 ? `無敵: ${(p.invincibleTimer / 60).toFixed(1)}s` : `L無敵: ${p.guardianHits || 0}/5`, pos.x + 115, pos.y + 24);
      }
      if (p.charKey === "summoner") {
        const cl = clones[r];
        const remMs = Math.max(0, (p.summonCooldownUntil || 0) - now);
        ctx.font = "bold 13px sans-serif"; ctx.fillStyle = cl && cl.active ? "#2dd4bf" : "#94a3b8";
        ctx.fillText(cl && cl.active ? `召喚: ${Math.floor(cl.percent)}%` : (r === myRole && remMs > 0 ? `CT: ${(remMs / 1000).toFixed(0)}s` : `召喚: 待機`), pos.x + 115, pos.y + 24);
      }
    }
  }

  requestAnimationFrame(loop);
}

initDropdownOptions();
initColorPaletteDOM();
renderChatLogDOM();
updateLoopUI();
updatePassphraseUI();
updateRoomStatusBox();
if (myName) {
  hasEnteredLobby = true;
  nameGateOverlay.classList.add("hidden");
  updateChatVisibility();
  connectToPassphrase(currentPassphrase, false);
} else {
  hasEnteredLobby = false;
  nameGateOverlay.classList.remove("hidden");
  updateChatVisibility();
  statusEl.textContent = "名前を入力してロビーへ入ってください";
  setTimeout(() => gateNameInput.focus(), 50);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
