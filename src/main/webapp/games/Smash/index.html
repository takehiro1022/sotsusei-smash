  if (isPracticeMode) {
    if (players[2]) {
      players[2].name = `CPU (Lv.${practiceBotLevel})`;
    }
    updateRoomStatusBox();
    updateStatusByPhase();
  }
});

function sendRoomSync(overridePhase = null) {
  if (isPracticeMode || isPublicLobbyRoom()) return;
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const targetPhase = overridePhase || phase;
  const charMap = {};
  for (const r of activeRoles) {
    if (isRoleSpectating(r)) continue;
    charMap[r] = (r === myRole) ? selectedChar : ((players[r] && players[r].charKey) || selectedChar);
  }
  ws.send(JSON.stringify({
    type: "room_sync",
    phase: targetPhase,
    stage: currentStageKey,
    mode: gameMode,
    activeRoles,
    spectatorRoles: Array.from(spectatorRoles),
    readyRoles: Array.from(readyRoles),
    chars: charMap
  }));
}

stageSelectEl.addEventListener("change", () => {
  currentStageKey = stageSelectEl.value;
  initStageGimmicks(getCurrentStage(), true);
  updateRoomStatusBox();
  updateStatusByPhase();
  if (isPracticeMode) {
    resetPracticeMatchState();
    return;
  }
  if (amIHost()) {
    sendRoomSync("map_select");
  }
});

modeSelectEl.addEventListener("change", () => {
  gameMode = modeSelectEl.value === "team2v2" ? "team2v2" : "ffa";
  updateRoomStatusBox();
  updateStatusByPhase();
  if (isPracticeMode) {
    resetPracticeMatchState();
    return;
  }
  if (amIHost()) {
    sendRoomSync("map_select");
  }
});

confirmMapBtn.addEventListener("click", () => {
  if (isPracticeMode) {
    currentStageKey = stageSelectEl.value;
    gameMode = modeSelectEl.value === "team2v2" ? "team2v2" : "ffa";
    initStageGimmicks(getCurrentStage(), true);
    charSelectDropdown.focus();
    updateStatusByPhase();
    return;
  }
  if (!amIHost()) return;
  currentStageKey = stageSelectEl.value;
  gameMode = modeSelectEl.value === "team2v2" ? "team2v2" : "ffa";
  enterCharSelectPhase(currentStageKey, gameMode);
  sendRoomSync("char_select");
});

resetGhostBtn.addEventListener("click", () => {
  if (isPracticeMode || isPublicLobbyRoom() || !amIHost()) return;
  const keepRoles = [];
  if (myRole !== 0) keepRoles.push(myRole);
  for (const r of activeRoles) {
    if (r === myRole) continue;
    if (seenPeerRoles.has(r) && !keepRoles.includes(r)) {
      keepRoles.push(r);
    }
  }
  keepRoles.sort((a, b) => a - b);
  activeRoles = keepRoles.length > 0 ? keepRoles : (myRole !== 0 ? [myRole] : []);
  ghostFilterActive = true;

  for (let r = 1; r <= MAX_BATTLE_PLAYERS; r++) {
    if (!activeRoles.includes(r) && players[r]) {
      players[r].active = false;
    }
  }
  readyRoles = new Set(Array.from(readyRoles).filter(r => activeRoles.includes(r)));
  spectatorRoles = new Set(Array.from(spectatorRoles).filter(r => activeRoles.includes(r)));

  updateRoomStatusBox();
  updateControlsVisibility();
  updateStatusByPhase();
  sendRoomSync(phase);
});

charSelectDropdown.addEventListener("change", () => {
  if (!isPracticeMode && myRole !== 0 && readyRoles.has(myRole)) return;
  selectedChar = charSelectDropdown.value;
  const idx = CHAR_ORDER.indexOf(selectedChar);
  if (idx >= 0) selectedIdx = idx;
  charDescInline.textContent = `(${CHAR_SPECS[selectedChar].desc})`;
  if (myRole !== 0) {
    if (!players[myRole]) players[myRole] = makePlayer(myRole, selectedChar);
    players[myRole].charKey = selectedChar;
  }
  if (isPracticeMode) {
    resetPracticeMatchState();
    return;
  }
  updateControlsVisibility();
  if (ws && ws.readyState === WebSocket.OPEN && myRole !== 0) {
    ws.send(JSON.stringify({
      type: "char_select",
      role: myRole,
      charKey: selectedChar
    }));
  }
});

readyToggleBtn.addEventListener("click", () => {
  if (isPracticeMode) {
    resetPracticeMatchState();
    return;
  }
  if (isSpectator || myRole === 0 || phase !== "char_select") return;
  if (readyRoles.has(myRole)) {
    readyRoles.delete(myRole);
  } else {
    readyRoles.add(myRole);
  }
  updateReadySummary();
  updateControlsVisibility();
  updateStatusByPhase();

  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      type: "ready_state",
      role: myRole,
      ready: readyRoles.has(myRole),
      charKey: selectedChar
    }));
  }

  const participants = getParticipantRoles();
  if (amIHost() && participants.length >= 2 && participants.every(r => readyRoles.has(r))) {
    startCountdownPhase();
    sendRoomSync("countdown");
  }
});

backToMapBtn.addEventListener("click", () => {
  if (isPracticeMode) {
    stageSelectEl.focus();
    return;
  }
  if (myRole !== 0 && readyRoles.has(myRole)) return;
  clearCountdownTimer();
  phase = "map_select";
  readyRoles = new Set();
  updateControlsVisibility();
  updateStatusByPhase();
  if (amIHost()) {
    sendRoomSync("map_select");
  }
});

function connectWs() {
  if (isPracticeMode || !hasEnteredLobby) return;
  if (ws) {
    try { ws.close(); } catch (_) {}
    ws = null;
  }
  clearCountdownTimer();
  phase = "map_select";
  isRoomFullBlocked = false;
  entryBlockedByHost = false;
  isSpectator = false;
  spectatorRoles = new Set();
  readyRoles = new Set();
  seenPeerRoles = new Set();
  ghostFilterActive = false;
  myRole = 0;
  activeRoles = [];
  ensureNonConflictingColor();
  updatePassphraseBadge();
  updateRoomStatusBox();
  updateControlsVisibility();
  updateStatusByPhase();
  updateChatVisibility();

  const roomParam = currentPassphrase ? `?room=${encodeURIComponent(currentPassphrase)}` : "";
  const socket = new WebSocket(`${wsProto}${location.host}${ctxPath}/smash-ws${roomParam}`);
  ws = socket;

  socket.onopen = () => {
    if (ws !== socket) return;
    socket.send(JSON.stringify({
      type: "hello",
      name: sanitizePlayerName(myName, 0),
      color: sanitizeColorHex(myPreferredColor, 1),
      room: currentPassphrase
    }));
  };

  socket.onmessage = ev => {
    if (ws !== socket) return;
    let msg;
    try {
      msg = JSON.parse(ev.data);
    } catch (_) {
      return;
    }
    if (!msg || !msg.type) return;

    if (msg.type === "chat") {
      pushChatMessage(msg);
      return;
    }

    if (msg.type === "room_full") {
      isRoomFullBlocked = true;
      entryBlockedByHost = false;
      isSpectator = false;
      myRole = 0;
      activeRoles = [];
      updateRoomStatusBox();
      updateControlsVisibility();
      updateStatusByPhase();
      updateChatVisibility();
      return;
    }

    if (msg.type === "entry_denied") {
      entryBlockedByHost = true;
      isRoomFullBlocked = false;
      isSpectator = false;
      myRole = 0;
      activeRoles = [];
      updateRoomStatusBox();
      updateControlsVisibility();
      updateStatusByPhase();
      updateChatVisibility();
      return;
    }

    if (msg.type === "welcome") {
      isRoomFullBlocked = false;
      entryBlockedByHost = false;
      myRole = Number(msg.role) || 0;
      isSpectator = !!msg.spectator;
      if (typeof msg.room === "string") {
        const serverRoom = sanitizePassphrase(msg.room);
        if (serverRoom !== currentPassphrase) {
          currentPassphrase = serverRoom;
          passphraseInputEl.value = currentPassphrase;
          syncUrlWithPassphrase(currentPassphrase);
          updatePassphraseBadge();
        }
      }
      if (myRole !== 0 && !players[myRole]) {
        players[myRole] = makePlayer(myRole, selectedChar);
      }
      if (myRole !== 0 && players[myRole]) {
        players[myRole].name = myName;
        players[myRole].spectator = isSpectator;
      }

      if (Array.isArray(msg.activeRoles)) {
        const incoming = msg.activeRoles.map(Number).filter(r => r >= 1 && r <= getRoomCapacity());
        activeRoles = Array.from(new Set(incoming)).sort((a, b) => a - b);
        if (fixedHostThisPc && myRole !== 0 && !activeRoles.includes(myRole)) {
          activeRoles.push(myRole);
          activeRoles.sort((a, b) => a - b);
        }
      } else if (myRole !== 0) {
        activeRoles = [myRole];
      }

      if (Array.isArray(msg.spectatorRoles)) {
        spectatorRoles = new Set(msg.spectatorRoles.map(Number).filter(r => r >= 1));
      }
      if (isSpectator && myRole !== 0) {
        spectatorRoles.add(myRole);
      }

      if (msg.profiles && typeof msg.profiles === "object") {
        Object.keys(msg.profiles).forEach(k => {
          const r = Number(k);
          const prof = msg.profiles[k];
          if (r >= 1 && r <= MAX_BATTLE_PLAYERS && prof) {
            if (!players[r]) players[r] = makePlayer(r, selectedChar);
            if (prof.name) players[r].name = sanitizePlayerName(prof.name, r);
            if (prof.color) players[r].color = sanitizeColorHex(prof.color, r);
            if (typeof prof.spectator === "boolean") {
              players[r].spectator = prof.spectator;
              if (prof.spectator) spectatorRoles.add(r);
              else spectatorRoles.delete(r);
            }
          }
        });
      }

      ensureNonConflictingColor();
      if (myRole !== 0 && players[myRole]) {
        players[myRole].name = myName;
        players[myRole].color = myColor;
        players[myRole].spectator = isSpectator;
      }

      if (msg.stage && STAGES[msg.stage]) {
        currentStageKey = msg.stage;
        stageSelectEl.value = currentStageKey;
        initStageGimmicks(getCurrentStage(), true);
      }
      if (msg.mode === "team2v2" || msg.mode === "ffa") {
        gameMode = msg.mode;
        modeSelectEl.value = gameMode;
      }

      updateRoomStatusBox();
      updateControlsVisibility();
      updateStatusByPhase();
      updateChatVisibility();
      sendProfileSync();
      if (fixedHostThisPc && myRole !== 0) {
        sendRoomSync(phase);
      }
      return;
    }

    if (msg.type === "roster") {
      if (isRoomFullBlocked || entryBlockedByHost) return;
      const prevSet = new Set(activeRoles);
      if (Array.isArray(msg.activeRoles)) {
        const incoming = msg.activeRoles.map(Number).filter(r => r >= 1 && r <= getRoomCapacity());
        if (ghostFilterActive && myRole !== 0) {
          activeRoles = incoming.filter(r => r === myRole || seenPeerRoles.has(r));
          if (!activeRoles.includes(myRole)) activeRoles.push(myRole);
        } else {
          activeRoles = incoming;
        }
        activeRoles = Array.from(new Set(activeRoles)).sort((a, b) => a - b);
        if (fixedHostThisPc && myRole !== 0 && !activeRoles.includes(myRole)) {
          activeRoles.push(myRole);
          activeRoles.sort((a, b) => a - b);
        }
      }

      if (Array.isArray(msg.spectatorRoles)) {
        spectatorRoles = new Set(msg.spectatorRoles.map(Number).filter(r => activeRoles.includes(r)));
      }
      if (isSpectator && myRole !== 0) {
        spectatorRoles.add(myRole);
      }

      if (msg.profiles && typeof msg.profiles === "object") {
        Object.keys(msg.profiles).forEach(k => {
          const r = Number(k);
          const prof = msg.profiles[k];
          if (r >= 1 && r <= MAX_BATTLE_PLAYERS && prof) {
            if (!players[r]) players[r] = makePlayer(r, selectedChar);
            if (prof.name) players[r].name = sanitizePlayerName(prof.name, r);
            if (prof.color) players[r].color = sanitizeColorHex(prof.color, r);
            if (typeof prof.spectator === "boolean") {
              players[r].spectator = prof.spectator;
              if (prof.spectator) spectatorRoles.add(r);
              else spectatorRoles.delete(r);
            }
          }
        });
      }

      for (const r of activeRoles) {
        if (!players[r]) players[r] = makePlayer(r, selectedChar);
        players[r].active = true;
        players[r].spectator = isRoleSpectating(r);
        if (r === myRole) {
          players[r].name = myName;
          players[r].color = myColor;
          players[r].spectator = isSpectator;
        }
      }
      for (let r = 1; r <= MAX_BATTLE_PLAYERS; r++) {
        if (!activeRoles.includes(r) && players[r]) {
          players[r].active = false;
          readyRoles.delete(r);
          spectatorRoles.delete(r);
        }
      }

      ensureNonConflictingColor();

      const someoneLeft = Array.from(prevSet).some(r => !activeRoles.includes(r));
      if (someoneLeft && (phase === "countdown" || phase === "playing")) {
        clearCountdownTimer();
        phase = "char_select";
        readyRoles = new Set();
        resetMatchEntities();
      }

      updateRoomStatusBox();
      updateControlsVisibility();
      updateStatusByPhase();
      updateChatVisibility();
      sendProfileSync();

      if (amIHost()) {
        sendRoomSync(phase);
      }
      return;
    }

    if (msg.type === "profile") {
      const r = Number(msg.role);
      if (r >= 1 && r <= MAX_BATTLE_PLAYERS && r !== myRole) {
        seenPeerRoles.add(r);
        if (!players[r]) players[r] = makePlayer(r, selectedChar);
        if (msg.name) players[r].name = sanitizePlayerName(msg.name, r);
        if (msg.color) players[r].color = sanitizeColorHex(msg.color, r);
        if (typeof msg.spectator === "boolean") {
          players[r].spectator = msg.spectator;
          if (msg.spectator) spectatorRoles.add(r);
          else spectatorRoles.delete(r);
        }
        ensureNonConflictingColor();
        updateRoomStatusBox();
        updateControlsVisibility();
        updateStatusByPhase();
      }
      return;
    }

    if (msg.type === "room_sync") {
      if (msg.stage && STAGES[msg.stage]) {
        currentStageKey = msg.stage;
        stageSelectEl.value = currentStageKey;
        initStageGimmicks(getCurrentStage(), false);
      }
      if (msg.mode === "team2v2" || msg.mode === "ffa") {
        gameMode = msg.mode;
        modeSelectEl.value = gameMode;
      }
      if (Array.isArray(msg.activeRoles)) {
        const incoming = msg.activeRoles.map(Number).filter(r => r >= 1 && r <= getRoomCapacity());
        if (ghostFilterActive && myRole !== 0) {
          activeRoles = incoming.filter(r => r === myRole || seenPeerRoles.has(r));
          if (!activeRoles.includes(myRole)) activeRoles.push(myRole);
        } else {
          activeRoles = incoming;
        }
        activeRoles = Array.from(new Set(activeRoles)).sort((a, b) => a - b);
        if (fixedHostThisPc && myRole !== 0 && !activeRoles.includes(myRole)) {
          activeRoles.push(myRole);
          activeRoles.sort((a, b) => a - b);
        }
      }
      if (Array.isArray(msg.spectatorRoles)) {
        spectatorRoles = new Set(msg.spectatorRoles.map(Number).filter(r => activeRoles.includes(r)));
      }
      if (isSpectator && myRole !== 0) {
        spectatorRoles.add(myRole);
      }
      if (msg.chars && typeof msg.chars === "object") {
        Object.keys(msg.chars).forEach(k => {
          const r = Number(k);
          const cKey = msg.chars[k];
          if (r >= 1 && r <= MAX_BATTLE_PLAYERS && CHAR_SPECS[cKey]) {
            if (!players[r]) players[r] = makePlayer(r, cKey);
            players[r].charKey = cKey;
            if (r === myRole) {
              selectedChar = cKey;
              charSelectDropdown.value = cKey;
              charDescInline.textContent = `(${CHAR_SPECS[cKey].desc})`;
            }
          }
        });
      }
      if (Array.isArray(msg.readyRoles)) {
        readyRoles = new Set(msg.readyRoles.map(Number).filter(r => activeRoles.includes(r) && !isRoleSpectating(r)));
      } else {
        readyRoles = new Set();
      }

      const nextPhase = msg.phase || "map_select";
      if (nextPhase === "map_select") {
        clearCountdownTimer();
        phase = "map_select";
        readyRoles = new Set();
        updateControlsVisibility();
        updateStatusByPhase();
      } else if (nextPhase === "char_select") {
        clearCountdownTimer();
        phase = "char_select";
        updateControlsVisibility();
        updateStatusByPhase();
      } else if (nextPhase === "countdown") {
        if (phase !== "countdown" && phase !== "playing") {
          startCountdownPhase();
        }
      } else if (nextPhase === "playing") {
        if (phase !== "playing") {
          clearCountdownTimer();
          phase = "playing";
          matchStartedAt = performance.now();
          updateControlsVisibility();
          updateStatusByPhase();
        }
      }
      updateRoomStatusBox();
      return;
    }

    if (msg.type === "char_select") {
      const r = Number(msg.role);
      const cKey = msg.charKey;
      if (r >= 1 && r <= MAX_BATTLE_PLAYERS && CHAR_SPECS[cKey]) {
        if (!players[r]) players[r] = makePlayer(r, cKey);
        players[r].charKey = cKey;
        updateControlsVisibility();
      }
      return;
    }

    if (msg.type === "ready_state") {
      const r = Number(msg.role);
      if (r >= 1 && r <= MAX_BATTLE_PLAYERS) {
        if (msg.charKey && CHAR_SPECS[msg.charKey]) {
          if (!players[r]) players[r] = makePlayer(r, msg.charKey);
          players[r].charKey = msg.charKey;
        }
        if (msg.ready) readyRoles.add(r);
        else readyRoles.delete(r);
        updateReadySummary();
        updateControlsVisibility();
        updateStatusByPhase();

        const participants = getParticipantRoles();
        if (amIHost() && phase === "char_select" && participants.length >= 2 && participants.every(pr => readyRoles.has(pr))) {
          startCountdownPhase();
          sendRoomSync("countdown");
        }
      }
      return;
    }

    if (msg.type === "state") {
      const r = Number(msg.role);
      if (!r || r === myRole || r < 1 || r > MAX_BATTLE_PLAYERS) return;
      seenPeerRoles.add(r);
      if (!activeRoles.includes(r) && !ghostFilterActive) {
        activeRoles.push(r);
        activeRoles.sort((a, b) => a - b);
        updateRoomStatusBox();
      }
      if (!players[r]) players[r] = makePlayer(r, msg.charKey || selectedChar);
      const p = players[r];
      p.active = true;
      p.spectator = !!msg.spectator || spectatorRoles.has(r);
      if (p.spectator) spectatorRoles.add(r);
      if (msg.name) p.name = sanitizePlayerName(msg.name, r);
      if (msg.color) p.color = sanitizeColorHex(msg.color, r);
      if (msg.charKey && CHAR_SPECS[msg.charKey]) p.charKey = msg.charKey;
      p.x = Number(msg.x) || p.x;
      p.y = Number(msg.y) || p.y;
      p.vx = Number(msg.vx) || 0;
      p.vy = Number(msg.vy) || 0;
      p.facing = Number(msg.facing) || 1;
      p.percent = Number(msg.percent) || 0;
      p.stocks = typeof msg.stocks === "number" ? msg.stocks : p.stocks;
      p.atkType = msg.atkType || null;
      p.atkTimer = Number(msg.atkTimer) || 0;
      p.smashCharging = !!msg.smashCharging;
      p.smashChargeRatio = Number(msg.smashChargeRatio) || 0;
      p.enhanceLevel = Number(msg.enhanceLevel) || 0;
      p.hammerCharge = Number(msg.hammerCharge) || 0;
      p.critReady = !!msg.critReady;
      p.critActive = !!msg.critActive;
      p.critStartedAt = Number(msg.critStartedAt) || 0;
      p.critLightHitsAfterExpiry = Number(msg.critLightHitsAfterExpiry) || 0;
      p.guardianHits = Number(msg.guardianHits) || 0;
      p.invincibleTimer = Number(msg.invincibleTimer) || 0;
      p.hasClone = !!msg.hasClone;
      p.mp = typeof msg.mp === "number" ? msg.mp : p.mp;
      if (msg.magicMode && MAGIC_INFO[msg.magicMode]) p.magicMode = msg.magicMode;
      p.frozen = !!msg.frozen;
      p.stun = Number(msg.stun) || 0;
      p.shielding = !!msg.shielding;
      p.shieldHp = typeof msg.shieldHp === "number" ? msg.shieldHp : p.shieldHp;
      p.burnedOut = !!msg.burnedOut;
      ensureHammerCritState(p);
      return;
    }

    if (msg.type === "effect") {
      if (Number(msg.senderRole) === myRole) return;
      if (msg.kind === "proj" && msg.proj) {
        projectiles.push(msg.proj);
      } else if (msg.kind === "beam" && msg.beam) {
        beams.push(msg.beam);
      } else if (msg.kind === "ring" && msg.ring) {
        ringEffects.push(msg.ring);
      } else if (msg.kind === "clone" && msg.clone) {
        clones[msg.clone.ownerRole] = msg.clone;
      } else if (msg.kind === "clone_remove") {
        delete clones[Number(msg.ownerRole)];
      } else if (msg.kind === "hit_apply") {
        const targetRole = Number(msg.targetRole);
        if (targetRole === myRole && !isSpectator && players[myRole]) {
          applyHitToLocalPlayer(players[myRole], msg.hit || {}, Number(msg.attackerRole) || 0);
        }
      }
      return;
    }

    if (msg.type === "game_over") {
      if (phase === "playing" || phase === "countdown") {
        enterGameOverPhase({ text: msg.winner || "決着！" });
      }
    }
  };

  socket.onclose = () => {
    if (ws !== socket) return;
    ws = null;
    if (!isPracticeMode && hasEnteredLobby && !isRoomFullBlocked && !entryBlockedByHost) {
      statusEl.textContent = "切断されました。再接続します...";
      setTimeout(() => {
        if (!isPracticeMode && hasEnteredLobby && !ws) connectWs();
      }, 1500);
    }
  };
}

const keys = {};
let prevJumpPressed = false;
let prevDropPressed = false;
let prevLightPressed = false;
let prevSmashPressed = false;
let prevMagicSwitchPressed = false;

window.addEventListener("keydown", e => {
  const activeTag = document.activeElement && document.activeElement.tagName;
  if (activeTag === "INPUT" || activeTag === "TEXTAREA" || activeTag === "SELECT") {
    return;
  }
  if (!hasEnteredLobby) return;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
    e.preventDefault();
  }
  keys[e.code] = true;
});

window.addEventListener("keyup", e => {
  keys[e.code] = false;
});

function getEffectiveSpec(p) {
  const base = CHAR_SPECS[p.charKey] || CHAR_SPECS.fighter;
  if (p.charKey === "enhancer") {
    const lv = Math.max(0, Math.min(ENHANCE_MAX_LEVEL, p.enhanceLevel || 0));
    return {
      ...base,
      moveAcc: base.moveAcc * (1 + lv * 0.08),
      weight: base.weight * (1 + lv * 0.07),
      lightDmg: base.lightDmg + lv * 2,
      smashDmg: base.smashDmg + lv * 3
    };
  }
  return base;
}

function getSmashChargeMultiplier(p) {
  if (!p.smashCharging) return 1.0;
  const r = Math.max(0, Math.min(1, p.smashChargeRatio || 0));
  return 1.0 + r * 0.85;
}

function spawnCloneForOwner(owner) {
  const now = performance.now();
  if (owner.hasClone || clones[owner.role]) return false;
  if (now < (owner.summonCooldownUntil || 0)) return false;

  const candidate = SUMMON_CANDIDATES[Math.floor(Math.random() * SUMMON_CANDIDATES.length)];
  const spec = CHAR_SPECS[candidate] || CHAR_SPECS.fighter;
  const offsetX = owner.facing === 1 ? -46 : 46;
  const cloneObj = {
    id: `clone_${owner.role}_${now}`,
    ownerRole: owner.role,
    ownerName: owner.name || getDisplayNameOfRole(owner.role),
    color: owner.color || getColorOfRole(owner.role),
    charKey: candidate,
    charShort: spec.shortName,
    x: Math.max(40, Math.min(canvas.width - 74, owner.x + offsetX)),
    y: owner.y,
    w: 32,
    h: 42,
    vx: 0,
    vy: 0,
    facing: owner.facing,
    jumps: 2,
    percent: 0,
    maxPercent: SUMMON_CLONE_MAX_PERCENT,
    atkType: null,
    atkTimer: 0,
    cooldown: 16,
    hasHit: false,
    aiTimer: 0
  };
  clones[owner.role] = cloneObj;
  owner.hasClone = true;
  owner.summonCooldownUntil = now + SUMMON_COOLDOWN_MS;

  ringEffects.push({
    x: cloneObj.x + cloneObj.w * 0.5,
    y: cloneObj.y + cloneObj.h * 0.5,
    r: 8,
    maxR: 54,
    alpha: 0.9,
    color: owner.color || "#2dd4bf"
  });

  if (!isPracticeMode && ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      type: "effect",
      kind: "clone",
      senderRole: owner.role,
      clone: cloneObj
    }));
  }
  return true;
}

function removeClone(ownerRole, byKo = false) {
  const c = clones[ownerRole];
  if (c && byKo) {
    ringEffects.push({
      x: c.x + c.w * 0.5,
      y: c.y + c.h * 0.5,
      r: 10,
      maxR: 65,
      alpha: 0.95,
      color: "#f87171"
    });
  }
  delete clones[ownerRole];
  if (players[ownerRole]) {
    players[ownerRole].hasClone = false;
  }
  if (!isPracticeMode && ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({
      type: "effect",
      kind: "clone_remove",
      senderRole: ownerRole,
      ownerRole
    }));
  }
}

function cycleElementMagicMode(me) {
  if (!me || me.charKey !== "elementalist") return;
  const idx = MAGIC_MODES.indexOf(me.magicMode);
  const nextIdx = (idx + 1) % MAGIC_MODES.length;
  me.magicMode = MAGIC_MODES[nextIdx];
  const info = MAGIC_INFO[me.magicMode];
  ringEffects.push({
    x: me.x + me.w * 0.5,
    y: me.y + me.h * 0.5,
    r: 8,
    maxR: 44,
    alpha: 0.85,
    color: info.color
  });
}

function castSelectedElementMagic(me) {
  const mode = me.magicMode || "fire";
  const info = MAGIC_INFO[mode] || MAGIC_INFO.fire;
  const cost = mode === "magic" ? me.mp : info.cost;

  if (mode === "magic") {
    if (me.mp < info.minCost) return false;
  } else {
    if (me.mp < cost) return false;
  }

  const cx = me.x + me.w * 0.5;
  const cy = me.y + me.h * 0.5;

  if (mode === "fire") {
    me.mp = Math.max(0, me.mp - cost);
    const proj = {
      id: `${me.role}_${performance.now()}_${Math.random()}`,
      ownerRole: me.role,
      x: me.facing === 1 ? me.x + me.w + 4 : me.x - 28,
      y: me.y + 10,
      w: 24,
      h: 24,
      vx: me.facing * 10.5,
      vy: 0,
      dmg: 14,
      kbX: me.facing * 10.0,
      kbY: -7.5,
      color: "#f97316",
      magicElement: "fire",
      life: 62,
      pierceWalls: false
    };
    projectiles.push(proj);
    if (!isPracticeMode && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "effect", kind: "proj", senderRole: me.role, proj }));
    }
    return true;
  }

  if (mode === "ice") {
    me.mp = Math.max(0, me.mp - cost);
    const proj = {
      id: `${me.role}_${performance.now()}_${Math.random()}`,
      ownerRole: me.role,
      x: me.facing === 1 ? me.x + me.w + 4 : me.x - 26,
      y: me.y + 12,
      w: 22,
      h: 20,
      vx: me.facing * 11.5,
      vy: 0,
      dmg: 8,
      kbX: me.facing * 5.5,
      kbY: -4.5,
      color: "#38bdf8",
      magicElement: "ice",
      life: 58,
      pierceWalls: false
    };
    projectiles.push(proj);
    if (!isPracticeMode && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "effect", kind: "proj", senderRole: me.role, proj }));
    }
    return true;
  }

  if (mode === "heal") {
    me.mp = Math.max(0, me.mp - cost);
    me.percent = Math.max(0, me.percent - 80);
    ringEffects.push({
      x: cx,
      y: cy,
      r: 10,
      maxR: 72,
      alpha: 0.9,
      color: "#4ade80"
    });
    return true;
  }

  if (mode === "magic") {
    const spentMp = me.mp;
    me.mp = 0;
    const powerScale = Math.max(0.4, spentMp / MAX_MP);
    const radius = Math.round(130 + powerScale * 130);
    const dmg = Math.round(18 + powerScale * 30);
    const ring = {
      x: cx,
      y: cy,
      r: 18,
      maxR: radius,
      alpha: 0.95,
      color: "#fde047"
    };
    ringEffects.push(ring);
    if (!isPracticeMode && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "effect", kind: "ring", senderRole: me.role, ring }));
    }

    for (const r of getParticipantRoles()) {
      if (r === me.role || isSameTeam(me.role, r)) continue;
      const target = players[r];
      if (!target || target.stocks <= 0) continue;
      const tcx = target.x + target.w * 0.5;
      const tcy = target.y + target.h * 0.5;
      const dx = tcx - cx;
      const dy = tcy - cy;
      const dist = Math.hypot(dx, dy);
      if (dist <= radius) {
        const dirX = dist > 1 ? dx / dist : me.facing;
        const kbX = dirX * (13 + powerScale * 11);
        const kbY = -11 - powerScale * 7;
        const hitPayload = {
          dmg,
          kbX,
          kbY,
          stun: 22,
          isSmash: true,
          isLight: false,
          magicElement: "magic"
        };
        if (isPracticeMode && target.isBot) {
          applyHitToLocalPlayer(target, hitPayload, me.role);
        } else if (!isPracticeMode && ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({
            type: "effect",
            kind: "hit_apply",
            senderRole: me.role,
            attackerRole: me.role,
            targetRole: r,
            hit: hitPayload
          }));
        }
      }
    }

    Object.keys(clones).forEach(ownerKey => {
      const c = clones[ownerKey];
      if (!c || Number(ownerKey) === me.role || isSameTeam(me.role, Number(ownerKey))) return;
      const ccx = c.x + c.w * 0.5;
      const ccy = c.y + c.h * 0.5;
      if (Math.hypot(ccx - cx, ccy - cy) <= radius) {
        c.percent += dmg * 1.5;
        if (c.percent >= (c.maxPercent || SUMMON_CLONE_MAX_PERCENT)) {
          removeClone(Number(ownerKey), true);
        }
      }
    });
    return true;
  }

  return false;
}

function triggerLightAttack(me) {
  const spec = getEffectiveSpec(me);
  me.cooldown = spec.lightCooldown;

  if (me.charKey === "mage") {
    me.atkType = "light";
    me.atkTimer = 10;
    me.hasHit = false;
    const beamW = 250;
    const beam = {
      id: `${me.role}_${performance.now()}_${Math.random()}`,
      ownerRole: me.role,
      x: me.facing === 1 ? me.x + me.w : me.x - beamW,
      y: me.y + 12,
      w: beamW,
      h: 18,
      dir: me.facing,
      dmg: spec.lightDmg,
      kbX: me.facing * 6.5,
      kbY: -4.5,
      color: "#c084fc",
      life: 8,
      maxLife: 8,
      hitRoles: []
    };
    beams.push(beam);
    if (!isPracticeMode && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "effect", kind: "beam", senderRole: me.role, beam }));
    }
    return;
  }

  me.atkType = "light";
  me.atkTimer = 8;
  me.hasHit = false;
}

function startSmashCharge(me) {
  const spec = getEffectiveSpec(me);
  if (me.cooldown > 0 || me.smashCharging) return false;

  if (me.charKey === "enhancer") {
    const now = performance.now();
    if ((me.enhanceLevel || 0) < ENHANCE_MAX_LEVEL && now >= (me.enhanceCooldownUntil || 0)) {
      me.enhanceLevel = (me.enhanceLevel || 0) + 1;
      me.enhanceCooldownUntil = now + ENHANCE_COOLDOWN_MS;
      me.cooldown = 14;
      ringEffects.push({
        x: me.x + me.w * 0.5,
        y: me.y + me.h * 0.5,
        r: 10,
        maxR: 58,
        alpha: 0.9,
        color: "#34d399"
      });
      return true;
    }
  }

  if (me.charKey === "summoner") {
    if (spawnCloneForOwner(me)) {
      me.cooldown = 16;
      return true;
    }
  }

  if (me.charKey === "elementalist") {
    if (castSelectedElementMagic(me)) {
      me.cooldown = spec.smashCooldown;
      return true;
    }
  }

  me.smashCharging = true;
  me.smashChargeStart = performance.now();
  me.smashChargeRatio = 0;
  return true;
}

function releaseSmashAttack(me) {
  if (!me.smashCharging) return;
  const now = performance.now();
  const elapsedMs = Math.max(0, now - (me.smashChargeStart || now));
  const ratio = Math.max(0, Math.min(1, elapsedMs / 850));
  me.smashChargeRatio = ratio;
  me.smashCharging = false;

  const spec = getEffectiveSpec(me);
  const chargeMult = 1.0 + ratio * 0.85;
  me.cooldown = spec.smashCooldown;

  if (me.charKey === "mage") {
    me.atkType = "smash";
    me.atkTimer = 14;
    me.hasHit = false;
    const proj = {
      id: `${me.role}_${now}_${Math.random()}`,
      ownerRole: me.role,
      x: me.facing === 1 ? me.x + me.w + 4 : me.x - 30,
      y: me.y + 8,
      w: 26,
      h: 26,
      vx: me.facing * (9.5 + ratio * 2.5),
      vy: 0,
      dmg: Math.round(spec.smashDmg * chargeMult),
      kbX: me.facing * (11.0 * chargeMult),
      kbY: -8.5 * Math.min(1.45, 1 + ratio * 0.45),
      color: "#c084fc",
      magicElement: "arcane",
      life: 65,
      pierceWalls: false
    };
    projectiles.push(proj);
    if (!isPracticeMode && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "effect", kind: "proj", senderRole: me.role, proj }));
    }
    return;
  }

  me.atkType = "smash";
  me.atkTimer = 14;
  me.hasHit = false;
}

function getMeleeHitbox(p) {
  if (!p.atkType || p.atkTimer <= 0) return null;
  const spec = getEffectiveSpec(p);
  const chargeMult = p.atkType === "smash" ? getSmashChargeMultiplier(p) : 1.0;

  let baseDmg = p.atkType === "light" ? spec.lightDmg : Math.round(spec.smashDmg * chargeMult);
  let kbX = p.atkType === "light" ? p.facing * 6.5 : p.facing * (11.5 * chargeMult);
  let kbY = p.atkType === "light" ? -4.5 : -9.0 * Math.min(1.5, 1 + (p.smashChargeRatio || 0) * 0.5);
  let width = p.atkType === "light" ? 36 : Math.round(48 + (p.smashChargeRatio || 0) * 14);
  let height = p.atkType === "light" ? 28 : 36;
  let wasCrit = false;

  if (p.charKey === "hammer" && p.atkType === "smash" && isHammerCritState(p)) {
    baseDmg += HAMMER_CRIT_BONUS_DMG;
    kbX = p.facing * 16.5;
    kbY = -12.5;
    width += 14;
    wasCrit = true;
  }

  const hx = p.facing === 1 ? p.x + p.w : p.x - width;
  const hy = p.y + (p.h - height) * 0.5;
  return {
    x: hx,
    y: hy,
    w: width,
    h: height,
    dmg: baseDmg,
    kbX,
    kbY,
    stun: p.atkType === "smash" ? 18 : 10,
    isSmash: p.atkType === "smash",
    isLight: p.atkType === "light",
    wasCrit,
    pierceGuard: wasCrit || p.charKey === "hammer"
  };
}

function applyHitToLocalPlayer(target, hit, attackerRole = 0) {
  if (!target || target.stocks <= 0) return;
  const nowMs = performance.now();
  const isCritTarget = target.charKey === "hammer" && isHammerCritState(target, nowMs);
  const isAbsTarget = target.charKey === "hammer" && isHammerAbsoluteCritMode(target, nowMs);

  if (!isAbsTarget && (target.invincibleTimer || 0) > 0) return;

  if (target.shielding && !target.burnedOut && !hit.pierceGuard && !isAbsTarget) {
    target.shieldHp = Math.max(0, target.shieldHp - (hit.dmg || 8) * 2.2);
    target.vx = (hit.kbX || 0) * 0.25;
    if (target.shieldHp <= 0) {
      target.burnedOut = true;
      target.shielding = false;
      target.stun = 90;
    }
    return;
  }

  const spec = getEffectiveSpec(target);
  const dmg = Number(hit.dmg) || 8;
  target.percent = Math.min(999, (target.percent || 0) + dmg);

  if (hit.magicElement === "ice") {
    target.frozen = true;
    target.stun = Math.max(target.stun || 0, 45);
  } else if (hit.magicElement === "fire") {
    burnDebuffs.push({
      targetRole: target.role,
      attackerRole,
      ticksLeft: 4,
      tickTimer: 25,
      dmgPerTick: 3
    });
  }

  if (target.charKey === "hammer") {
    const res = handleHammerIncomingHit(target, !!hit.isSmash, !!hit.isLight, nowMs);
    if (res.resetOccurred) {
      ringEffects.push({
        x: target.x + target.w * 0.5,
        y: target.y + target.h * 0.5,
        r: 10,
        maxR: 60,
        alpha: 0.9,
        color: "#f87171"
      });
    }
  }

  if (isAbsTarget) {
    target.stun = Math.max(target.stun || 0, Math.min(8, Number(hit.stun) || 6));
    return;
  }

  const kbScale = (1 + target.percent / 85) / Math.max(0.55, spec.weight || 1.0);
  const knockbackCap = isCritTarget ? 11.5 : 26;
  target.vx = Math.max(-knockbackCap, Math.min(knockbackCap, (Number(hit.kbX) || 0) * kbScale));
  target.vy = Math.max(-24, Math.min(20, (Number(hit.kbY) || -5) * Math.min(1.85, 0.75 + kbScale * 0.45)));
  target.stun = Math.max(target.stun || 0, Number(hit.stun) || 12);
  target.frozen = false;
}

function handlePlayerKO(p, roleNum) {
  p.stocks = Math.max(0, (p.stocks || 0) - 1);
  if (p.charKey === "enhancer") {
    p.enhanceLevel = 0;
    p.enhanceCooldownUntil = 0;
  }
  if (p.charKey === "hammer") {
    resetHammerCritAndCharge(p);
  }
  removeClone(roleNum, false);

  ringEffects.push({
    x: Math.max(40, Math.min(canvas.width - 40, p.x + p.w * 0.5)),
    y: Math.max(40, Math.min(canvas.height - 40, p.y + p.h * 0.5)),
    r: 14,
    maxR: 90,
    alpha: 0.95,
    color: p.color || "#fb7185"
  });

  if (p.stocks > 0) {
    const sp = getSpawnPoint(roleNum);
    const spec = CHAR_SPECS[p.charKey] || CHAR_SPECS.fighter;
    p.x = sp.x;
    p.y = sp.y;
    p.vx = 0;
    p.vy = 0;
    p.facing = sp.facing;
    p.jumps = spec.maxJumps || 2;
    p.dropThroughTimer = 0;
    p.warpCooldownFrames = 0;
    p.hazardCooldownFrames = 0;
    p.onIce = false;
    p.percent = 0;
    p.atkType = null;
    p.atkTimer = 0;
    p.cooldown = 0;
    p.smashCharging = false;
    p.smashChargeRatio = 0;
    p.guardianHits = 0;
    p.invincibleTimer = RESPAWN_INVINCIBLE_FRAMES;
    p.mp = MAX_MP;
    p.frozen = false;
    p.stun = 0;
    p.shielding = false;
    p.shieldHp = MAX_SHIELD;
    p.burnedOut = false;
  }
}

function checkMatchEndCondition() {
  if (phase !== "playing") return;
  const aliveRoles = getParticipantRoles().filter(r => players[r] && players[r].stocks > 0);
  if (aliveRoles.length > 1) return;

  if (gameMode === "team2v2") {
    const aliveTeams = new Set(aliveRoles.map(r => getTeamOfRole(r)));
    if (aliveTeams.size <= 1) {
      const winTeam = aliveTeams.values().next().value;
      if (winTeam === "A") {
        enterGameOverPhase({ text: "🏆 Aチーム（P1/P3）の勝利！" });
      } else if (winTeam === "B") {
        enterGameOverPhase({ text: "🏆 Bチーム（P2/P4）の勝利！" });
      } else {
        enterGameOverPhase({ text: "引き分け！" });
      }
    }
    return;
  }

  if (aliveRoles.length === 1) {
    const wr = aliveRoles[0];
    enterGameOverPhase({ text: `🏆 ${getDisplayNameOfRole(wr)} の勝利！` });
  } else if (aliveRoles.length === 0) {
    enterGameOverPhase({ text: "引き分け！" });
  }
}

function resolveStageCollisions(p, st, dtScale) {
  if ((p.dropThroughTimer || 0) > 0) {
    p.dropThroughTimer = Math.max(0, p.dropThroughTimer - dtScale);
  }
  if ((p.warpCooldownFrames || 0) > 0) {
    p.warpCooldownFrames = Math.max(0, p.warpCooldownFrames - dtScale);
  }
  if ((p.hazardCooldownFrames || 0) > 0) {
    p.hazardCooldownFrames = Math.max(0, p.hazardCooldownFrames - dtScale);
  }

  const spec = getEffectiveSpec(p);
  const maxJumps = spec.maxJumps || 2;
  const prevBottom = p.y + p.h - p.vy * dtScale;
  p.onIce = false;

  for (const s of (st.solids || [])) {
    if (rectsOverlap(p, s)) {
      if (p.vy >= 0 && prevBottom <= s.y + 12) {
        p.y = s.y - p.h;
        p.vy = 0;
        p.jumps = maxJumps;
      } else if (p.vy < 0 && p.y >= s.y + s.h - 12) {
        p.y = s.y + s.h;
        p.vy = 0;
      } else if (p.vx > 0) {
        p.x = s.x - p.w;
        p.vx = 0;
      } else if (p.vx < 0) {
        p.x = s.x + s.w;
        p.vx = 0;
      }
    }
  }

  const allOneWayPlats = [
    ...(st.platforms || []),
    ...(st.movingPlatforms || []),
    ...getVisibleDisappearingPlatforms(st)
  ];

  for (const plat of allOneWayPlats) {
    if ((p.dropThroughTimer || 0) > 0 && p.vy >= 0) continue;
    const withinX = p.x + p.w > plat.x + 2 && p.x < plat.x + plat.w - 2;
    if (withinX && p.vy >= 0 && prevBottom <= plat.y + 12 && p.y + p.h >= plat.y) {
      p.y = plat.y - p.h;
      p.vy = 0;
      p.jumps = maxJumps;
      if (typeof plat.dx === "number") p.x += plat.dx;
      if (typeof plat.dy === "number") p.y += plat.dy;
    }
  }

  if (Array.isArray(st.iceFloors)) {
    for (const ice of st.iceFloors) {
      const touchingIce =
        p.x + p.w > ice.x &&
        p.x < ice.x + ice.w &&
        Math.abs((p.y + p.h) - ice.y) <= 6 &&
        p.vy >= 0;
      if (touchingIce) {
        p.onIce = true;
      }
    }
  }

  if (Array.isArray(st.springs)) {
    for (const sp of st.springs) {
      if (rectsOverlap(p, sp)) {
        p.y = sp.y - p.h;
        p.vy = sp.bounceVy || -18;
        p.jumps = Math.max(1, maxJumps - 1);
        ringEffects.push({
          x: sp.x + sp.w * 0.5,
          y: sp.y,
          r: 6,
          maxR: 38,
          alpha: 0.85,
          color: "#4ade80"
        });
      }
    }
  }

  if (Array.isArray(st.warps) && (p.warpCooldownFrames || 0) <= 0) {
    for (const wp of st.warps) {
      if (rectsOverlap(p, wp)) {
        const dest = st.warps.find(other => other.id === wp.pairId);
        if (dest) {
          ringEffects.push({
            x: wp.x + wp.w * 0.5,
            y: wp.y + wp.h * 0.5,
            r: 8,
            maxR: 42,
            alpha: 0.85,
            color: wp.color || "#38bdf8"
          });
          p.x = dest.x + (dest.w - p.w) * 0.5;
          p.y = dest.y + dest.h - p.h;
          p.vy = Math.min(p.vy, -2);
          p.warpCooldownFrames = 35;
          ringEffects.push({
            x: dest.x + dest.w * 0.5,
            y: dest.y + dest.h * 0.5,
            r: 8,
            maxR: 46,
            alpha: 0.9,
            color: dest.color || "#38bdf8"
          });
          break;
        }
      }
    }
  }

  if (Array.isArray(st.hazardZones) && (p.hazardCooldownFrames || 0) <= 0) {
    for (const hz of st.hazardZones) {
      if (rectsOverlap(p, hz)) {
        const kbDir = (p.x + p.w * 0.5) < (hz.x + hz.w * 0.5) ? -1 : 1;
        applyHitToLocalPlayer(p, {
          dmg: hz.dmg || 7,
          kbX: kbDir * Math.abs(hz.kbX || 7.0),
          kbY: hz.kbY || -13.0,
          stun: 14,
          isSmash: false,
          isLight: false,
          magicElement: "fire"
        }, 0);
        p.hazardCooldownFrames = 24;
        break;
      }
    }
  }
}

function getBotDecision(bot, st) {
  const lv = Math.max(1, Math.min(10, practiceBotLevel || 5));
  const { minX, maxX, groundY } = getStageBounds();
  const input = { left: false, right: false, jump: false, drop: false, light: false, smash: false, shield: false };

  const isOffstage = bot.x < minX - 15 || bot.x > maxX + 15 || bot.y > groundY + 12;
  if (isOffstage) {
    const targetX = getRecoveryTargetX(bot);
    if (bot.x < targetX - 18) input.right = true;
    else if (bot.x > targetX + 18) input.left = true;
    const interval = getBotRecoveryJumpInterval(lv);
    if (bot.vy > 1.2 && bot.jumps > 0 && Math.floor(performance.now() / 16) % interval === 0) {
      input.jump = true;
    }
    return input;
  }

  let nearest = null;
  let bestDist = Infinity;
  for (const r of getParticipantRoles()) {
    if (r === bot.role || isSameTeam(bot.role, r)) continue;
    const cand = players[r];
    if (!cand || cand.stocks <= 0) continue;
    const d = Math.hypot((cand.x + cand.w * 0.5) - (bot.x + bot.w * 0.5), (cand.y + cand.h * 0.5) - (bot.y + bot.h * 0.5));
    if (d < bestDist) {
      bestDist = d;
      nearest = cand;
    }
  }

  if (!nearest) return input;

  const dx = (nearest.x + nearest.w * 0.5) - (bot.x + bot.w * 0.5);
  const dy = (nearest.y + nearest.h * 0.5) - (bot.y + bot.h * 0.5);
  const absDx = Math.abs(dx);
  const aggro = 0.25 + lv * 0.075;

  if (absDx > 42) {
    if (dx > 0) input.right = true;
    else input.left = true;
  }

  if (dy < -55 && bot.jumps > 0 && Math.random() < aggro * 0.22) {
    input.jump = true;
  } else if (dy > 55 && Math.random() < aggro * 0.14) {
    input.drop = true;
  }

  if (bot.cooldown <= 0 && !bot.smashCharging) {
    if (absDx < 62 && Math.abs(dy) < 44 && Math.random() < aggro * 0.28) {
      input.light = true;
    } else if (absDx < 85 && Math.abs(dy) < 50 && Math.random() < aggro * 0.14) {
      input.smash = true;
    }
  }

  if (lv >= 5 && nearest.atkType && absDx < 75 && Math.abs(dy) < 45 && Math.random() < (lv - 4) * 0.04) {
    input.shield = true;
  }

  return input;
}

function updatePlayerEntity(p, input, st, dtScale) {
  const spec = getEffectiveSpec(p);
  const nowMs = performance.now();
  ensureHammerCritState(p, nowMs);

  if ((p.invincibleTimer || 0) > 0) {
    p.invincibleTimer = Math.max(0, p.invincibleTimer - dtScale);
  }
  if (p.charKey === "guardian" && (p.guardianHits || 0) >= GUARDIAN_INVINCIBLE_HITS) {
    p.guardianHits = 0;
    p.invincibleTimer = Math.max(p.invincibleTimer || 0, GUARDIAN_INVINCIBLE_FRAMES);
  }

  if (p.charKey === "elementalist") {
    p.mp = Math.min(MAX_MP, (p.mp || 0) + 0.22 * dtScale);
  }

  if ((p.cooldown || 0) > 0) {
    p.cooldown = Math.max(0, p.cooldown - dtScale);
  }
  if ((p.atkTimer || 0) > 0) {
    p.atkTimer = Math.max(0, p.atkTimer - dtScale);
    if (p.atkTimer <= 0) {
      p.atkType = null;
      p.hasHit = false;
    }
  }

  if ((p.stun || 0) > 0) {
    p.stun = Math.max(0, p.stun - dtScale);
    if (p.stun <= 0) p.frozen = false;
  }

  if (p.burnedOut) {
    p.shieldHp = Math.min(MAX_SHIELD, (p.shieldHp || 0) + 0.45 * dtScale);
    if (p.shieldHp >= MAX_SHIELD * 0.5) {
      p.burnedOut = false;
    }
  }

  const canAct = (p.stun || 0) <= 0 && !p.frozen;

  if (canAct && input.shield && !p.burnedOut && (p.shieldHp || 0) > 0) {
    p.shielding = true;
    p.shieldHp = Math.max(0, p.shieldHp - (spec.shieldDrain || 0.38) * dtScale);
    if (p.shieldHp <= 0) {
      p.shielding = false;
      p.burnedOut = true;
      p.stun = 90;
    }
  } else {
    p.shielding = false;
    if (!p.burnedOut) {
      p.shieldHp = Math.min(MAX_SHIELD, (p.shieldHp || 0) + 0.22 * dtScale);
    }
  }

  if (canAct && !p.shielding) {
    if (input.left) {
      p.vx -= spec.moveAcc * dtScale;
      if (!p.smashCharging) p.facing = -1;
    }
    if (input.right) {
      p.vx += spec.moveAcc * dtScale;
      if (!p.smashCharging) p.facing = 1;
    }
    if (input.drop) {
      p.dropThroughTimer = 10;
    }
    if (input.jump && (p.jumps || 0) > 0) {
      p.vy = spec.jumpPower;
      p.jumps -= 1;
      p.dropThroughTimer = 0;
    }
    if (input.light && (p.cooldown || 0) <= 0) {
      triggerLightAttack(p);
    }
    if (input.smash && !p.smashCharging && (p.cooldown || 0) <= 0) {
      startSmashCharge(p);
    }
  }

  if (p.smashCharging) {
    p.smashChargeRatio = Math.min(1, Math.max(0, (nowMs - (p.smashChargeStart || nowMs)) / 850));
    if (!input.smash || !canAct) {
      releaseSmashAttack(p);
    }
  }

  const friction = p.onIce ? 0.965 : (spec.friction || 0.82);
  p.vx *= Math.pow(friction, dtScale);
  p.vy = Math.min(22, p.vy + 0.58 * dtScale);

  p.x += p.vx * dtScale;
  p.y += p.vy * dtScale;

  resolveStageCollisions(p, st, dtScale);

  if (p.x < -120 || p.x > canvas.width + 120 || p.y < -180 || p.y > canvas.height + 120) {
    handlePlayerKO(p, p.role);
  }
}

function updateClones(st, dtScale) {
  const ownerKeys = Object.keys(clones);
  for (const key of ownerKeys) {
    const c = clones[key];
    if (!c) continue;
    const ownerRole = Number(key);
    const spec = CHAR_SPECS[c.charKey] || CHAR_SPECS.fighter;

    if ((c.cooldown || 0) > 0) c.cooldown = Math.max(0, c.cooldown - dtScale);
    if ((c.atkTimer || 0) > 0) {
      c.atkTimer = Math.max(0, c.atkTimer - dtScale);
      if (c.atkTimer <= 0) {
        c.atkType = null;
        c.hasHit = false;
      }
    }

    c.aiTimer = (c.aiTimer || 0) + dtScale;
    let target = null;
    let bestD = Infinity;
    for (const r of getParticipantRoles()) {
      if (r === ownerRole || isSameTeam(ownerRole, r)) continue;
      const cand = players[r];
      if (!cand || cand.stocks <= 0) continue;
      const d = Math.hypot((cand.x + cand.w * 0.5) - (c.x + c.w * 0.5), (cand.y + cand.h * 0.5) - (c.y + c.h * 0.5));
      if (d < bestD) {
        bestD = d;
        target = cand;
      }
    }

    if (target) {
      const dx = (target.x + target.w * 0.5) - (c.x + c.w * 0.5);
      const dy = (target.y + target.h * 0.5) - (c.y + c.h * 0.5);
      if (Math.abs(dx) > 36) {
        c.vx += (dx > 0 ? 0.85 : -0.85) * dtScale;
        c.facing = dx > 0 ? 1 : -1;
      }
      if (dy < -50 && c.jumps > 0 && Math.floor(c.aiTimer) % 24 === 0) {
        c.vy = spec.jumpPower * 0.95;
        c.jumps -= 1;
      }
      if (c.cooldown <= 0 && Math.abs(dx) < 58 && Math.abs(dy) < 42) {
        c.atkType = "light";
        c.atkTimer = 8;
        c.cooldown = 22;
        c.hasHit = false;
      }
    }

    c.vx *= Math.pow(0.82, dtScale);
    c.vy = Math.min(20, c.vy + 0.58 * dtScale);
    c.x += c.vx * dtScale;
    c.y += c.vy * dtScale;

    const prevB = c.y + c.h - c.vy * dtScale;
    for (const s of (st.solids || [])) {
      if (rectsOverlap(c, s) && c.vy >= 0 && prevB <= s.y + 12) {
        c.y = s.y - c.h;
        c.vy = 0;
        c.jumps = 2;
      }
    }
    for (const plat of [...(st.platforms || []), ...(st.movingPlatforms || []), ...getVisibleDisappearingPlatforms(st)]) {
      if (c.x + c.w > plat.x && c.x < plat.x + plat.w && c.vy >= 0 && prevB <= plat.y + 12 && c.y + c.h >= plat.y) {
        c.y = plat.y - c.h;
        c.vy = 0;
        c.jumps = 2;
      }
    }

    if (c.atkType && c.atkTimer > 0 && !c.hasHit) {
      const hbW = 34;
      const hbH = 26;
      const hb = {
        x: c.facing === 1 ? c.x + c.w : c.x - hbW,
        y: c.y + (c.h - hbH) * 0.5,
        w: hbW,
        h: hbH
      };
      const originX = c.x + c.w * 0.5;
      const originY = c.y + c.h * 0.5;
      for (const r of getParticipantRoles()) {
        if (r === ownerRole || isSameTeam(ownerRole, r)) continue;
        const tp = players[r];
        if (!tp || tp.stocks <= 0) continue;
        if (doesMeleeHitEntity(hb, originX, originY, tp)) {
          c.hasHit = true;
          const hitPayload = {
            dmg: 6,
            kbX: c.facing * 6.0,
            kbY: -4.5,
            stun: 9,
            isSmash: false,
            isLight: true
          };
          if (isPracticeMode && tp.isBot) {
            applyHitToLocalPlayer(tp, hitPayload, ownerRole);
          } else if (!isPracticeMode && r === myRole && !isSpectator) {
            applyHitToLocalPlayer(tp, hitPayload, ownerRole);
          } else if (!isPracticeMode && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
              type: "effect",
              kind: "hit_apply",
              senderRole: myRole || ownerRole,
              attackerRole: ownerRole,
              targetRole: r,
              hit: hitPayload
            }));
          }
          break;
        }
      }
    }

    if (c.percent >= (c.maxPercent || SUMMON_CLONE_MAX_PERCENT) || c.y > canvas.height + 80 || c.x < -80 || c.x > canvas.width + 80) {
      removeClone(ownerRole, true);
    }
  }
}

function updateProjectilesAndEffects(dtScale) {
  const nextProj = [];
  for (const pr of projectiles) {
    pr.x += (pr.vx || 0) * dtScale;
    pr.y += (pr.vy || 0) * dtScale;
    pr.life = (pr.life || 40) - dtScale;
    if (pr.life <= 0 || pr.x < -60 || pr.x > canvas.width + 60) continue;

    if (!pr.pierceWalls) {
      const obstacles = getAllStageObstacles();
      let hitWall = false;
      for (const ob of obstacles) {
        if (rectsOverlap(pr, ob)) {
          hitWall = true;
          break;
        }
      }
      if (hitWall) {
        ringEffects.push({
          x: pr.x + pr.w * 0.5,
          y: pr.y + pr.h * 0.5,
          r: 6,
          maxR: 28,
          alpha: 0.75,
          color: pr.color || "#38bdf8"
        });
        continue;
      }
    }

    let consumed = false;
    const ownerRole = Number(pr.ownerRole) || 0;
    if (isPracticeMode && ownerRole === 1) {
      const bot = players[2];
      if (bot && bot.stocks > 0 && rectsOverlap(pr, bot)) {
        applyHitToLocalPlayer(bot, {
          dmg: pr.dmg || 10,
          kbX: pr.kbX || 7,
          kbY: pr.kbY || -5,
          stun: 14,
          isSmash: true,
          isLight: false,
          magicElement: pr.magicElement || null
        }, ownerRole);
        consumed = true;
      }
    } else if (!isPracticeMode && ownerRole === myRole) {
      for (const r of getParticipantRoles()) {
        if (r === myRole || isSameTeam(myRole, r)) continue;
        const tp = players[r];
        if (!tp || tp.stocks <= 0) continue;
        if (rectsOverlap(pr, tp)) {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
              type: "effect",
              kind: "hit_apply",
              senderRole: myRole,
              attackerRole: myRole,
              targetRole: r,
              hit: {
                dmg: pr.dmg || 10,
                kbX: pr.kbX || 7,
                kbY: pr.kbY || -5,
                stun: 14,
                isSmash: true,
                isLight: false,
                magicElement: pr.magicElement || null
              }
            }));
          }
          consumed = true;
          break;
        }
      }
    }

    if (!consumed) nextProj.push(pr);
  }
  projectiles = nextProj;

  const nextBeams = [];
  for (const bm of beams) {
    bm.life = (bm.life || 6) - dtScale;
    if (bm.life <= 0) continue;
    const clipped = getClippedBeamRect(bm);
    const ownerRole = Number(bm.ownerRole) || 0;
    const hitSet = new Set(bm.hitRoles || []);

    if (clipped.w > 0) {
      if (isPracticeMode && ownerRole === 1) {
        const bot = players[2];
        if (bot && bot.stocks > 0 && !hitSet.has(2) && rectsOverlap(clipped, bot)) {
          hitSet.add(2);
          applyHitToLocalPlayer(bot, {
            dmg: bm.dmg || 8,
            kbX: bm.kbX || 6,
            kbY: bm.kbY || -4,
            stun: 10,
            isSmash: false,
            isLight: true
          }, ownerRole);
        }
      } else if (!isPracticeMode && ownerRole === myRole) {
        for (const r of getParticipantRoles()) {
          if (r === myRole || isSameTeam(myRole, r) || hitSet.has(r)) continue;
          const tp = players[r];
          if (!tp || tp.stocks <= 0) continue;
          if (rectsOverlap(clipped, tp)) {
            hitSet.add(r);
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({
                type: "effect",
                kind: "hit_apply",
                senderRole: myRole,
                attackerRole: myRole,
                targetRole: r,
                hit: {
                  dmg: bm.dmg || 8,
                  kbX: bm.kbX || 6,
                  kbY: bm.kbY || -4,
                  stun: 10,
                  isSmash: false,
                  isLight: true
                }
              }));
            }
          }
        }
      }
    }
    bm.hitRoles = Array.from(hitSet);
    nextBeams.push(bm);
  }
  beams = nextBeams;

  const nextRings = [];
  for (const rg of ringEffects) {
    rg.r += ((rg.maxR || 60) - (rg.r || 10)) * 0.22 * dtScale + 2.5 * dtScale;
    rg.alpha = (rg.alpha || 0.8) - 0.045 * dtScale;
    if (rg.alpha > 0.02 && rg.r <= (rg.maxR || 60) + 10) {
      nextRings.push(rg);
    }
  }
  ringEffects = nextRings;

  const nextBurns = [];
  for (const bd of burnDebuffs) {
    bd.tickTimer -= dtScale;
    if (bd.tickTimer <= 0) {
      bd.tickTimer = 25;
      bd.ticksLeft -= 1;
      const target = players[bd.targetRole];
      if (target && target.stocks > 0) {
        if (isPracticeMode && target.isBot) {
          target.percent = Math.min(999, (target.percent || 0) + (bd.dmgPerTick || 3));
        } else if (!isPracticeMode && target.role === myRole && !isSpectator) {
          target.percent = Math.min(999, (target.percent || 0) + (bd.dmgPerTick || 3));
        }
      }
    }
    if (bd.ticksLeft > 0) nextBurns.push(bd);
  }
  burnDebuffs = nextBurns;
}

function stepGameplay(dtScale) {
  const st = getCurrentStage();
  updateStageGimmicks(dtScale);

  const jumpPressed = !!(keys["KeyW"] || keys["ArrowUp"]);
  const dropPressed = !!(keys["KeyS"] || keys["ArrowDown"]);
  const lightPressed = !!keys["KeyL"];
  const smashPressed = !!keys["KeyK"];
  const magicSwitchPressed = !!keys["KeyI"];
  const shieldPressed = !!keys["KeyJ"];

  const jumpEdge = jumpPressed && !prevJumpPressed;
  const dropEdge = dropPressed && !prevDropPressed;
  const lightEdge = lightPressed && !prevLightPressed;
  const smashEdge = smashPressed && !prevSmashPressed;
  const magicSwitchEdge = magicSwitchPressed && !prevMagicSwitchPressed;

  prevJumpPressed = jumpPressed;
  prevDropPressed = dropPressed;
  prevLightPressed = lightPressed;
  prevSmashPressed = smashPressed;
  prevMagicSwitchPressed = magicSwitchPressed;

  if (isPracticeMode) {
    if (isPracticeStopped || phase !== "playing") return;
    const me = players[1];
    const bot = players[2];
    if (!me || !bot) return;

    if (magicSwitchEdge && me.charKey === "elementalist") {
      cycleElementMagicMode(me);
    }

    const myInput = {
      left: !!keys["KeyA"] || !!keys["ArrowLeft"],
      right: !!keys["KeyD"] || !!keys["ArrowRight"],
      jump: jumpEdge,
      drop: dropEdge || dropPressed,
      light: lightEdge,
      smash: smashPressed || smashEdge,
      shield: shieldPressed
    };
    updatePlayerEntity(me, myInput, st, dtScale);

    const botInput = getBotDecision(bot, st);
    updatePlayerEntity(bot, botInput, st, dtScale);

    [me, bot].forEach(attacker => {
      if (attacker.atkType && attacker.atkTimer > 0 && !attacker.hasHit) {
        const hb = getMeleeHitbox(attacker);
        const defender = attacker.role === 1 ? bot : me;
        if (hb && defender && defender.stocks > 0) {
          const originX = attacker.x + attacker.w * 0.5;
          const originY = attacker.y + attacker.h * 0.5;
          if (doesMeleeHitEntity(hb, originX, originY, defender)) {
            attacker.hasHit = true;
            if (attacker.charKey === "hammer" && attacker.atkType === "smash") {
              handleHammerHitProgress(attacker, !!hb.wasCrit);
            }
            if (attacker.charKey === "guardian" && attacker.atkType === "light") {
              attacker.guardianHits = (attacker.guardianHits || 0) + 1;
            }
            applyHitToLocalPlayer(defender, hb, attacker.role);
          }
        }
      }
    });

    updateClones(st, dtScale);
    updateProjectilesAndEffects(dtScale);
    checkMatchEndCondition();
    return;
  }

  if (phase !== "playing" || isSpectator || myRole === 0) {
    updateProjectilesAndEffects(dtScale);
    return;
  }

  const me = players[myRole];
  if (!me || me.stocks <= 0) {
    updateProjectilesAndEffects(dtScale);
    return;
  }

  if (magicSwitchEdge && me.charKey === "elementalist") {
    cycleElementMagicMode(me);
  }

  const myInput = {
    left: !!keys["KeyA"] || !!keys["ArrowLeft"],
    right: !!keys["KeyD"] || !!keys["ArrowRight"],
    jump: jumpEdge,
    drop: dropEdge || dropPressed,
    light: lightEdge,
    smash: smashPressed || smashEdge,
    shield: shieldPressed
  };
  updatePlayerEntity(me, myInput, st, dtScale);

  if (me.atkType && me.atkTimer > 0 && !me.hasHit) {
    const hb = getMeleeHitbox(me);
    if (hb) {
      const originX = me.x + me.w * 0.5;
      const originY = me.y + me.h * 0.5;
      for (const r of getParticipantRoles()) {
        if (r === myRole || isSameTeam(myRole, r)) continue;
        const target = players[r];
        if (!target || target.stocks <= 0) continue;
        if (doesMeleeHitEntity(hb, originX, originY, target)) {
          me.hasHit = true;
          if (me.charKey === "hammer" && me.atkType === "smash") {
            handleHammerHitProgress(me, !!hb.wasCrit);
          }
          if (me.charKey === "guardian" && me.atkType === "light") {
            me.guardianHits = (me.guardianHits || 0) + 1;
          }
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({
              type: "effect",
              kind: "hit_apply",
              senderRole: myRole,
              attackerRole: myRole,
              targetRole: r,
              hit: hb
            }));
          }
          break;
        }
      }
    }
  }

  updateClones(st, dtScale);
  updateProjectilesAndEffects(dtScale);
  checkMatchEndCondition();

  const now = performance.now();
  if (now - lastStateSentAt >= STATE_SEND_INTERVAL_MS && ws && ws.readyState === WebSocket.OPEN) {
    lastStateSentAt = now;
    ws.send(JSON.stringify({
      type: "state",
      role: myRole,
      name: myName,
      color: myColor,
      spectator: isSpectator,
      charKey: me.charKey,
      x: me.x,
      y: me.y,
      vx: me.vx,
      vy: me.vy,
      facing: me.facing,
      percent: me.percent,
      stocks: me.stocks,
      atkType: me.atkType,
      atkTimer: me.atkTimer,
      smashCharging: me.smashCharging,
      smashChargeRatio: me.smashChargeRatio,
      enhanceLevel: me.enhanceLevel,
      hammerCharge: me.hammerCharge,
      critReady: me.critReady,
      critActive: me.critActive,
      critStartedAt: me.critStartedAt,
      critLightHitsAfterExpiry: me.critLightHitsAfterExpiry,
      guardianHits: me.guardianHits,
      invincibleTimer: me.invincibleTimer,
      hasClone: me.hasClone,
      mp: me.mp,
      magicMode: me.magicMode,
      frozen: me.frozen,
      stun: me.stun,
      shielding: me.shielding,
      shieldHp: me.shieldHp,
      burnedOut: me.burnedOut
    }));
  }
}

function drawStageAndGimmicks(st) {
  ctx.fillStyle = st.bgColor || "#273244";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const s of (st.solids || [])) {
    ctx.fillStyle = st.groundColor || "#94a3b8";
    ctx.fillRect(s.x, s.y, s.w, s.h);
    ctx.strokeStyle = st.groundBorder || "#cbd5e1";
    ctx.lineWidth = 2;
    ctx.strokeRect(s.x, s.y, s.w, s.h);
  }

  for (const plat of (st.platforms || [])) {
    ctx.fillStyle = st.platColor || "#64748b";
    ctx.fillRect(plat.x, plat.y, plat.w, plat.h);
    ctx.strokeStyle = "#cbd5e1";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(plat.x, plat.y, plat.w, plat.h);
  }

  for (const mp of (st.movingPlatforms || [])) {
    ctx.fillStyle = "#38bdf8";
    ctx.fillRect(mp.x, mp.y, mp.w, mp.h);
    ctx.strokeStyle = "#e0f2fe";
    ctx.lineWidth = 2;
    ctx.strokeRect(mp.x, mp.y, mp.w, mp.h);
  }

  for (const dp of (st.disappearingPlatforms || [])) {
    if (dp.visible === false) {
      ctx.save();
      ctx.setLineDash([5, 5]);
      ctx.strokeStyle = "rgba(226, 232, 240, 0.35)";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(dp.x, dp.y, dp.w, dp.h);
      ctx.restore();
    } else {
      ctx.fillStyle = "#c084fc";
      ctx.fillRect(dp.x, dp.y, dp.w, dp.h);
      ctx.strokeStyle = "#f3e8ff";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(dp.x, dp.y, dp.w, dp.h);
    }
  }

  for (const sp of (st.springs || [])) {
    ctx.fillStyle = "#22c55e";
    ctx.fillRect(sp.x, sp.y, sp.w, sp.h);
    ctx.strokeStyle = "#dcfce7";
    ctx.lineWidth = 2;
    ctx.strokeRect(sp.x, sp.y, sp.w, sp.h);
  }

  for (const wp of (st.warps || [])) {
    ctx.save();
    ctx.strokeStyle = wp.color || "#38bdf8";
    ctx.fillStyle = "rgba(56, 189, 248, 0.22)";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.ellipse(wp.x + wp.w * 0.5, wp.y + wp.h * 0.5, wp.w * 0.5, wp.h * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  for (const hz of (st.hazardZones || [])) {
    ctx.fillStyle = "rgba(239, 68, 68, 0.85)";
    ctx.fillRect(hz.x, hz.y, hz.w, hz.h);
    ctx.strokeStyle = "#fca5a5";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(hz.x, hz.y, hz.w, hz.h);
  }

  for (const ice of (st.iceFloors || [])) {
    ctx.fillStyle = "rgba(125, 211, 252, 0.75)";
    ctx.fillRect(ice.x, ice.y, ice.w, ice.h);
  }
}

function drawPlayerEntity(p, roleNum) {
  const col = getColorOfRole(roleNum);
  const spec = getEffectiveSpec(p);
  const displayName = getDisplayNameOfRole(roleNum);
  const nowMs = performance.now();
  const absCrit = p.charKey === "hammer" && isHammerAbsoluteCritMode(p, nowMs);
  const inCrit = p.charKey === "hammer" && isHammerCritState(p, nowMs);

  ctx.save();
  if ((p.invincibleTimer || 0) > 0 && Math.floor(nowMs / 70) % 2 === 0) {
    ctx.globalAlpha = 0.55;
  }

  ctx.fillStyle = col;
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.strokeStyle = absCrit ? "#fde047" : (inCrit ? "#fb923c" : "#f8fafc");
  ctx.lineWidth = absCrit ? 3 : 2;
  ctx.strokeRect(p.x, p.y, p.w, p.h);

  const eyeX = p.facing === 1 ? p.x + p.w - 11 : p.x + 5;
  ctx.fillStyle = p.frozen ? "#7dd3fc" : "#0f172a";
  ctx.fillRect(eyeX, p.y + 10, 6, 6);

  if (p.shielding && !p.burnedOut) {
    ctx.strokeStyle = "#38bdf8";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(p.x + p.w * 0.5, p.y + p.h * 0.5, 32, 0, Math.PI * 2);
    ctx.stroke();
  }

  const hb = getMeleeHitbox(p);
  if (hb && p.atkType && p.atkTimer > 0) {
    ctx.fillStyle = hb.wasCrit ? "rgba(253, 224, 71, 0.55)" : (p.atkType === "smash" ? "rgba(251, 146, 60, 0.45)" : "rgba(248, 250, 252, 0.35)");
    ctx.fillRect(hb.x, hb.y, hb.w, hb.h);
  }

  if (p.smashCharging) {
    const barW = 44;
    const bx = p.x + p.w * 0.5 - barW * 0.5;
    const by = p.y - 26;
    ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
    ctx.fillRect(bx, by, barW, 6);
    ctx.fillStyle = "#fbbf24";
    ctx.fillRect(bx, by, barW * Math.min(1, p.smashChargeRatio || 0), 6);
  }

  ctx.font = "bold 12px sans-serif";
  ctx.textAlign = "center";
  ctx.fillStyle = "#f8fafc";
  const badgeParts = [`${displayName} (${spec.shortName})`];
  if (p.charKey === "enhancer" && (p.enhanceLevel || 0) > 0) badgeParts.push(`強化Lv.${p.enhanceLevel}`);
  if (p.charKey === "hammer") {
    if (absCrit) badgeParts.push(`会心絶対 ${getHammerRemainingAbsSec(p, nowMs).toFixed(1)}s`);
    else if (inCrit) badgeParts.push("会心(解除可)");
    else badgeParts.push(`槌${p.hammerCharge || 0}/120`);
  }
  if (p.charKey === "elementalist") {
    const mInfo = MAGIC_INFO[p.magicMode] || MAGIC_INFO.fire;
    badgeParts.push(`${mInfo.label} MP${Math.floor(p.mp || 0)}`);
  }
  ctx.fillText(badgeParts.join(" "), p.x + p.w * 0.5, p.y - 8);
  ctx.restore();
}

function drawHudOverlay() {
  const st = getCurrentStage();
  ctx.save();
  ctx.font = "bold 13px sans-serif";
  ctx.textAlign = "left";
  ctx.fillStyle = "rgba(15, 23, 42, 0.78)";
  ctx.fillRect(12, 12, 260, 26);
  ctx.fillStyle = "#e2e8f0";
  ctx.fillText(`ステージ：${st.name}`, 20, 29);

  const hudRoles = getParticipantRoles();
  const slotW = 240;
  const gap = 14;
  const totalW = hudRoles.length * slotW + Math.max(0, hudRoles.length - 1) * gap;
  let startX = Math.max(12, (canvas.width - totalW) * 0.5);
  const y = canvas.height - 68;

  hudRoles.forEach((r, idx) => {
    const p = players[r] || makePlayer(r, selectedChar);
    const x = startX + idx * (slotW + gap);
    const col = getColorOfRole(r);
    const name = getDisplayNameOfRole(r);
    const spec = CHAR_SPECS[p.charKey] || CHAR_SPECS.fighter;

    ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
    ctx.fillRect(x, y, slotW, 56);
    ctx.strokeStyle = col;
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, slotW, 56);

    ctx.fillStyle = col;
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText(`${name} [${spec.shortName}]`, x + 8, y + 16);

    ctx.fillStyle = "#fbbf24";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText(`${Math.floor(p.percent || 0)}%`, x + 8, y + 36);

    const stockCount = Math.max(0, p.stocks || 0);
    ctx.fillStyle = "#f8fafc";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "right";
    ctx.fillText(`残機 ${"♥".repeat(stockCount)}${"♡".repeat(Math.max(0, MAX_STOCK - stockCount))}`, x + slotW - 8, y + 16);

    if (p.charKey === "elementalist") {
      const mInfo = MAGIC_INFO[p.magicMode] || MAGIC_INFO.fire;
      ctx.fillStyle = mInfo.color;
      ctx.fillText(`MP:${Math.floor(p.mp || 0)} [${mInfo.label}]`, x + slotW - 8, y + 36);
    } else if (p.charKey === "hammer") {
      ctx.fillStyle = "#fb923c";
      ctx.fillText(`チャージ:${p.hammerCharge || 0}/120`, x + slotW - 8, y + 36);
    } else if (p.charKey === "enhancer") {
      ctx.fillStyle = "#34d399";
      ctx.fillText(`強化:Lv.${p.enhanceLevel || 0}/${ENHANCE_MAX_LEVEL}`, x + slotW - 8, y + 36);
    }

    ctx.fillStyle = "rgba(30, 41, 59, 0.9)";
    ctx.fillRect(x + 8, y + 43, slotW - 16, 6);
    ctx.fillStyle = p.burnedOut ? "#ef4444" : "#38bdf8";
    ctx.fillRect(x + 8, y + 43, (slotW - 16) * Math.max(0, Math.min(1, (p.shieldHp || 0) / MAX_SHIELD)), 6);
  });

  if (phase === "countdown") {
    ctx.fillStyle = "rgba(15, 23, 42, 0.65)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#fbbf24";
    ctx.font = "bold 64px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(countdownLeft > 0 ? String(countdownLeft) : "GO!", canvas.width * 0.5, canvas.height * 0.5);
  } else if (phase === "gameover" && winnerInfo) {
    ctx.fillStyle = "rgba(15, 23, 42, 0.72)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#fde047";
    ctx.font = "bold 40px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(winnerInfo.text || "決着！", canvas.width * 0.5, canvas.height * 0.46);
    ctx.fillStyle = "#e2e8f0";
    ctx.font = "bold 18px sans-serif";
    ctx.fillText(`${resultSecLeft}秒後にキャラ選択画面へ戻ります...`, canvas.width * 0.5, canvas.height * 0.56);
  }

  ctx.restore();
}

function renderScene() {
  const st = getCurrentStage();
  drawStageAndGimmicks(st);

  for (const pr of projectiles) {
    ctx.save();
    ctx.fillStyle = pr.color || "#38bdf8";
    ctx.fillRect(pr.x, pr.y, pr.w, pr.h);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.5;
    ctx.strokeRect(pr.x, pr.y, pr.w, pr.h);
    ctx.restore();
  }

  for (const bm of beams) {
    const clipped = getClippedBeamRect(bm);
    if (clipped.w > 0) {
      ctx.save();
      ctx.fillStyle = bm.color || "rgba(192, 132, 252, 0.7)";
      ctx.fillRect(clipped.x, clipped.y, clipped.w, clipped.h);
      ctx.restore();
    }
  }

  Object.keys(clones).forEach(ownerKey => {
    const c = clones[ownerKey];
    if (!c) return;
    ctx.save();
    ctx.globalAlpha = 0.78;
    ctx.fillStyle = c.color || "#2dd4bf";
    ctx.fillRect(c.x, c.y, c.w, c.h);
    ctx.strokeStyle = "#fef08a";
    ctx.lineWidth = 2;
    ctx.strokeRect(c.x, c.y, c.w, c.h);
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "#fef08a";
    ctx.fillText(`分身(${c.charShort || "分身"}) ${Math.floor(c.percent || 0)}%`, c.x + c.w * 0.5, c.y - 6);
    ctx.restore();
  });

  for (const r of getParticipantRoles()) {
    const p = players[r];
    if (p && p.stocks > 0) {
      drawPlayerEntity(p, r);
    }
  }

  for (const rg of ringEffects) {
    ctx.save();
    ctx.strokeStyle = rg.color || "#fde047";
    ctx.globalAlpha = Math.max(0, rg.alpha || 0);
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  drawHudOverlay();
}

function gameLoop(now) {
  const dt = Math.min(40, Math.max(0, now - lastFrameTime));
  lastFrameTime = now;
  const dtScale = dt / 16.6667;

  stepGameplay(dtScale);
  renderScene();
  requestAnimationFrame(gameLoop);
}

initDropdownOptions();
initColorPaletteDOM();
updatePassphraseBadge();
updateRoomStatusBox();
updateControlsVisibility();
updateStatusByPhase();
updateChatVisibility();
requestAnimationFrame(gameLoop);
</script>
